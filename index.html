let joystickActive=false,joystickTouchId=null,joystickVector={x:0,y:0};
let lookTouchId=null,lastTouchPos={x:0,y:0},isMouseDown=false;
let mouseDownPos={x:0,y:0}; // クリック判定用
let lookTouchStartPos={x:0,y:0}; // タップ判定用
const joystickZone=document.getElementById('joystick-zone');
const joystickKnob=document.getElementById('joystick-knob');

window.addEventListener('touchstart',e=>{
    for (let i=0;i<e.changedTouches.length;i++) {
        const t=e.changedTouches[i];
        const r=joystickZone.getBoundingClientRect();
        if (t.clientX>=r.left&&t.clientX<=r.right&&t.clientY>=r.top&&t.clientY<=r.bottom) {
            if (joystickTouchId===null) { joystickTouchId=t.identifier; joystickActive=true; updateJoystick(t); }
        } else if (t.clientX>innerWidth/3&&lookTouchId===null) {
            lookTouchId=t.identifier;
            lastTouchPos.x=t.clientX; lastTouchPos.y=t.clientY;
            lookTouchStartPos.x=t.clientX; lookTouchStartPos.y=t.clientY;
        }
    }
},{passive:false});
window.addEventListener('touchmove',e=>{
    for (let i=0;i<e.changedTouches.length;i++) {
        const t=e.changedTouches[i];
        if (t.identifier===joystickTouchId) { updateJoystick(t); }
        else if (t.identifier===lookTouchId) {
            gameState.cameraYaw -=(t.clientX-lastTouchPos.x)*0.005;
            gameState.cameraPitch-=(t.clientY-lastTouchPos.y)*0.005;
            gameState.cameraPitch=Math.max(-Math.PI/2.2,Math.min(Math.PI/2.2,gameState.cameraPitch));
            lastTouchPos.x=t.clientX; lastTouchPos.y=t.clientY;
        }
    }
},{passive:false});
window.addEventListener('touchend',e=>{
    for (let i=0;i<e.changedTouches.length;i++) {
        const t=e.changedTouches[i];
        if (t.identifier===joystickTouchId) {
            joystickTouchId=null; joystickActive=false; joystickVector={x:0,y:0};
            joystickKnob.style.top='32px'; joystickKnob.style.left='32px';
        } else if (t.identifier===lookTouchId) {
            // 移動量が小さければタップとしてタッチ選択を実行
            const moved=Math.hypot(t.clientX-lookTouchStartPos.x, t.clientY-lookTouchStartPos.y);
            if (moved < 12) processTouchSelectAt(t.clientX, t.clientY);
            lookTouchId=null;
        }
    }
});
window.addEventListener('mousedown',e=>{
    if (e.target.closest('.interactive')||e.target.closest('.modal')) return;
    isMouseDown=true;
    mouseDownPos.x=e.clientX; mouseDownPos.y=e.clientY;
    lastTouchPos.x=e.clientX; lastTouchPos.y=e.clientY;
});
window.addEventListener('mousemove',e=>{
    if (!isMouseDown) return;
    gameState.cameraYaw -=(e.clientX-lastTouchPos.x)*0.003;
    gameState.cameraPitch-=(e.clientY-lastTouchPos.y)*0.003;
    gameState.cameraPitch=Math.max(-Math.PI/2.2,Math.min(Math.PI/2.2,gameState.cameraPitch));
    lastTouchPos.x=e.clientX; lastTouchPos.y=e.clientY;
});
window.addEventListener('mouseup',e=>{
    if (isMouseDown) {
        // ドラッグ量が小さければクリックとしてタッチ選択を実行
        const moved=Math.hypot(e.clientX-mouseDownPos.x, e.clientY-mouseDownPos.y);
        if (moved < 8) processTouchSelectAt(e.clientX, e.clientY);
    }
    isMouseDown=false;
});

function updateJoystick(touch) {
    const r=joystickZone.getBoundingClientRect();
    let dx=touch.clientX-(r.left+r.width/2), dy=touch.clientY-(r.top+r.height/2);
    const maxR=40, dist=Math.hypot(dx,dy);
    if (dist>maxR) { dx=dx/dist*maxR; dy=dy/dist*maxR; }
    joystickKnob.style.left=`${32+dx}px`; joystickKnob.style.top=`${32+dy}px`;
    joystickVector.x=dx/maxR; joystickVector.y=dy/maxR;
}

// ===== アクション検出 =====
function computeCurrentAction() {
    const px=playerGroup.position.x, pz=playerGroup.position.z;
    const L=I18N[currentLang];

    const aimIdx  = raycastTargetIdx;
    const aimItem = (aimIdx>=0 && aimIdx<worldItems.length) ? worldItems[aimIdx] : null;

    let nearOil=null;
    for (const it of interactables) {
        if (it.type!=='oil') continue;
        if (Math.hypot(px-it.group.position.x, pz-it.group.position.z)<it.radius) { nearOil=it; break; }
    }
    let nearDepot=null;
    for (const it of interactables) {
        if (it.type!=='depot') continue;
        if (Math.hypot(px-it.group.position.x, pz-it.group.position.z)<it.radius) { nearDepot=it; break; }
    }
    let nearGiantDepot=null;
    for (const it of interactables) {
        if (it.type!=='giantDepot') continue;
        if (Math.hypot(px-it.group.position.x, pz-it.group.position.z)<it.radius) { nearGiantDepot=it; break; }
    }
    let nearGasStation=null;
    for (const it of interactables) {
        if (it.type!=='gasStation') continue;
        if (Math.hypot(px-it.group.position.x, pz-it.group.position.z)<it.radius) { nearGasStation=it; break; }
    }

    const nearCart = cartObj && cartObj.purchased && Math.hypot(px-cartObj.x, pz-cartObj.z) < 3.5;

    // --- 車両運転中 ---
    if (towVehicle && towVehicle.inVehicle) {
        // タンク連結済み → 売却または切り離し
        if (towVehicle.hitchedTankIdx >= 0) {
            const tank = towTanks[towVehicle.hitchedTankIdx];
            if (tank) {
                if (tank.fill>0 && tank.contentType!=='gas' && nearGiantDepot)
                    return { type:'sellTowTank', label:L.promptSellTowTank(tank.fill) };
                return { type:'detachTowTank', label:L.promptDetachTank };
            }
        }
        // タンクに照準 → 連結
        if (raycastTowTankIdx>=0 && towVehicle.hitchedTankIdx<0) {
            const tank = towTanks[raycastTowTankIdx];
            const capKey = Object.keys(TOW_TANK_CAPS).find(k=>TOW_TANK_CAPS[k]===tank.capacity)||'';
            const name = L['nameTowTank'+tank.capacity] || `Tank ${tank.capacity}L`;
            return { type:'attachTowTank', label:L.promptAttachTank(name), tankIdx:raycastTowTankIdx };
        }
        return { type:'exitVehicle', label:L.promptExitVehicle };
    }

    // --- ひしゃく持ち ---
    if (heldItem && heldItem.type==='ladle') {
        if (!heldItem.hasOil && nearOil) return { type:'scoop', label:L.promptScoop };
        if (heldItem.hasOil && aimItem && aimItem.type==='jerryCan' && aimItem.fill+LADLE_AMOUNT<=JERRY_CAN_CAP)
            return { type:'pour', label:L.promptPour(aimItem.fill), canIdx:aimIdx };
        if (heldItem.hasOil && aimItem && aimItem.type==='drum' && aimItem.contentType!=='gas' && aimItem.fill+LADLE_AMOUNT<=DRUM_CAP)
            return { type:'pourDrum', label:L.promptPourDrum(aimItem.fill), canIdx:aimIdx };
        if (nearCart && cartCapacityUsed()+1<=10) return { type:'loadCart', label:L.promptLoadCart };
        return { type:'putDown', label:L.promptPutDown };
    }

    // --- エンジンノズル持ち ---
    if (heldItem && heldItem.type==='engineNozzle') {
        const ep = enginePumpObjs[heldItem.pumpIdx];
        if (ep) {
            const distToPump = Math.hypot(px-ep.x, pz-ep.z);
            if (distToPump <= ENGINE_HOSE_LENGTH) {
                if (ep.gasFuel > 0) {
                    if (aimItem && aimItem.type==='jerryCan' && aimItem.contentType!=='gas' && aimItem.fill<JERRY_CAN_CAP)
                        return { type:'nozzleFill', label:L.promptNozzleFill(aimItem.fill, JERRY_CAN_CAP), canIdx:aimIdx };
                    if (aimItem && aimItem.type==='drum' && aimItem.contentType!=='gas' && aimItem.fill<DRUM_CAP)
                        return { type:'nozzleFill', label:L.promptNozzleFill(aimItem.fill, DRUM_CAP), canIdx:aimIdx };
                    // 牽引タンクに注入
                    if (raycastTowTankIdx>=0) {
                        const tt=towTanks[raycastTowTankIdx];
                        if (tt && tt.contentType!=='gas' && tt.fill<tt.capacity)
                            return { type:'nozzleFillTowTank', label:L.promptNozzleFillTowTank(tt.fill,tt.capacity), tankIdx:raycastTowTankIdx };
                    }
                }
            }
        }
        return { type:'releaseNozzle', label:L.promptReleaseNozzle };
    }

    // --- ガスノズル持ち ---
    if (heldItem && heldItem.type==='gasNozzle') {
        const gs = gasStationObjs[heldItem.stationIdx];
        if (gs) {
            const distToStation = Math.hypot(px-gs.x, pz-gs.z);
            if (distToStation <= GAS_HOSE_LENGTH) {
                if (aimItem && aimItem.type==='jerryCan' && aimItem.contentType!=='oil' && aimItem.fill<JERRY_CAN_CAP)
                    return { type:'gasNozzleFill', label:L.promptGasNozzleFill(aimItem.fill, JERRY_CAN_CAP, GAS_FILL_COST), canIdx:aimIdx };
                if (aimItem && aimItem.type==='drum' && aimItem.contentType!=='oil' && aimItem.fill<DRUM_CAP)
                    return { type:'gasNozzleFill', label:L.promptGasNozzleFill(aimItem.fill, DRUM_CAP, GAS_FILL_COST), canIdx:aimIdx };
                // 牽引タンクにガス給油
                if (raycastTowTankIdx>=0) {
                    const tt=towTanks[raycastTowTankIdx];
                    if (tt && tt.contentType!=='oil' && tt.fill<tt.capacity)
                        return { type:'gasNozzleFillTowTank', label:L.promptGasNozzleFillTowTank(tt.fill,tt.capacity,GAS_FILL_COST), tankIdx:raycastTowTankIdx };
                }
            }
        }
        return { type:'releaseGasNozzle', label:L.promptReleaseGasNozzle };
    }

    // --- 牽引タンク排出ノズル持ち ---
    if (heldItem && heldItem.type==='towTankNozzle') {
        const tt = towTanks[heldItem.tankIdx];
        if (tt) {
            const distToTank = Math.hypot(px-tt.x, pz-tt.z);
            if (distToTank <= TOW_TANK_DRAIN_HOSE) {
                // 貯蔵タンクへ排出
                if (raycastStorageTankIdx>=0) {
                    const st=storageTankObjs[raycastStorageTankIdx];
                    if (st && st.level<STORAGE_TANK_CAP && (!st.liquidType||st.liquidType===tt.contentType))
                        return { type:'towTankDrainStorage', label:L.promptTowTankDrainStorage(st.level, STORAGE_TANK_CAP), stIdx:raycastStorageTankIdx };
                }
                // 採掘機の燃料タンクへ排出（ガスのみ）
                if (tt.contentType==='gas' && raycastPumpJackIdx>=0) {
                    const pj=pumpJackObjs[raycastPumpJackIdx];
                    if (pj && pj.fuelLevel<PUMP_JACK_FUEL_CAP)
                        return { type:'towTankDrainPumpJack', label:L.promptTowTankDrainPumpJack(pj.fuelLevel, PUMP_JACK_FUEL_CAP), pjIdx:raycastPumpJackIdx };
                }
                // ジェリ缶/ドラム缶へ移す
                if (aimItem && (aimItem.type==='jerryCan'||aimItem.type==='drum') && (!aimItem.contentType||aimItem.contentType===tt.contentType)) {
                    const cap=aimItem.type==='drum'?DRUM_CAP:JERRY_CAN_CAP;
                    if (aimItem.fill<cap)
                        return { type:'towTankDrainCan', label:L.promptTowTankDrainCan(aimItem.fill, cap), canIdx:aimIdx };
                }
            }
        }
        return { type:'releaseTowTankNozzle', label:L.promptReleaseTowTankNozzle };
    }

    // --- ジェリ缶持ち ---
    if (heldItem && heldItem.type==='jerryCan') {
        if (heldItem.fill>0 && nearDepot)
            return { type:'sell', label:L.promptSell(canPrice(heldItem.fill, heldItem.contentType)) };
        if (raycastPumpIdx>=0 && !pumpObjs[raycastPumpIdx].attachedCan)
            return { type:'attachCan', label:L.promptAttachCan, pumpIdx:raycastPumpIdx };
        if (heldItem.contentType==='gas' && raycastEnginePumpIdx>=0)
            return { type:'fuelEnginePump', label:L.promptFuelEnginePump(enginePumpObjs[raycastEnginePumpIdx].gasFuel), epIdx:raycastEnginePumpIdx };
        if (heldItem.contentType==='gas' && raycastPumpJackIdx>=0) {
            const pj=pumpJackObjs[raycastPumpJackIdx];
            if (pj && pj.fuelLevel < PUMP_JACK_FUEL_CAP)
                return { type:'fuelPumpJack', label:L.promptFuelPumpJack(pj.fuelLevel, PUMP_JACK_FUEL_CAP), pjIdx:raycastPumpJackIdx };
        }
        if (heldItem.contentType!=='gas' && heldItem.fill < JERRY_CAN_CAP && raycastPumpJackIdx>=0) {
            const pj=pumpJackObjs[raycastPumpJackIdx];
            if (pj && pj.oilBuffer > 0)
                return { type:'collectOilPumpJack', label:L.promptCollectPumpJack(pj.oilBuffer), pjIdx:raycastPumpJackIdx };
        }
        if (heldItem.fill > 0 && raycastStorageTankIdx>=0) {
            const st=storageTankObjs[raycastStorageTankIdx];
            if (st && st.level < STORAGE_TANK_CAP && (!st.liquidType||!heldItem.contentType||st.liquidType===heldItem.contentType))
                return { type:'fillStorageTank', label:L.promptFillStorageTank(Math.floor(st.level), STORAGE_TANK_CAP), stIdx:raycastStorageTankIdx };
        }
        if (nearCart && cartCapacityUsed()+1<=10) return { type:'loadCart', label:L.promptLoadCart };
        return { type:'putDown', label:L.promptPutDown };
    }

    // --- ドラム缶持ち ---
    if (heldItem && heldItem.type==='drum') {
        if (heldItem.fill>0 && nearDepot)
            return { type:'sellDrum', label:L.promptSellDrum(drumPrice(heldItem.fill, heldItem.contentType)) };
        if (heldItem.contentType==='gas' && raycastEnginePumpIdx>=0)
            return { type:'fuelEnginePump', label:L.promptFuelEnginePump(enginePumpObjs[raycastEnginePumpIdx].gasFuel), epIdx:raycastEnginePumpIdx };
        if (nearCart && cartCapacityUsed()+5<=10) return { type:'loadCart', label:L.promptLoadCart };
        return { type:'putDown', label:L.promptPutDown };
    }

    // --- 汲み上げ機持ち ---
    if (heldItem && heldItem.type==='handPump') {
        if (nearOil) return { type:'installPump', label:L.promptInstallPump };
        if (nearCart && cartCapacityUsed()+1<=10) return { type:'loadCart', label:L.promptLoadCart };
        return { type:'putDown', label:L.promptPutDown };
    }

    // --- エンジンポンプ持ち ---
    if (heldItem && heldItem.type==='enginePump') {
        if (nearOil) return { type:'installEnginePump', label:L.promptInstallEnginePump };
        if (nearCart && cartCapacityUsed()+1<=10) return { type:'loadCart', label:L.promptLoadCart };
        return { type:'putDown', label:L.promptPutDown };
    }

    // --- 採掘機持ち ---
    if (heldItem && heldItem.type==='pumpJack') {
        const _gp=getPumpJackSnapPos();
        const {gx:_pgx,gz:_pgz}=worldToGrid(_gp.x,_gp.z);
        const _spring=findOilSpringAtGrid(_pgx,_pgz);
        if (_spring && _spring.pumpJackIdx<0)
            return { type:'installPumpJack', label:L.promptInstallPumpJack };
        return { type:'putDown', label:L.promptPutDown };
    }

    // --- 貯蔵タンク持ち ---
    if (heldItem && heldItem.type==='storageTank') {
        return { type:'installStorageTank', label:L.promptInstallStorageTank };
    }

    // --- パイプ持ち ---
    if (heldItem && heldItem.type==='pipe') {
        return { type:'installPipe', label:L.promptInstallPipe };
    }
    // --- T字分岐持ち ---
    if (heldItem && heldItem.type==='junctionT') {
        return { type:'installJunctionT', label:L.promptInstallJunctionT };
    }
    // --- 十字分岐持ち ---
    if (heldItem && heldItem.type==='junctionCross') {
        return { type:'installJunctionCross', label:L.promptInstallJunctionCross };
    }
    // --- 精製施設持ち ---
    if (heldItem && heldItem.type==='refinery') {
        return { type:'installRefinery', label:L.promptInstallRefinery };
    }

    // --- ジェリ缶持ち（追加: 採掘機・貯蔵タンク） ---
    // (checked below inside jerryCan block)

    // --- 手が空の場合 ---
    if (!heldItem) {
        // 車両ロット商品に照準 → 購入
        if (raycastVehicleLotIdx>=0) {
            const vi=vehicleLotItems[raycastVehicleLotIdx];
            if (vi) {
                const n = vi.type==='towVehicle'?L.nameTowVehicle
                    :vi.type==='towTank500'?L.nameTowTank500
                    :vi.type==='towTank1500'?L.nameTowTank1500:L.nameTowTank3000;
                return { type:'buyVehicleLot', label:L.promptBuy(n, vi.price), lotIdx:raycastVehicleLotIdx };
            }
        }
        // 車両に近い → 乗る
        if (towVehicle && towVehiclePurchased) {
            const dv = Math.hypot(px-towVehicle.x, pz-towVehicle.z);
            if (dv < 4.0) return { type:'enterVehicle', label:L.promptEnterVehicle };
        }
        // ガスノズルに照準
        if (raycastGasNozzleIdx>=0)
            return { type:'grabGasNozzle', label:L.promptGrabGasNozzle, stIdx:raycastGasNozzleIdx };
        // 牽引タンクに照準 → 排出ノズルを取る
        if (raycastTowTankIdx>=0) {
            const tt=towTanks[raycastTowTankIdx];
            if (tt && tt.fill>0)
                return { type:'grabTowTankNozzle', label:L.promptGrabTowTankNozzle(tt.fill, tt.contentType), tankIdx:raycastTowTankIdx };
        }
        // エンジンポンプに照準
        if (raycastEnginePumpIdx>=0) {
            const ep = enginePumpObjs[raycastEnginePumpIdx];
            if (ep.gasFuel > 0)
                return { type:'grabNozzle', label:L.promptGrabNozzle(ep.gasFuel), epIdx:raycastEnginePumpIdx };
            return { type:'removeEnginePump', label:L.promptRemoveEnginePump, epIdx:raycastEnginePumpIdx };
        }
        // 採掘機に照準
        if (raycastPumpJackIdx>=0) {
            const pj = pumpJackObjs[raycastPumpJackIdx];
            if (pj) {
                if (pj.oilBuffer > 0)
                    return { type:'collectFromPumpJack', label:L.promptCollectPumpJack(pj.oilBuffer), pjIdx:raycastPumpJackIdx };
                // 燃料情報をラベルに含めつつ撤去を許可
                const removeLabel = pj.fuelLevel > 0
                    ? `${L.promptRemovePumpJack}  (${currentLang==='ja'?'燃料':'fuel'} ${pj.fuelLevel.toFixed(0)}L)`
                    : L.promptRemovePumpJack;
                return { type:'removePumpJack', label:removeLabel, pjIdx:raycastPumpJackIdx };
            }
        }
        // 貯蔵タンクに照準
        if (raycastStorageTankIdx>=0) {
            const st = storageTankObjs[raycastStorageTankIdx];
            if (st) {
                if (nearDepot && st.level > 0) {
                    const earn = Math.floor(st.level * liquidSellPrice(st.liquidType||'oil'));
                    return { type:'sellStorageTank', label:L.promptSellStorageTank(earn, st.liquidType), stIdx:raycastStorageTankIdx };
                }
                if (st.level > 0)
                    return { type:'drawStorageTank', label:L.promptDrawStorageTank(Math.floor(st.level), STORAGE_TANK_CAP), stIdx:raycastStorageTankIdx };
                return { type:'removeStorageTank', label:L.promptRemoveStorageTank, stIdx:raycastStorageTankIdx };
            }
        }
        // 精製施設に照準
        if (raycastRefineryIdx>=0) {
            const rf = refineryObjs[raycastRefineryIdx];
            if (rf) {
                const hasProducts = Object.values(rf.products).some(v=>v>0);
                if (nearDepot && hasProducts) {
                    const earn = Math.floor(Object.entries(rf.products).reduce((s,[lt,v])=>s+v*liquidSellPrice(lt),0));
                    return { type:'sellRefineryProducts', label:L.promptSellStorageTank(earn, null), rfIdx:raycastRefineryIdx };
                }
                if (rf.enabled)
                    return { type:'toggleRefinery', label:L.promptToggleRefineryOff, rfIdx:raycastRefineryIdx };
                return { type:'toggleRefinery', label:L.promptToggleRefineryOn, rfIdx:raycastRefineryIdx };
            }
        }
        // 設置済みポンプに照準
        if (raycastPumpIdx>=0) {
            const po = pumpObjs[raycastPumpIdx];
            if (po.attachedCan) {
                if (po.attachedCan.fill >= JERRY_CAN_CAP)
                    return { type:'detachCan', label:L.promptDetachCan, pumpIdx:raycastPumpIdx };
                return { type:'pumpOnce', label:L.promptPump(po.attachedCan.fill), pumpIdx:raycastPumpIdx };
            }
            return { type:'removePump', label:L.promptRemovePump, pumpIdx:raycastPumpIdx };
        }
        // ショップ展示品に照準 → 購入
        if (raycastShopItemIdx>=0) {
            const si = shopDisplayItems[raycastShopItemIdx];
            const name = si.type==='ladle' ? L.nameLadle
                : si.type==='handPump' ? L.nameHandPump
                : si.type==='handcart' ? L.nameCart
                : si.type==='drum' ? L.nameDrum
                : si.type==='enginePump' ? L.nameEnginePump
                : si.type==='pumpJack' ? L.namePumpJack
                : si.type==='storageTank' ? L.nameStorageTank
                : si.type==='refinery' ? L.nameRefinery
                : L.nameCan;
            return { type:'buyItem', label:L.promptBuy(name, si.price), shopItemIdx:raycastShopItemIdx };
        }
        // カートアイテムに照準 → 降ろす
        if (raycastCartSlotIdx>=0) return { type:'unloadCart', label:L.promptUnloadCart, slotIdx:raycastCartSlotIdx };
        // ワールドアイテムに照準 → 拾う
        if (aimItem) {
            let label;
            if (aimItem.type==='ladle') label=L.promptPickupLadle;
            else if (aimItem.type==='drum') label=L.promptPickupDrum(aimItem.fill, aimItem.contentType);
            else label=L.promptPickupCan(aimItem.fill, aimItem.contentType);
            return { type:'pickup', label, itemIdx:aimIdx };
        }
        // 分岐パイプ撤去（グリッドスナップ位置に分岐パイプがある場合）
        {
            const gp=getGridSnapPos();
            const gx=Math.round(gp.x/GRID_SNAP), gz=Math.round(gp.z/GRID_SNAP);
            const nk=nodeKey(gx,gz);
            if (junctionNodes.has(nk))
                return { type:'removeJunction', label:L.promptRemoveJunction };
        }
        // パイプ撤去（向いている辺にパイプがある場合）
        {
            const edge=getPipeSnapEdge();
            const ek=edgeKey(edge.gx1,edge.gz1,edge.gx2,edge.gz2);
            if (pipeEdges.has(ek))
                return { type:'removePipe', label:L.promptRemovePipe };
        }
        // カート近傍 → 引く/離す
        if (nearCart) {
            return cartObj.isHeld
                ? { type:'releaseCart', label:L.promptReleaseCart }
                : { type:'grabCart',   label:L.promptGrabCart };
        }
        return null;
    }

    return null;
}

function liquidSellPrice(liquidType) {
    switch(liquidType) {
        case 'oil':      return 1.0;
        case 'gas':      return 1.5;
        case 'diesel':   return 1.3;
        case 'kerosene': return 1.2;
        case 'naphtha':  return 1.0;
        case 'lpg':      return 1.5;
        case 'heavyoil': return 0.8;
        default:         return 1.0;
    }
}
function canPrice(fill, contentType) {
    if (fill<=0) return 0;
    return Math.floor(Math.min(JERRY_CAN_CAP, fill) * liquidSellPrice(contentType||'oil'));
}
function drumPrice(fill, contentType) {
    if (fill<=0) return 0;
    return Math.floor(Math.min(DRUM_CAP, fill) * liquidSellPrice(contentType||'oil'));
}

// ===== タップ/クリック選択 =====
function processTouchSelectAt(clientX, clientY) {
    if (!touchSelectEnabled) return;
    // UIパーツ上のタップは無視
    if (document.elementFromPoint(clientX,clientY)?.closest('.interactive,.modal,#ui-overlay')) return;
    const ndcX=(clientX/innerWidth)*2-1, ndcY=-(clientY/innerHeight)*2+1;
    const rc=new THREE.Raycaster();
    rc.far=30;
    rc.setFromCamera({x:ndcX,y:ndcY}, camera);

    // 採掘機
    if (pumpJackObjs.length>0) {
        const ms=[]; pumpJackObjs.forEach(pj=>pj.group.traverse(m=>{if(m.isMesh)ms.push(m);}));
        const h=rc.intersectObjects(ms,false);
        if(h.length>0){
            const idx=pumpJackMeshToIdx.get(h[0].object.uuid);
            if(idx!==undefined){pinnedTarget={type:'pumpJack',idx,x:pumpJackObjs[idx].x,z:pumpJackObjs[idx].z};return;}
        }
    }
    // 貯蔵タンク
    if (storageTankObjs.length>0) {
        const ms=[]; storageTankObjs.forEach(st=>st.group.traverse(m=>{if(m.isMesh)ms.push(m);}));
        const h=rc.intersectObjects(ms,false);
        if(h.length>0){
            const idx=storageTankMeshToIdx.get(h[0].object.uuid);
            if(idx!==undefined){pinnedTarget={type:'storageTank',idx,x:storageTankObjs[idx].x,z:storageTankObjs[idx].z};return;}
        }
    }
    // 精製施設
    if (refineryObjs.length>0) {
        const ms=[]; refineryObjs.forEach(rf=>rf.group.traverse(m=>{if(m.isMesh)ms.push(m);}));
        const h=rc.intersectObjects(ms,false);
        if(h.length>0){
            const idx=refineryMeshToIdx.get(h[0].object.uuid);
            if(idx!==undefined){pinnedTarget={type:'refinery',idx,x:refineryObjs[idx].x,z:refineryObjs[idx].z};return;}
        }
    }
    // 設置済みポンプ
    if (pumpObjs.length>0) {
        const ms=[]; pumpObjs.forEach(po=>po.group.traverse(m=>{if(m.isMesh)ms.push(m);}));
        const h=rc.intersectObjects(ms,false);
        if(h.length>0){
            const idx=pumpMeshToIdx.get(h[0].object.uuid);
            if(idx!==undefined){pinnedTarget={type:'pump',idx,x:pumpObjs[idx].x,z:pumpObjs[idx].z};return;}
        }
    }
    // エンジンポンプ
    if (enginePumpObjs.length>0) {
        const ms=[]; enginePumpObjs.forEach(ep=>ep.group.traverse(m=>{if(m.isMesh)ms.push(m);}));
        const h=rc.intersectObjects(ms,false);
        if(h.length>0){
            const idx=enginePumpMeshToIdx.get(h[0].object.uuid);
            if(idx!==undefined){pinnedTarget={type:'enginePump',idx,x:enginePumpObjs[idx].x,z:enginePumpObjs[idx].z};return;}
        }
    }
    // 牽引タンク
    if (towTanks.length>0) {
        const ms=[]; towTanks.forEach(tt=>tt.group.traverse(m=>{if(m.isMesh)ms.push(m);}));
        const h=rc.intersectObjects(ms,false);
        if(h.length>0){
            const idx=towTankMeshToIdx.get(h[0].object.uuid);
            if(idx!==undefined){const tp=towTanks[idx].group.position;pinnedTarget={type:'towTank',idx,x:tp.x,z:tp.z};return;}
        }
    }
    // ワールドアイテム
    if (worldItems.length>0) {
        const ms=[], wmap=new Map();
        worldItems.forEach((item,idx)=>item.group.traverse(m=>{if(m.isMesh){ms.push(m);wmap.set(m.uuid,idx);}}));
        const h=rc.intersectObjects(ms,false);
        if(h.length>0){
            const idx=wmap.get(h[0].object.uuid);
            if(idx!==undefined){pinnedTarget={type:'worldItem',idx,x:worldItems[idx].x,z:worldItems[idx].z};return;}
        }
    }
    // 何も当たらなければピン解除
    pinnedTarget=null;
}

// ===== アクション実行 =====
function triggerAction() {
    if (!currentAction) return;
    pinnedTarget = null; // アクション実行でピン解除
    const L=I18N[currentLang];
    switch (currentAction.type) {
        case 'pickup':             doPickup(currentAction.itemIdx); break;
        case 'scoop':              doScoop(); break;
        case 'pour':               doPour(currentAction.canIdx); break;
        case 'pourDrum':           doPourDrum(currentAction.canIdx); break;
        case 'sell':               doSell(); break;
        case 'sellDrum':           doSellDrum(); break;
        case 'putDown':            doPutDown(); break;
        case 'grabCart':           doGrabCart(); break;
        case 'releaseCart':        doReleaseCart(); break;
        case 'loadCart':           doLoadCart(); break;
        case 'unloadCart':         doUnloadCart(currentAction.slotIdx); break;
        case 'buyItem':            doBuyItem(currentAction.shopItemIdx); break;
        case 'installPump':        doInstallPump(); break;
        case 'removePump':         doRemovePump(currentAction.pumpIdx); break;
        case 'attachCan':          doAttachCan(currentAction.pumpIdx); break;
        case 'detachCan':          doDetachCan(currentAction.pumpIdx); break;
        case 'pumpOnce':           doPumpOnce(currentAction.pumpIdx); break;
        case 'installEnginePump':  doInstallEnginePump(); break;
        case 'removeEnginePump':   doRemoveEnginePump(currentAction.epIdx); break;
        case 'grabNozzle':         doGrabNozzle(currentAction.epIdx); break;
        case 'releaseNozzle':      doReleaseNozzle(); break;

        case 'fillGas':            doFillGas(); break;
        case 'fillGasDrum':        doFillGasDrum(); break;
        case 'grabGasNozzle':      doGrabGasNozzle(currentAction.stIdx); break;
        case 'releaseGasNozzle':   doReleaseGasNozzle(); break;
        case 'gasNozzleFill':      doGasNozzleFill(currentAction.canIdx); break;
        case 'buyVehicleLot':      doBuyVehicleLotItem(currentAction.lotIdx); break;
        case 'enterVehicle':       doEnterVehicle(); break;

        case 'attachTowTank':      doAttachTowTank(currentAction.tankIdx); break;
        case 'detachTowTank':      doDetachTowTank(); break;
        case 'nozzleFillTowTank':  doNozzleFillTowTank(currentAction.tankIdx); break;
        case 'gasNozzleFillTowTank': doGasNozzleFillTowTank(currentAction.tankIdx); break;
        case 'grabTowTankNozzle':  doGrabTowTankNozzle(currentAction.tankIdx); break;
        case 'releaseTowTankNozzle': doReleaseTowTankNozzle(); break;
        case 'towTankDrainStorage':doTowTankDrainStorage(currentAction.stIdx); break;
        case 'towTankDrainPumpJack':doTowTankDrainPumpJack(currentAction.pjIdx); break;
        case 'towTankDrainCan':    doTowTankDrainCan(currentAction.canIdx); break;
        case 'sellTowTank':        doSellTowTank(); break;
        case 'installPumpJack':    doInstallPumpJack(); break;
        case 'removePumpJack':     doRemovePumpJack(currentAction.pjIdx); break;
        case 'fuelPumpJack':       doFuelPumpJack(currentAction.pjIdx); break;
        case 'collectOilPumpJack': doCollectOilPumpJack(currentAction.pjIdx); break;
        case 'collectFromPumpJack':doCollectFromPumpJack(currentAction.pjIdx); break;
        case 'infoPumpJack':       break; // info only
        case 'installStorageTank': doInstallStorageTank(); break;
        case 'removeStorageTank':  doRemoveStorageTank(currentAction.stIdx); break;
        case 'installPipe':        doInstallPipe(); break;
        case 'installJunctionT':   doInstallJunctionT(); break;
        case 'installJunctionCross': doInstallJunctionCross(); break;
        case 'removePipe':         doRemovePipe(); break;

        case 'fillStorageTank':    doFillStorageTank(currentAction.stIdx); break;

        case 'sellRefineryProducts': doSellRefineryProducts(currentAction.rfIdx); break;
    }
}

function doBuyItem(idx) {
    const si = shopDisplayItems[idx];
    if (!si) return;
    const L = I18N[currentLang];
    if (!debugMode && gameState.money < si.price) { showNotification(L.msgNoMoney); return; }
    if (!debugMode) gameState.money -= si.price;

    if (si.type === 'handcart') {
        // カートはすでにシーンにある — 商品登録を解除して有効化
        si.mesh.traverse(m => { if(m.isMesh) shopMeshToIdx.delete(m.uuid); });
        gameState.hasCart = true;
        cartObj.purchased = true;
        if (highlightedShopItemIdx === idx) {
            si.mesh.traverse(m => { if(m.isMesh&&m.material&&m.material.emissive) m.material.emissive.set(0x000000); });
            highlightedShopItemIdx = -1;
        }
        updateUI();
        showNotification(L.msgBought(L.nameCart, si.price));
        return;
    }

    spawnWorldItem(si.type, si.dropX, si.dropZ, false, 0, 0.04);
    updateUI();
    const name = si.type==='ladle' ? L.nameLadle : si.type==='handPump' ? L.nameHandPump
        : si.type==='drum' ? L.nameDrum : si.type==='enginePump' ? L.nameEnginePump
        : si.type==='pumpJack' ? L.namePumpJack : si.type==='storageTank' ? L.nameStorageTank
        : si.type==='refinery' ? L.nameRefinery : L.nameCan;
    showNotification(L.msgBought(name, si.price));
}

// ===== 採掘機アクション =====
function doInstallPumpJack() {
    const L = I18N[currentLang];
    const gp = getPumpJackSnapPos();
    const {gx:pjGx, gz:pjGz} = worldToGrid(gp.x, gp.z);
    const spring = findOilSpringAtGrid(pjGx, pjGz);
    if (!spring) { showNotification(L.msgPumpJackNoSpring); return; }
    if (spring.pumpJackIdx >= 0) { showNotification(L.msgPumpJackDuplicate); return; }
    // nearSpringIdx = index into interactables for oil entry (kept for pump animation logic)
    const nearSpringIdx = interactables.findIndex(it=>it.type==='oil'&&it.group.position.x===spring.worldX&&it.group.position.z===spring.worldZ);
    const pjMesh = createPumpJackMesh();
    const g = pjMesh.group;
    g.position.set(gp.x, 0, gp.z);
    g.rotation.y = placementRot;
    scene.add(g);
    const pjIdx = pumpJackObjs.length;
    g.traverse(m=>{ if(m.isMesh) pumpJackMeshToIdx.set(m.uuid, pjIdx); });
    pumpJackObjs.push({ group:g, crankGrp:pjMesh.crankGrp, beamGrp:pjMesh.beamGrp, rod:pjMesh.rod,
        x:gp.x, z:gp.z, fuelLevel:0, oilBuffer:0, crankAngle:0, nearSpringIdx, rot:placementRot });
    spring.pumpJackIdx = pjIdx;
    registerFacilityPorts('pumpJack', pjIdx, pjGx, pjGz, placementRot);
    if (ghostMesh) { scene.remove(ghostMesh); ghostMesh = null; }
    placementRot = 0;
    heldItem = null;
    updateHeldMesh(); updateUI();
    showNotification(L.msgPumpJackInstalled);
}

function doRemovePumpJack(idx) {
    const L = I18N[currentLang];
    const pj = pumpJackObjs[idx];
    if (!pj) return;
    unregisterFacilityPorts('pumpJack', idx);
    pj.group.traverse(m=>{ if(m.isMesh) pumpJackMeshToIdx.delete(m.uuid); });
    scene.remove(pj.group);
    // 油田スロットを解放
    oilSprings.forEach(s=>{ if(s.pumpJackIdx===idx) s.pumpJackIdx=-1; else if(s.pumpJackIdx>idx) s.pumpJackIdx--; });
    pumpJackObjs.splice(idx, 1);
    pumpJackMeshToIdx.forEach((v,k)=>{ if(v>idx) pumpJackMeshToIdx.set(k,v-1); });
    heldItem = { type:'pumpJack', fill:0, hasOil:false };
    raycastPumpJackIdx=-1; highlightedPumpJackIdx=-1;
    updateHeldMesh(); updateUI();
    showNotification(L.msgPumpJackRemoved);
}

function doFuelPumpJack(idx) {
    const L = I18N[currentLang];
    const pj = pumpJackObjs[idx];
    if (!pj || !heldItem || heldItem.contentType!=='gas') return;
    const space = PUMP_JACK_FUEL_CAP - pj.fuelLevel;
    const add = Math.min(heldItem.fill, space);
    if (add <= 0) { showNotification(L.msgPumpJackInstalled); return; }
    pj.fuelLevel += add;
    heldItem.fill -= add;
    if (heldItem.fill <= 0) { heldItem.fill=0; heldItem.contentType=null; }
    updateHeldMesh(); updateUI();
    showNotification(L.msgPumpJackFueled(add));
}

function doCollectOilPumpJack(idx) {
    const L = I18N[currentLang];
    const pj = pumpJackObjs[idx];
    if (!pj || pj.oilBuffer<=0) { showNotification(L.msgPumpJackEmpty); return; }
    const space = JERRY_CAN_CAP - heldItem.fill;
    const take = Math.min(pj.oilBuffer, space);
    if (take <= 0) return;
    pj.oilBuffer -= take;
    heldItem.fill += take;
    heldItem.contentType = 'oil';
    updateHeldMesh(); updateUI();
    showNotification(L.msgPumpJackCollected(take));
}

function doCollectFromPumpJack(idx) {
    const L = I18N[currentLang];
    const pj = pumpJackObjs[idx];
    if (!pj || pj.oilBuffer<=0) { showNotification(L.msgPumpJackEmpty); return; }
    const take = Math.min(pj.oilBuffer, JERRY_CAN_CAP);
    pj.oilBuffer -= take;
    const dp = getDropPos();
    spawnWorldItem('jerryCan', dp.x, dp.z, false, take, 0.04, 'oil');
    updateUI();
    showNotification(L.msgPumpJackCollected(take));
}

// ===== 貯蔵タンクアクション =====

    const {gx:stGx,gz:stGz}=worldToGrid(gp.x,gp.z);
    registerFacilityPorts('storageTank', stIdx, stGx, stGz, placementRot);
    if (ghostMesh) { scene.remove(ghostMesh); ghostMesh = null; }
    placementRot = 0;
    heldItem = null;
    updateHeldMesh(); updateUI();
    showNotification(L.msgStorageTankInstalled);
}

function doRemoveStorageTank(idx) {
    const L = I18N[currentLang];
    const st = storageTankObjs[idx];
    if (!st) return;
    unregisterFacilityPorts('storageTank', idx);
    st.group.traverse(m=>{ if(m.isMesh) storageTankMeshToIdx.delete(m.uuid); });
    scene.remove(st.group);

function doFillStorageTank(idx) {
    const L = I18N[currentLang];
    const st = storageTankObjs[idx];
    if (!st || !heldItem || heldItem.fill<=0) return;
    // 液体種別チェック: タンクに内容物がある場合は同種のみ
    const ct = heldItem.contentType;
    if (st.liquidType && ct && st.liquidType!==ct) {
        showNotification(currentLang==='ja'?'異なる液体は混入できません':'Cannot mix different liquids'); return;
    }
    const space = STORAGE_TANK_CAP - st.level;
    if (space <= 0) { showNotification(L.msgStorageTankFull); return; }
    const add = Math.min(heldItem.fill, space);
    st.level += add;
    if (ct) st.liquidType = ct; // 液体種別を記録
    heldItem.fill -= add;
    if (heldItem.fill <= 0) { heldItem.fill=0; heldItem.contentType=null; }
    updateHeldMesh(); updateUI();
    showNotification(L.promptFillStorageTank(Math.floor(st.level), STORAGE_TANK_CAP));
}

function doDrawStorageTank(idx) {
    const L = I18N[currentLang];
    const st = storageTankObjs[idx];
    if (!st || st.level<=0) { showNotification(L.msgStorageTankEmpty); return; }
    const take = Math.min(st.level, JERRY_CAN_CAP);
    st.level -= take;
    if (st.level===0) st.liquidType=null;
    const dp = getDropPos();
    spawnWorldItem('jerryCan', dp.x, dp.z, false, take, 0.04, st.liquidType||'oil');
    updateUI();
    showNotification(L.promptDrawStorageTank(Math.floor(st.level), STORAGE_TANK_CAP));
}

        po.canMesh.traverse(m => { if(m.isMesh) pumpMeshToIdx.delete(m.uuid); });
        po.group.remove(po.canMesh); po.canMesh = null;
    }
    po.attachedCan = null;

    updateHeldMesh(); updateUI();

function doPumpOnce(pumpIdx) {
    const L = I18N[currentLang];
    const po = pumpObjs[pumpIdx];
    if (!po || !po.attachedCan) return;

    po.attachedCan.fill = Math.min(JERRY_CAN_CAP, po.attachedCan.fill + HAND_PUMP_AMOUNT);

    // 缶メッシュを更新（色変化のため再生成）
    if (po.canMesh) {
        const pos = po.canMesh.position.clone();
        const scl = po.canMesh.scale.x;
        po.canMesh.traverse(m => { if(m.isMesh) pumpMeshToIdx.delete(m.uuid); });
        po.group.remove(po.canMesh);
        po.canMesh = createJerryCanMesh(po.attachedCan.fill);
        po.canMesh.scale.setScalar(scl);
        po.canMesh.position.copy(pos);
        po.group.add(po.canMesh);
        po.canMesh.traverse(m => { if(m.isMesh) pumpMeshToIdx.set(m.uuid, pumpIdx); });
    }

    if (po.attachedCan.fill >= JERRY_CAN_CAP) {
        showNotification(L.msgCanFull);
    } else {
        showNotification(L.msgPumped(po.attachedCan.fill));
    }
}

function doBuyVehicleLotItem(idx) {
    const vi=vehicleLotItems[idx]; if(!vi) return;
    const L=I18N[currentLang];
    if (!debugMode && gameState.money<vi.price) { showNotification(L.msgNoMoney); return; }
    if (!debugMode) gameState.money-=vi.price;

    if (vi.type==='towVehicle') {
        if (towVehiclePurchased) return; // 既に所有
        const g=createTowVehicleMesh();
        g.position.set(vi.dropX, 0, vi.dropZ);
        g.rotation.y = Math.PI;
        scene.add(g);
        towVehicle={group:g, x:vi.dropX, z:vi.dropZ, rot:Math.PI, inVehicle:false, hitchedTankIdx:-1};
        g.traverse(m=>{ if(m.isMesh) towVehicleMeshUUIDs.add(m.uuid); });
        towVehiclePurchased=true;
        showNotification(L.msgBought(L.nameTowVehicle, vi.price));
    } else {
        const cap=TOW_TANK_CAPS[vi.type];
        if (!cap) return;
        const g=createTowTankMesh(cap,0,null);
        g.position.set(vi.dropX, 0, vi.dropZ);
        scene.add(g);
        const tankIdx=towTanks.length;
        g.traverse(m=>{ if(m.isMesh) towTankMeshToIdx.set(m.uuid, tankIdx); });
        towTanks.push({group:g, x:vi.dropX, z:vi.dropZ, capacity:cap, fill:0, contentType:null});
        const n=vi.type==='towTank500'?L.nameTowTank500:vi.type==='towTank1500'?L.nameTowTank1500:L.nameTowTank3000;
        showNotification(L.msgBought(n, vi.price));
    }
    updateUI();
}

function doEnterVehicle() {
    if (!towVehicle||towVehicle.inVehicle) return;
    towVehicle.inVehicle=true;
    if (heldMesh) { camera.remove(heldMesh); heldMesh=null; }
    // 乗車時は手持ちを地面に置く

}

function doExitVehicle() {
    if (!towVehicle||!towVehicle.inVehicle) return;
    towVehicle.inVehicle=false;
    // プレイヤーをトラック横に移動
    playerGroup.position.set(towVehicle.x+2.5, 0, towVehicle.z);

    showNotification(I18N[currentLang].msgExitedVehicle);
}

function doAttachTowTank(tankIdx) {
    if (!towVehicle||towVehicle.hitchedTankIdx>=0) return;
    towVehicle.hitchedTankIdx=tankIdx;
    updateUI();
    showNotification(I18N[currentLang].msgAttachedTank);
}

function doDetachTowTank() {
    if (!towVehicle||towVehicle.hitchedTankIdx<0) return;
    const tank=towTanks[towVehicle.hitchedTankIdx];
    if (tank) {
        // タンクをトラック後方に置く
        tank.x = towVehicle.x + Math.sin(towVehicle.rot)*5.0;
        tank.z = towVehicle.z + Math.cos(towVehicle.rot)*5.0;
        tank.group.position.set(tank.x, 0, tank.z);
    }
    towVehicle.hitchedTankIdx=-1;
    updateUI();
    showNotification(I18N[currentLang].msgDetachedTank);
}

function refreshTowTankMesh(tankIdx) {
    const tank=towTanks[tankIdx]; if(!tank) return;
    tank.group.traverse(m=>{ if(m.isMesh) towTankMeshToIdx.delete(m.uuid); });
    scene.remove(tank.group);
    const newG=createTowTankMesh(tank.capacity, tank.fill, tank.contentType);
    newG.position.set(tank.x, 0, tank.z);
    newG.rotation.y = tank.group.rotation.y;
    scene.add(newG);
    newG.traverse(m=>{ if(m.isMesh) towTankMeshToIdx.set(m.uuid, tankIdx); });
    tank.group=newG;
}

function doNozzleFillTowTank(tankIdx) {
    const L=I18N[currentLang];
    if (!heldItem||heldItem.type!=='engineNozzle') return;
    const ep=enginePumpObjs[heldItem.pumpIdx];
    if (!ep||ep.gasFuel<=0) { showNotification(L.msgOutOfGas); return; }
    const tank=towTanks[tankIdx]; if(!tank) return;
    if (tank.fill>=tank.capacity||tank.contentType==='gas') return;
    tank.fill=Math.min(tank.capacity, tank.fill+1); tank.contentType='oil';
    ep.gasFuel=Math.max(0, ep.gasFuel-ENGINE_PUMP_GAS_RATE/ENGINE_PUMP_OIL_RATE);
    refreshTowTankMesh(tankIdx); updateUI();
    if (ep.gasFuel<=0) showNotification(L.msgOutOfGas);
    else showNotification(L.promptNozzleFillTowTank(tank.fill, tank.capacity));
}

function doGasNozzleFillTowTank(tankIdx) {
    const L=I18N[currentLang];
    if (!heldItem||heldItem.type!=='gasNozzle') return;
    const tank=towTanks[tankIdx]; if(!tank) return;
    if (tank.contentType==='oil') { showNotification(L.msgGasOnly); return; }
    if (tank.fill>=tank.capacity) return;
    if (gameState.money<GAS_FILL_COST) { showNotification(L.msgNoMoney); return; }
    gameState.money-=GAS_FILL_COST;
    tank.fill=Math.min(tank.capacity, tank.fill+1); tank.contentType='gas';
    refreshTowTankMesh(tankIdx); updateUI();
    showNotification(L.msgGasNozzleFilled(tank.fill, tank.capacity));
}

function doSellTowTank() {

function doTowTankDrainStorage(stIdx) {
    const L=I18N[currentLang];
    if (!heldItem||heldItem.type!=='towTankNozzle') return;
    const tt=towTanks[heldItem.tankIdx]; if(!tt||tt.fill<=0) { showNotification(L.msgTowTankNozzleEmpty); return; }
    const st=storageTankObjs[stIdx]; if(!st) return;
    if (st.liquidType && st.liquidType!==tt.contentType) { showNotification(I18N[currentLang].msgStorageMixError||'混入不可'); return; }
    if (st.level>=STORAGE_TANK_CAP) return;
    const add=Math.min(1, STORAGE_TANK_CAP-st.level, tt.fill);
    if (add<=0) return;
    st.level+=add; st.liquidType=tt.contentType;
    tt.fill=Math.max(0,tt.fill-add);
    if (tt.fill<=0) tt.contentType=null;
    refreshTowTankMesh(heldItem.tankIdx); updateUI();
    if (tt.fill<=0) { showNotification(L.msgTowTankNozzleEmpty); doReleaseTowTankNozzle(); }

    const pj=pumpJackObjs[pjIdx]; if(!pj) return;
    if (pj.fuelLevel>=PUMP_JACK_FUEL_CAP) return;
    const add=Math.min(1, PUMP_JACK_FUEL_CAP-pj.fuelLevel, tt.fill);
    if (add<=0) return;
    pj.fuelLevel+=add;
    tt.fill=Math.max(0,tt.fill-add);
    if (tt.fill<=0) tt.contentType=null;
    refreshTowTankMesh(heldItem.tankIdx); updateUI();
    if (tt.fill<=0) { showNotification(L.msgTowTankNozzleEmpty); doReleaseTowTankNozzle(); }
}

function doTowTankDrainCan(canIdx) {
    const L=I18N[currentLang];
    if (!heldItem||heldItem.type!=='towTankNozzle') return;
    const tt=towTanks[heldItem.tankIdx]; if(!tt||tt.fill<=0) { showNotification(L.msgTowTankNozzleEmpty); return; }
    if (canIdx<0||canIdx>=worldItems.length) return;
    const target=worldItems[canIdx];
    if (target.contentType && target.contentType!==tt.contentType) return;
    const cap=target.type==='drum'?DRUM_CAP:JERRY_CAN_CAP;
    if (target.fill>=cap) return;
    const add=Math.min(1, cap-target.fill, tt.fill);
    if (add<=0) return;
    target.fill+=add; target.contentType=tt.contentType;
    tt.fill=Math.max(0,tt.fill-add);
    if (tt.fill<=0) tt.contentType=null;
    refreshWorldItemMesh(canIdx); refreshTowTankMesh(heldItem.tankIdx); updateUI();
    if (tt.fill<=0) { showNotification(L.msgTowTankNozzleEmpty); doReleaseTowTankNozzle(); }
}
