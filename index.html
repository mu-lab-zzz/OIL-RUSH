<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #1a1a1a; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #fff; touch-action: none; }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        .interactive { pointer-events: auto; }
        #header { position: absolute; top: 15px; left: 15px; right: 15px; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
        .stats-card { background: rgba(0,0,0,0.75); border: 1px solid rgba(255,255,255,0.2); backdrop-filter: blur(5px); padding: 12px 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .money-text { font-size: 24px; font-weight: bold; color: #4CAF50; }
        .held-text { font-size: 13px; color: #FFC107; margin-top: 4px; }
        .hint-text { font-size: 11px; color: rgba(255,255,255,0.5); margin-top: 3px; }
        .menu-buttons { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
        .btn { background: #2c3e50; color: white; border: 1px solid #34495e; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; transition: background 0.2s, transform 0.1s; }
        .btn:hover { background: #34495e; } .btn:active { transform: scale(0.95); }
        #notification { position: absolute; top: 80px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.88); color: #fff; padding: 10px 22px; border-radius: 20px; border: 1px solid #FFC107; font-weight: bold; pointer-events: none; opacity: 0; transition: opacity 0.3s; white-space: nowrap; z-index: 20; }
        #interaction-prompt { position: absolute; bottom: 160px; left: 50%; transform: translateX(-50%); background: rgba(46,204,113,0.93); color: #fff; padding: 9px 20px; border-radius: 12px; font-weight: bold; font-size: 14px; display: none; box-shadow: 0 0 12px rgba(46,204,113,0.5); white-space: nowrap; }
        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.85); box-shadow: 0 0 3px rgba(0,0,0,0.7); pointer-events: none; transition: background 0.1s, box-shadow 0.1s; }
        #crosshair.active { background: #2ecc71; box-shadow: 0 0 6px rgba(46,204,113,0.9); }
        #touch-controls { display: none; position: absolute; bottom: 20px; left: 0; width: 100%; justify-content: space-between; align-items: flex-end; padding: 0 24px; pointer-events: none; }
        #joystick-zone { width: 110px; height: 110px; background: rgba(255,255,255,0.12); border: 2px solid rgba(255,255,255,0.3); border-radius: 55px; position: relative; touch-action: none; pointer-events: auto; }
        #joystick-knob { width: 46px; height: 46px; background: rgba(255,255,255,0.55); border-radius: 23px; position: absolute; top: 32px; left: 32px; pointer-events: none; }
        #action-button { width: 82px; height: 82px; background: rgba(230,126,34,0.88); border: 3px solid rgba(255,255,255,0.45); border-radius: 41px; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 13px; color: white; touch-action: manipulation; pointer-events: auto; text-align: center; line-height: 1.3; }
        .modal { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 100; justify-content: center; align-items: center; pointer-events: auto; }
        .modal-content { background: #222; border: 1px solid #444; width: 90%; max-width: 500px; padding: 20px; border-radius: 8px; }
        .modal-header { font-size: 18px; font-weight: bold; margin-bottom: 15px; border-bottom: 1px solid #444; padding-bottom: 8px; }
        textarea { width: 100%; height: 120px; background: #111; color: #0f0; border: 1px solid #333; padding: 8px; font-family: monospace; resize: none; margin-bottom: 15px; border-radius: 4px; }
        .modal-buttons { display: flex; justify-content: flex-end; gap: 10px; }
        @media (pointer: coarse) { #touch-controls { display: flex; } #interaction-prompt { bottom: 155px; } }

</head>
<body>
<div id="canvas-container"></div>
<div id="ui-layer">
    <div id="header">
        <div class="stats-card">
            <div class="money-text" id="ui-money">$0</div>
            <div class="held-text" id="ui-held">手持ち: なし</div>
            <div class="hint-text" id="ui-hint">← 西: 油田　東: 町 →</div>
        </div>
        <div class="menu-buttons interactive">
            <button class="btn" id="btn-lang" onclick="toggleLanguage()">English</button>
            <button class="btn" onclick="saveGame()">セーブ</button>
            <button class="btn" onclick="loadGame()">ロード</button>
            <button class="btn" onclick="openDataModal()">データ管理</button>
        </div>
    </div>
    <div id="notification"></div>
    <div id="crosshair"></div>
    <div id="interaction-prompt"></div>
    <div id="touch-controls">
        <div id="joystick-zone"><div id="joystick-knob"></div></div>
        <div id="action-button" onclick="triggerAction()">ACT</div>
    </div>

            <button class="btn" onclick="importData()">インポート</button>
            <button class="btn" onclick="closeDataModal()">閉じる</button>

// ===== テクスチャ =====
function makeDesertTex() {
    const c = document.createElement('canvas'); c.width = c.height = 512;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#8c6d46'; ctx.fillRect(0,0,512,512);
    for (let i=0; i<40000; i++) {
        const x=Math.random()*512, y=Math.random()*512, r=Math.random()*2+0.5, s=Math.floor(Math.random()*60)-30;
        ctx.fillStyle=`rgb(${140+s},${109+s},${70+s})`;
        ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
    }
    ctx.strokeStyle='rgba(60,40,20,0.15)'; ctx.lineWidth=1.5;
    for (let i=0; i<30; i++) {
        ctx.beginPath(); let cx=Math.random()*512, cy=Math.random()*512; ctx.moveTo(cx,cy);
        for (let j=0; j<5; j++) { cx+=(Math.random()-0.5)*60; cy+=(Math.random()-0.5)*60; ctx.lineTo(cx,cy); }
        ctx.stroke();
    }
    const t = new THREE.CanvasTexture(c);
    t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(60,60); return t;
}
function makeAsphaltTex() {
    const c = document.createElement('canvas'); c.width=c.height=256;
    const ctx = c.getContext('2d');
    ctx.fillStyle='#1a1a1a'; ctx.fillRect(0,0,256,256);
    for (let i=0; i<5000; i++) {
        const x=Math.random()*256, y=Math.random()*256, s=Math.floor(Math.random()*20)-10;
        ctx.fillStyle=`rgb(${26+s},${26+s},${26+s})`; ctx.fillRect(x,y,2,2);
    }
    const t = new THREE.CanvasTexture(c);
    t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(4,4); return t;
}

// ===== メッシュヘルパー =====
function bx(w,h,d,color,roughness=0.8,metalness=0.0) {
    const m = new THREE.Mesh(
        new THREE.BoxGeometry(w,h,d),
        new THREE.MeshStandardMaterial({color,roughness,metalness})
    );
    m.castShadow=true; m.receiveShadow=true; return m;
}

// ===== ひしゃくメッシュ =====
function createLadleMesh(hasOil=false) {
    const g = new THREE.Group();
    const woodMat = new THREE.MeshStandardMaterial({color:0x6d4c41,roughness:0.9});
    const metalMat = new THREE.MeshStandardMaterial({color:0x9e9e9e,roughness:0.3,metalness:0.8});

    // 柄
    const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.022,0.018,0.75,7), woodMat);
    handle.rotation.z=Math.PI/2; handle.position.x=0.3; handle.castShadow=true; g.add(handle);

    // お椀 (外)
    const bowl = new THREE.Mesh(
        new THREE.SphereGeometry(0.11,10,6,0,Math.PI*2,0,Math.PI/1.8), metalMat
    );
    bowl.rotation.x=Math.PI; bowl.position.set(-0.07,0.02,0); bowl.castShadow=true; g.add(bowl);

    // お椀 (内側)
    const bowlIn = new THREE.Mesh(
        new THREE.SphereGeometry(0.096,10,6,0,Math.PI*2,0,Math.PI/1.8),
        new THREE.MeshStandardMaterial({color:0x777777,roughness:0.4,metalness:0.7,side:THREE.BackSide})
    );
    bowlIn.rotation.x=Math.PI; bowlIn.position.set(-0.07,0.02,0); g.add(bowlIn);

    // 原油
    if (hasOil) {
        const oil = new THREE.Mesh(
            new THREE.CylinderGeometry(0.085,0.085,0.025,10),
            new THREE.MeshStandardMaterial({color:0x050505,roughness:0.05,metalness:0.95})
        );
        oil.position.set(-0.07,-0.055,0); g.add(oil);
    }
    return g;
}

function createTowTankMesh(capacity, fill=0, contentType=null) {
    const g = new THREE.Group();
    // 容量により寸法を決定
    const r = capacity<=500 ? 0.85 : capacity<=1500 ? 1.1 : 1.45;
    const h = capacity<=500 ? 2.2  : capacity<=1500 ? 3.0  : 4.0;
    const tankColor = contentType==='gas' ? 0xb71c1c : (fill>0 ? 0x1a237e : 0x37474f);
    const tankMat = new THREE.MeshStandardMaterial({color:tankColor,roughness:0.4,metalness:0.6});
    const bandMat = new THREE.MeshStandardMaterial({color:0x78909c,roughness:0.3,metalness:0.8});
    const frameMat= new THREE.MeshStandardMaterial({color:0x546e7a,roughness:0.5,metalness:0.6});

    // 本体シリンダー（横置き）
    const body = new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,16), tankMat);
    body.rotation.z = Math.PI/2; body.position.y = r + 0.55; body.castShadow=true; g.add(body);
    // 端蓋
    const capMat = new THREE.MeshStandardMaterial({color:0x546e7a,roughness:0.35,metalness:0.7});
    [-h/2, h/2].forEach(ox => {
        const cap = new THREE.Mesh(new THREE.CylinderGeometry(r*0.98,r*0.98,0.08,16), capMat);
        cap.rotation.z = Math.PI/2; cap.position.set(ox, r+0.55, 0); g.add(cap);
    });
    // バンド
    const nbands = capacity<=500?2:capacity<=1500?3:4;
    for(let i=0;i<nbands;i++){
        const bx2=-(h/2)+h*(i+0.5)/nbands;
        const band=new THREE.Mesh(new THREE.TorusGeometry(r+0.04,0.06,8,20),bandMat);
        band.rotation.x=Math.PI/2; band.rotation.y=Math.PI/2;
        band.position.set(bx2,r+0.55,0); g.add(band);
    }
    // 充填インジケータ
    if(fill>0){
        const cap2 = TOW_TANK_CAPS[`towTank${capacity}`] || capacity;
        const ratio = Math.min(fill/cap2,1);
        const fh = h * ratio * 0.92;
        const fillColor = contentType==='gas'?0xff6f00:0x060606;
        const fmesh = new THREE.Mesh(
            new THREE.CylinderGeometry(r*0.85,r*0.85,fh,12),
            new THREE.MeshStandardMaterial({color:fillColor,roughness:0.05,metalness:0.9})
        );
        fmesh.rotation.z=Math.PI/2; fmesh.position.set(-h/2*(1-ratio)+fh/2-h/2,r+0.55,0); g.add(fmesh);
    }
    // フレーム（支持脚）
    const legH = 0.55;
    [-h*0.35, h*0.35].forEach(ox2 => {
        [-0.55,0.55].forEach(oz2 => {
            const leg = bx(0.12,legH,0.12,0x546e7a,0.6,0.5);
            leg.position.set(ox2, legH/2, oz2); g.add(leg);
        });
        const xbar = bx(0.1,0.1,1.3,0x546e7a,0.6,0.5);
        xbar.position.set(ox2, legH, 0); g.add(xbar);
    });
    // 充填口
    const filler = new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.12,0.22,8),
        new THREE.MeshStandardMaterial({color:0x424242,roughness:0.6}));
    filler.position.set(0, r*2+0.55+0.11, 0); g.add(filler);
    // 容量ラベル用の色帯
    const labelColor = capacity<=500?0xffa000:capacity<=1500?0x1565c0:0x558b2f;
    const label = new THREE.Mesh(new THREE.CylinderGeometry(r+0.01,r+0.01,0.3,16),
        new THREE.MeshStandardMaterial({color:labelColor,roughness:0.5}));
    label.rotation.z=Math.PI/2; label.position.set(0,r+0.55,0); g.add(label);

    g.traverse(m=>{ m.castShadow=true; m.receiveShadow=true; });
    return g;
}

// ===== ワールドアイテム スポーン/削除/更新 =====
function spawnWorldItem(type, x, z, hasOil=false, fill=0, yPos=0, contentType=null) {
    const g = new THREE.Group();
    let mesh;
    if (type === 'ladle') {
        mesh = createLadleMesh(hasOil);
        mesh.rotation.set(0, Math.PI*0.15 + x*0.01, 0);
        mesh.scale.setScalar(1.5);
    } else if (type === 'handPump') {
        mesh = createHandPumpMesh();
        mesh.scale.setScalar(1.0);
    } else if (type === 'drum') {
        mesh = createDrumMesh(fill, contentType);
        mesh.scale.setScalar(1.0);
    } else if (type === 'enginePump') {
        mesh = createEnginePumpMesh();
        mesh.scale.setScalar(1.0);
    } else {
        mesh = createJerryCanMesh(fill);
        mesh.scale.setScalar(1.3);
    }
    g.add(mesh);
    g.position.set(x, yPos, z);
    scene.add(g);
    const entry = { type, group: g, x, z, fill, hasOil, contentType };
    worldItems.push(entry);
    return entry;
}

function removeWorldItem(idx) {
    if (highlightedItemIdx === idx) highlightedItemIdx = -1;
    else if (highlightedItemIdx > idx) highlightedItemIdx--;

}

function refreshWorldItemMesh(idx) {
    if (highlightedItemIdx === idx) highlightedItemIdx = -1; // グループ差し替え前にリセット

}

// ===== ドロップ位置（コリジョン回避） =====
function isItemPosBlocked(x, z) {
    const hw=0.3; // アイテム占有半径
    for (const b of collisionBoxes) {
        if (x+hw>b.x-b.hw && x-hw<b.x+b.hw && z+hw>b.z-b.hd && z-hw<b.z+b.hd) return true;
    }
    if (x<-585||x>585||z<-585||z>585) return true;
    return false;
}

function getDropPos() {
    const fx=-Math.sin(gameState.cameraYaw), fz=-Math.cos(gameState.cameraYaw);
    const px=playerGroup.position.x, pz=playerGroup.position.z;
    // 前方1.2mから少しずつ近づいて最初に有効な位置を返す
    for (let dist=1.2; dist>=0.3; dist-=0.15) {
        const cx=px+fx*dist, cz=pz+fz*dist;
        if (!isItemPosBlocked(cx, cz)) return {x:cx, z:cz};
    }
    // 全てブロックされていたらプレイヤー位置の横にずらす
    const sx=-fz, sz=fx; // 右方向ベクトル
    for (let s=0.5; s<=1.5; s+=0.5) {
        const cx=px+sx*s, cz=pz+sz*s;
        if (!isItemPosBlocked(cx, cz)) return {x:cx, z:cz};
        if (!isItemPosBlocked(px-sx*s, pz-sz*s)) return {x:px-sx*s, z:pz-sz*s};
    }
    return {x:px, z:pz}; // 最終フォールバック
}

// ===== Three.js 初期化 =====
// ===== 空（スカイドーム＋雲） =====
function createSky() {
    // グラデーションシェーダースカイドーム
    const skyVert = `
        varying vec3 vWorldDir;
        void main() {
            vWorldDir = normalize((modelMatrix * vec4(position, 0.0)).xyz);
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
    `;
    const skyFrag = `
        uniform vec3 zenithColor;
        uniform vec3 horizonColor;
        uniform vec3 sunDir;
        varying vec3 vWorldDir;
        void main() {
            float t = pow(clamp(vWorldDir.y, 0.0, 1.0), 0.42);
            vec3 sky = mix(horizonColor, zenithColor, t);

            // ホライズン帯のオレンジグロー
            float hz = pow(1.0 - clamp(abs(vWorldDir.y) * 4.0, 0.0, 1.0), 4.0);
            sky = mix(sky, vec3(0.98, 0.60, 0.22), hz * 0.32);

            // 太陽外縁グロー
            float sd = clamp(dot(normalize(vWorldDir), sunDir), 0.0, 1.0);
            sky += vec3(1.0, 0.82, 0.45) * pow(sd, 10.0) * 0.55;
            // 太陽ディスク
            sky += vec3(1.0, 0.97, 0.88) * pow(sd, 300.0) * 3.0;

            gl_FragColor = vec4(sky, 1.0);
        }
    `;

    skyDome = new THREE.Mesh(
        new THREE.SphereGeometry(700, 32, 16),
        new THREE.ShaderMaterial({
            vertexShader: skyVert,
            fragmentShader: skyFrag,
            uniforms: {
                zenithColor:  { value: new THREE.Color(0x1a5099) },
                horizonColor: { value: new THREE.Color(0xc8956b) },
                sunDir:       { value: new THREE.Vector3(0.557, 0.743, 0.371) },
            },
            side: THREE.BackSide,
            depthWrite: false,
        })
    );
    skyDome.renderOrder = -1;
    scene.add(skyDome);

    // フォグをホライズン色に合わせる
    scene.fog = new THREE.FogExp2(0xc8956b, 0.0018);

    // 雲
    const cloudBase = new THREE.MeshStandardMaterial({
        color: 0xf5f0ea, roughness: 1.0, transparent: true, opacity: 0.88, depthWrite: false
    });
    [
        [-80, 58, -45, 32, 9],
        [ 35, 64, -85, 24, 7],
        [110, 52, -28, 36, 10],
        [-38, 60,  78, 22, 7],
        [ 78, 56,  68, 30, 9],
        [-130,68,  22, 26, 8],
        [155, 54, -58, 28, 8],
        [  8, 70,-128, 20, 6],
        [ 60, 62, 130, 26, 8],
        [-100,50,  -5, 30, 8],
    ].forEach(([x, y, z, w, h]) => {
        const g = new THREE.Group();
        const cm = cloudBase.clone();
        const mk = (sw, sh, sd) => {
            const m = new THREE.Mesh(new THREE.BoxGeometry(sw, sh, sd), cm);
            m.castShadow = false; return m;
        };
        // 主体
        const main = mk(w, h, w*0.52); g.add(main);
        // 横の膨らみ
        [[-w*0.36,-h*0.12, 0],[w*0.36,-h*0.12, 0],[0,-h*0.10, w*0.18]].forEach(([ox,oy,oz])=>{
            const p = mk(w*0.62, h*0.72, w*0.44);
            p.position.set(ox,oy,oz); g.add(p);
        });
        g.position.set(x, y, z);
        g.rotation.y = x * 0.05; // 雑な向きのバラツキ
        scene.add(g);
        clouds.push(g);
    });
}

    (()=>{

            -hw,0, hd_,  hw,0, hd_,  0,rH,0,   // 前面

             hw,0, hd_,  hw,0,-hd_,  0,rH,0,   // 右面

        const roofGeo = new THREE.BufferGeometry();
        roofGeo.setAttribute('position', new THREE.BufferAttribute(v,3));
        roofGeo.computeVertexNormals();
        const roof = new THREE.Mesh(roofGeo, new THREE.MeshStandardMaterial({color:0xbf360c,roughness:0.9}));

// ===== 商品展示倉庫 =====
function createShopDisplay(x, z, rotY=0) {
    const g = new THREE.Group(); g.position.set(x, 0, z);
    g.rotation.y = rotY;

    // ローカル座標 → ワールド座標変換
    const cosR = Math.cos(rotY), sinR = Math.sin(rotY);
    function wld(lx, lz) { return [x + lx*cosR + lz*sinR, z - lx*sinR + lz*cosR]; }

    const W=24, D=20, H=6;
    const hw=W/2, hd=D/2;

    // 床
    const floor = bx(W, 0.1, D, 0x9e9e9e, 0.93);
    floor.position.set(0, 0.05, 0); g.add(floor);

    // 奥壁
    const wBack = bx(W+0.5, H, 0.45, 0x546e7a, 0.75, 0.35);
    wBack.position.set(0, H/2, -hd); g.add(wBack);

    // 側壁 (入り口側 4m 開放)
    const sideLen = D - 4;
    const wL = bx(0.45, H, sideLen, 0x546e7a, 0.75, 0.35);
    wL.position.set(-hw, H/2, -hd + sideLen/2); g.add(wL);
    const wR = bx(0.45, H, sideLen, 0x546e7a, 0.75, 0.35);
    wR.position.set( hw, H/2, -hd + sideLen/2); g.add(wR);

    // 屋根
    const roofMain = bx(W+0.7, 0.4, D+0.7, 0x37474f, 0.55, 0.45);
    roofMain.position.set(0, H+0.2, 0); g.add(roofMain);

    // 入り口キャノピー (庇)
    const canopy = bx(W+0.7, 0.2, 5.5, 0x37474f, 0.55, 0.45);
    canopy.position.set(0, H-0.5, hd+2.5); g.add(canopy);

    // 支柱 6本 (前・中・後 × 左右)
    [[-hw+0.45, hd-0.45], [hw-0.45, hd-0.45],
     [-hw+0.45, 0],        [hw-0.45, 0],
     [-hw+0.45, -hd+0.45], [hw-0.45, -hd+0.45]].forEach(([cx,cz])=>{
        const col = bx(0.55, H+0.4, 0.55, 0x263238, 0.6, 0.5);
        col.position.set(cx, (H+0.4)/2, cz); g.add(col);
    });

    // 看板
    const sig  = bx(W-3, 1.5, 0.28, 0x1b5e20, 0.8);
    sig.position.set(0, H+1.05, hd-0.1); g.add(sig);
    const sigF = bx(W-4.2, 1.0, 0.09, 0xa5d6a7, 0.7);
    sigF.position.set(0, H+1.05, hd+0.06); g.add(sigF);

    scene.add(g);

    // コリジョン: 回転後のワールド座標で奥壁・左右壁を登録
    const [bwx,bwz] = wld(0, -hd);
    const [lwx,lwz] = wld(-hw, -hd+sideLen/2);
    const [rwx,rwz] = wld( hw, -hd+sideLen/2);
    const is90 = Math.abs(Math.abs(rotY) - Math.PI/2) < 0.01;
    if (is90) {
        // ±90°: 奥壁は z 方向に広がる、側壁は x 方向に広がる
        collisionBoxes.push({x:bwx, z:bwz, hw:0.35,      hd:hw});
        collisionBoxes.push({x:lwx, z:lwz, hw:sideLen/2,  hd:0.35});
        collisionBoxes.push({x:rwx, z:rwz, hw:sideLen/2,  hd:0.35});
    } else {
        // 0°/180°: 奥壁は x 方向に広がる、側壁は z 方向に広がる
        collisionBoxes.push({x:bwx, z:bwz, hw:hw,         hd:0.35});
        collisionBoxes.push({x:lwx, z:lwz, hw:0.35,        hd:sideLen/2});
        collisionBoxes.push({x:rwx, z:rwz, hw:0.35,        hd:sideLen/2});
    }

    // --- 商品台座 (3列 × 2行 = 6スロット) ---
    const COLS = [-8, 0, 8];
    const ROWS = [+5, -3];

    const CATALOG = [
        {type:'ladle',       price:5,   col:0, row:0},
        {type:'jerryCan',    price:15,  col:1, row:0},
        {type:'drum',        price:120, col:2, row:0},
        {type:'handPump',    price:20,  col:0, row:1},
        {type:'enginePump',  price:300, col:1, row:1},
    ];

    CATALOG.forEach(({type, price, col, row}) => {
        const lx = COLS[col], lz = ROWS[row];

        const ped = bx(1.8, 0.9, 1.8, 0x5d4037, 0.9);
        ped.position.set(lx, 0.45, lz); g.add(ped);
        const pedTop = bx(1.9, 0.06, 1.9, 0xd7ccc8, 0.82);
        pedTop.position.set(lx, 0.93, lz); g.add(pedTop);
        const plac = bx(1.0, 0.35, 0.09, 0xfff9c4, 0.7);
        plac.position.set(lx, 1.08, lz+0.95); g.add(plac);

        const baseY = 0.96;
        let m;
        if (type === 'ladle') {
            m = createLadleMesh(false); m.scale.setScalar(2.2);
            m.position.set(lx, baseY+0.22, lz); m.rotation.y = 0.4;
        } else if (type === 'handPump') {
            m = createHandPumpMesh(); m.scale.setScalar(0.78);
            m.position.set(lx, baseY, lz);
        } else if (type === 'drum') {
            m = createDrumMesh(0, null); m.scale.setScalar(1.6);
            m.position.set(lx, baseY+0.08, lz);
        } else if (type === 'enginePump') {
            m = createEnginePumpMesh(); m.scale.setScalar(0.75);
            m.position.set(lx, baseY, lz);
        } else {
            m = createJerryCanMesh(0); m.scale.setScalar(2.0);
            m.position.set(lx, baseY+0.06, lz);
        }
        g.add(m);

        const idx = shopDisplayItems.length;
        m.traverse(child => { if (child.isMesh) shopMeshToIdx.set(child.uuid, idx); });
        // ドロップ位置: 入口の外 (回転考慮)
        const [dropX, dropZ] = wld(lx, hd+2);
        shopDisplayItems.push({ type, price, mesh:m, dropX, dropZ });
    });

    // --- リヤカー ---
    const cLX = COLS[1], cLZ = ROWS[1];
    const cartMark = bx(3.5, 0.06, 6.0, 0x8d6e63, 0.92);
    cartMark.position.set(cLX, 0.03, cLZ); g.add(cartMark);
    const [cartWX, cartWZ] = wld(cLX, cLZ);
    createHandcart(cartWX, cartWZ);
}

function createHandcart(x, z) {
    const g = new THREE.Group();
    const metalMat = new THREE.MeshStandardMaterial({color:0x607d8b,roughness:0.4,metalness:0.7});
    const woodMat  = new THREE.MeshStandardMaterial({color:0x8d6e63,roughness:0.85});
    const wheelMat = new THREE.MeshStandardMaterial({color:0x212121,roughness:0.8});
    const rimMat   = new THREE.MeshStandardMaterial({color:0x78909c,roughness:0.3,metalness:0.8});

    // 荷台床板
    const bed = new THREE.Mesh(new THREE.BoxGeometry(1.2,0.07,2.8), woodMat);
    bed.position.y=0.55; bed.castShadow=true; g.add(bed);

    // 荷台左右・前後サイド枠
    [[-0.62,0,0.04,2.82,0.18],[0.62,0,0.04,2.82,0.18],[0,-1.43,1.28,0.04,0.22],[0,1.43,1.28,0.04,0.22]].forEach(([ex,ez,ew,ed,eh])=>{
        const f = bx(ew,eh,ed,0x546e7a,0.4,0.6);
        f.position.set(ex,0.64,ez); g.add(f);
    });

    // 車輪 2個 (前方)
    for (const sx of [-0.68,0.68]) {
        const whl = new THREE.Mesh(new THREE.CylinderGeometry(0.36,0.36,0.10,20), wheelMat);
        whl.rotation.z=Math.PI/2; whl.position.set(sx,0.36,-1.2); whl.castShadow=true; g.add(whl);
        const rim = new THREE.Mesh(new THREE.TorusGeometry(0.36,0.04,8,20), rimMat);
        rim.rotation.x=Math.PI/2; rim.position.set(sx,0.36,-1.2); g.add(rim);
        const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.07,0.12,8), rimMat);
        hub.rotation.z=Math.PI/2; hub.position.set(sx,0.36,-1.2); g.add(hub);
    }
    // 車軸
    const axle = new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,1.5,8), metalMat);
    axle.rotation.z=Math.PI/2; axle.position.set(0,0.36,-1.2); g.add(axle);

    // フレーム下桁
    const fbl = bx(1.28,0.07,2.86,0x546e7a,0.4,0.6); fbl.position.set(0,0.37,0); g.add(fbl);

    // ハンドル支柱 (後方)
    for (const sx of [-0.5,0.5]) {
        const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,0.7,8), metalMat);
        pole.position.set(sx,0.93,1.4); g.add(pole);
    }
    // ハンドルバー
    const hbar = new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,1.1,8), metalMat);
    hbar.rotation.z=Math.PI/2; hbar.position.set(0,1.28,1.4); g.add(hbar);
    // ハンドルグリップ
    for (const sx of [-0.48,0.48]) {
        const grip = new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,0.18,8), new THREE.MeshStandardMaterial({color:0x212121,roughness:0.9}));
        grip.rotation.z=Math.PI/2; grip.position.set(sx,1.28,1.4); g.add(grip);
    }
    // 前足 (駐車支え)
    for (const sx of [-0.38,0.38]) {
        const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.035,0.55,8), metalMat);
        leg.position.set(sx,0.275,-1.47); g.add(leg);
    }

    g.position.set(x,0,z);
    scene.add(g);

    cartObj = {
        group: g, x, z, isHeld: false,
        purchased: false,
        slots: new Array(10).fill(null),
        cartItemMeshMap: new Map()
    };

    // 未購入なら商品として登録
    if (gameState.hasCart) {
        cartObj.purchased = true;
    } else {
        const idx = shopDisplayItems.length;
        g.traverse(m => { if(m.isMesh) shopMeshToIdx.set(m.uuid, idx); });
        shopDisplayItems.push({ type:'handcart', price:80, mesh:g, dropX:x, dropZ:z });
    }
}

function createRock(x,z,s) {
    const m=new THREE.Mesh(new THREE.DodecahedronGeometry(s*0.55,1),new THREE.MeshStandardMaterial({color:0x78909c,roughness:0.9}));
    m.position.set(x,s*0.27,z); m.rotation.set(Math.random()*2,Math.random()*2,Math.random()*2);
    m.castShadow=true; m.receiveShadow=true; scene.add(m);
}
function createTree(x,z) {
    const g=new THREE.Group(); g.position.set(x,0,z);
    const trunk=bx(0.35,2.2,0.35,0x5d4037); trunk.position.y=1.1; g.add(trunk);
    const foliage=new THREE.Mesh(new THREE.SphereGeometry(1.3,8,6),new THREE.MeshStandardMaterial({color:0x2e7d32,roughness:0.9}));
    foliage.position.y=3.0; foliage.castShadow=true; g.add(foliage); scene.add(g);
}
function createStreetLight(x,z,rotY=0) {
    const g=new THREE.Group(); g.position.set(x,0,z); g.rotation.y=rotY;
    const pole=bx(0.1,4.5,0.1,0x9e9e9e,0.5,0.8); pole.position.y=2.25; g.add(pole);
    const arm=bx(0.08,0.08,0.8,0x9e9e9e,0.5,0.8); arm.position.set(0,4.5,-0.4); g.add(arm);
    const lamp=new THREE.Mesh(new THREE.SphereGeometry(0.18,8,6),
        new THREE.MeshStandardMaterial({color:0xffff88,emissive:0xffff00,emissiveIntensity:0.8}));
    lamp.position.set(0,4.5,-0.8); g.add(lamp);
    const light=new THREE.PointLight(0xffeeaa,0.6,18);
    light.position.set(0,4.4,-0.8); g.add(light); scene.add(g);
}
function createJunkPile(x,z) {
    const g=new THREE.Group(); g.position.set(x,0,z);
    const colors=[0x546e7a,0x37474f,0x455a64];
    for (let i=0; i<4; i++) {
        const junk=bx(0.5+Math.random()*0.8,0.4+Math.random()*0.6,0.4+Math.random()*0.8,colors[i%colors.length],0.8,0.4);
        junk.position.set((Math.random()-0.5)*2,0.3,(Math.random()-0.5)*2);
        junk.rotation.y=Math.random()*Math.PI; g.add(junk);
    }
    scene.add(g);
}

// ===== 入力 =====
const keys={w:false,a:false,s:false,d:false,space:false};
window.addEventListener('keydown',e=>{
    if (e.code==='KeyW'||e.code==='ArrowUp')    keys.w=true;
    if (e.code==='KeyA'||e.code==='ArrowLeft')  keys.a=true;
    if (e.code==='KeyS'||e.code==='ArrowDown')  keys.s=true;
    if (e.code==='KeyD'||e.code==='ArrowRight') keys.d=true;
    if (e.code==='Space') { e.preventDefault(); if(!keys.space) triggerAction(); keys.space=true; }
});
window.addEventListener('keyup',e=>{
    if (e.code==='KeyW'||e.code==='ArrowUp')    keys.w=false;
    if (e.code==='KeyA'||e.code==='ArrowLeft')  keys.a=false;
    if (e.code==='KeyS'||e.code==='ArrowDown')  keys.s=false;
    if (e.code==='KeyD'||e.code==='ArrowRight') keys.d=false;
    if (e.code==='Space') keys.space=false;
});

let joystickActive=false,joystickTouchId=null,joystickVector={x:0,y:0};
let lookTouchId=null,lastTouchPos={x:0,y:0},isMouseDown=false;
const joystickZone=document.getElementById('joystick-zone');
const joystickKnob=document.getElementById('joystick-knob');

window.addEventListener('touchstart',e=>{
    for (let i=0;i<e.changedTouches.length;i++) {
        const t=e.changedTouches[i];
        const r=joystickZone.getBoundingClientRect();
        if (t.clientX>=r.left&&t.clientX<=r.right&&t.clientY>=r.top&&t.clientY<=r.bottom) {
            if (joystickTouchId===null) { joystickTouchId=t.identifier; joystickActive=true; updateJoystick(t); }
        } else if (t.clientX>innerWidth/3&&lookTouchId===null) {
            lookTouchId=t.identifier; lastTouchPos.x=t.clientX; lastTouchPos.y=t.clientY;
        }
    }
},{passive:false});
window.addEventListener('touchmove',e=>{
    for (let i=0;i<e.changedTouches.length;i++) {
        const t=e.changedTouches[i];
        if (t.identifier===joystickTouchId) { updateJoystick(t); }
        else if (t.identifier===lookTouchId) {
            gameState.cameraYaw -=(t.clientX-lastTouchPos.x)*0.005;
            gameState.cameraPitch-=(t.clientY-lastTouchPos.y)*0.005;
            gameState.cameraPitch=Math.max(-Math.PI/2.2,Math.min(Math.PI/2.2,gameState.cameraPitch));
            lastTouchPos.x=t.clientX; lastTouchPos.y=t.clientY;
        }
    }
},{passive:false});
window.addEventListener('touchend',e=>{
    for (let i=0;i<e.changedTouches.length;i++) {
        const t=e.changedTouches[i];
        if (t.identifier===joystickTouchId) {
            joystickTouchId=null; joystickActive=false; joystickVector={x:0,y:0};
            joystickKnob.style.top='32px'; joystickKnob.style.left='32px';
        } else if (t.identifier===lookTouchId) { lookTouchId=null; }
    }
});
window.addEventListener('mousedown',e=>{
    if (e.target.closest('.interactive')||e.target.closest('.modal')) return;
    isMouseDown=true; lastTouchPos.x=e.clientX; lastTouchPos.y=e.clientY;
});
window.addEventListener('mousemove',e=>{
    if (!isMouseDown) return;
    gameState.cameraYaw -=(e.clientX-lastTouchPos.x)*0.003;
    gameState.cameraPitch-=(e.clientY-lastTouchPos.y)*0.003;
    gameState.cameraPitch=Math.max(-Math.PI/2.2,Math.min(Math.PI/2.2,gameState.cameraPitch));
    lastTouchPos.x=e.clientX; lastTouchPos.y=e.clientY;
});
window.addEventListener('mouseup',()=>{isMouseDown=false;});

function updateJoystick(touch) {
    const r=joystickZone.getBoundingClientRect();
    let dx=touch.clientX-(r.left+r.width/2), dy=touch.clientY-(r.top+r.height/2);
    const maxR=40, dist=Math.hypot(dx,dy);
    if (dist>maxR) { dx=dx/dist*maxR; dy=dy/dist*maxR; }
    joystickKnob.style.left=`${32+dx}px`; joystickKnob.style.top=`${32+dy}px`;
    joystickVector.x=dx/maxR; joystickVector.y=dy/maxR;
}

// ===== アクション検出 =====
function computeCurrentAction() {
    const px=playerGroup.position.x, pz=playerGroup.position.z;
    const L=I18N[currentLang];

    const aimIdx  = raycastTargetIdx;
    const aimItem = (aimIdx>=0 && aimIdx<worldItems.length) ? worldItems[aimIdx] : null;

    let nearOil=null;
    for (const it of interactables) {
        if (it.type!=='oil') continue;
        if (Math.hypot(px-it.group.position.x, pz-it.group.position.z)<it.radius) { nearOil=it; break; }
    }
    let nearDepot=null;
    for (const it of interactables) {
        if (it.type!=='depot') continue;
        if (Math.hypot(px-it.group.position.x, pz-it.group.position.z)<it.radius) { nearDepot=it; break; }
    }
    let nearGiantDepot=null;
    for (const it of interactables) {
        if (it.type!=='giantDepot') continue;
        if (Math.hypot(px-it.group.position.x, pz-it.group.position.z)<it.radius) { nearGiantDepot=it; break; }
    }
    let nearGasStation=null;
    for (const it of interactables) {
        if (it.type!=='gasStation') continue;
        if (Math.hypot(px-it.group.position.x, pz-it.group.position.z)<it.radius) { nearGasStation=it; break; }
    }

    const nearCart = cartObj && cartObj.purchased && Math.hypot(px-cartObj.x, pz-cartObj.z) < 3.5;

    // --- 車両運転中 ---
    if (towVehicle && towVehicle.inVehicle) {
        // タンク連結済み → 売却または切り離し
        if (towVehicle.hitchedTankIdx >= 0) {
            const tank = towTanks[towVehicle.hitchedTankIdx];
            if (tank) {
                if (tank.fill>0 && tank.contentType!=='gas' && nearGiantDepot)
                    return { type:'sellTowTank', label:L.promptSellTowTank(tank.fill) };
                return { type:'detachTowTank', label:L.promptDetachTank };
            }
        }
        // タンクに照準 → 連結
        if (raycastTowTankIdx>=0 && towVehicle.hitchedTankIdx<0) {
            const tank = towTanks[raycastTowTankIdx];
            const capKey = Object.keys(TOW_TANK_CAPS).find(k=>TOW_TANK_CAPS[k]===tank.capacity)||'';
            const name = L['nameTowTank'+tank.capacity] || `Tank ${tank.capacity}L`;
            return { type:'attachTowTank', label:L.promptAttachTank(name), tankIdx:raycastTowTankIdx };
        }
        return { type:'exitVehicle', label:L.promptExitVehicle };
    }

    // --- ひしゃく持ち ---
    if (heldItem && heldItem.type==='ladle') {
        if (!heldItem.hasOil && nearOil) return { type:'scoop', label:L.promptScoop };
        if (heldItem.hasOil && aimItem && aimItem.type==='jerryCan' && aimItem.fill+LADLE_AMOUNT<=JERRY_CAN_CAP)
            return { type:'pour', label:L.promptPour(aimItem.fill), canIdx:aimIdx };
        if (heldItem.hasOil && aimItem && aimItem.type==='drum' && aimItem.contentType!=='gas' && aimItem.fill+LADLE_AMOUNT<=DRUM_CAP)
            return { type:'pourDrum', label:L.promptPourDrum(aimItem.fill), canIdx:aimIdx };
        if (nearCart && cartCapacityUsed()+1<=10) return { type:'loadCart', label:L.promptLoadCart };
        return { type:'putDown', label:L.promptPutDown };
    }

    // --- エンジンノズル持ち ---
    if (heldItem && heldItem.type==='engineNozzle') {
        const ep = enginePumpObjs[heldItem.pumpIdx];
        if (ep) {
            const distToPump = Math.hypot(px-ep.x, pz-ep.z);
            if (distToPump <= ENGINE_HOSE_LENGTH) {
                if (ep.gasFuel > 0) {
                    if (aimItem && aimItem.type==='jerryCan' && aimItem.contentType!=='gas' && aimItem.fill<JERRY_CAN_CAP)
                        return { type:'nozzleFill', label:L.promptNozzleFill(aimItem.fill, JERRY_CAN_CAP), canIdx:aimIdx };
                    if (aimItem && aimItem.type==='drum' && aimItem.contentType!=='gas' && aimItem.fill<DRUM_CAP)
                        return { type:'nozzleFill', label:L.promptNozzleFill(aimItem.fill, DRUM_CAP), canIdx:aimIdx };
                    // 牽引タンクに注入
                    if (raycastTowTankIdx>=0) {
                        const tt=towTanks[raycastTowTankIdx];
                        if (tt && tt.contentType!=='gas' && tt.fill<tt.capacity)
                            return { type:'nozzleFillTowTank', label:L.promptNozzleFillTowTank(tt.fill,tt.capacity), tankIdx:raycastTowTankIdx };
                    }
                }
            }
        }
        return { type:'releaseNozzle', label:L.promptReleaseNozzle };
    }

    // --- ガスノズル持ち ---
    if (heldItem && heldItem.type==='gasNozzle') {
        const gs = gasStationObjs[heldItem.stationIdx];
        if (gs) {
            const distToStation = Math.hypot(px-gs.x, pz-gs.z);
            if (distToStation <= GAS_HOSE_LENGTH) {
                if (aimItem && aimItem.type==='jerryCan' && aimItem.contentType!=='oil' && aimItem.fill<JERRY_CAN_CAP)
                    return { type:'gasNozzleFill', label:L.promptGasNozzleFill(aimItem.fill, JERRY_CAN_CAP, GAS_FILL_COST), canIdx:aimIdx };
                if (aimItem && aimItem.type==='drum' && aimItem.contentType!=='oil' && aimItem.fill<DRUM_CAP)
                    return { type:'gasNozzleFill', label:L.promptGasNozzleFill(aimItem.fill, DRUM_CAP, GAS_FILL_COST), canIdx:aimIdx };
                // 牽引タンクにガス給油
                if (raycastTowTankIdx>=0) {
                    const tt=towTanks[raycastTowTankIdx];
                    if (tt && tt.contentType!=='oil' && tt.fill<tt.capacity)
                        return { type:'gasNozzleFillTowTank', label:L.promptGasNozzleFillTowTank(tt.fill,tt.capacity,GAS_FILL_COST), tankIdx:raycastTowTankIdx };
                }
            }
        }
        return { type:'releaseGasNozzle', label:L.promptReleaseGasNozzle };
    }

    // --- ジェリ缶持ち ---
    if (heldItem && heldItem.type==='jerryCan') {
        if (heldItem.fill>0 && heldItem.contentType!=='gas' && nearDepot)
            return { type:'sell', label:L.promptSell(canPrice(heldItem.fill)) };
        if (raycastPumpIdx>=0 && !pumpObjs[raycastPumpIdx].attachedCan)
            return { type:'attachCan', label:L.promptAttachCan, pumpIdx:raycastPumpIdx };
        if (heldItem.contentType==='gas' && raycastEnginePumpIdx>=0)
            return { type:'fuelEnginePump', label:L.promptFuelEnginePump(enginePumpObjs[raycastEnginePumpIdx].gasFuel), epIdx:raycastEnginePumpIdx };
        if (nearCart && cartCapacityUsed()+1<=10) return { type:'loadCart', label:L.promptLoadCart };
        return { type:'putDown', label:L.promptPutDown };
    }

    // --- ドラム缶持ち ---
    if (heldItem && heldItem.type==='drum') {
        if (heldItem.fill>0 && heldItem.contentType!=='gas' && nearDepot)
            return { type:'sellDrum', label:L.promptSellDrum(drumPrice(heldItem.fill)) };
        if (heldItem.contentType==='gas' && raycastEnginePumpIdx>=0)
            return { type:'fuelEnginePump', label:L.promptFuelEnginePump(enginePumpObjs[raycastEnginePumpIdx].gasFuel), epIdx:raycastEnginePumpIdx };
        if (nearCart && cartCapacityUsed()+5<=10) return { type:'loadCart', label:L.promptLoadCart };
        return { type:'putDown', label:L.promptPutDown };
    }

    // --- 汲み上げ機持ち ---
    if (heldItem && heldItem.type==='handPump') {
        if (nearOil) return { type:'installPump', label:L.promptInstallPump };
        if (nearCart && cartCapacityUsed()+1<=10) return { type:'loadCart', label:L.promptLoadCart };
        return { type:'putDown', label:L.promptPutDown };
    }

    // --- エンジンポンプ持ち ---
    if (heldItem && heldItem.type==='enginePump') {
        if (nearOil) return { type:'installEnginePump', label:L.promptInstallEnginePump };
        if (nearCart && cartCapacityUsed()+1<=10) return { type:'loadCart', label:L.promptLoadCart };
        return { type:'putDown', label:L.promptPutDown };
    }

    // --- 手が空の場合 ---
    if (!heldItem) {
        // 車両ロット商品に照準 → 購入
        if (raycastVehicleLotIdx>=0) {
            const vi=vehicleLotItems[raycastVehicleLotIdx];
            if (vi) {
                const n = vi.type==='towVehicle'?L.nameTowVehicle
                    :vi.type==='towTank500'?L.nameTowTank500
                    :vi.type==='towTank1500'?L.nameTowTank1500:L.nameTowTank3000;
                return { type:'buyVehicleLot', label:L.promptBuy(n, vi.price), lotIdx:raycastVehicleLotIdx };
            }
        }
        // 車両に近い → 乗る
        if (towVehicle && towVehiclePurchased) {
            const dv = Math.hypot(px-towVehicle.x, pz-towVehicle.z);
            if (dv < 4.0) return { type:'enterVehicle', label:L.promptEnterVehicle };
        }
        // ガスノズルに照準
        if (raycastGasNozzleIdx>=0)
            return { type:'grabGasNozzle', label:L.promptGrabGasNozzle, stIdx:raycastGasNozzleIdx };
        // エンジンポンプに照準
        if (raycastEnginePumpIdx>=0) {
            const ep = enginePumpObjs[raycastEnginePumpIdx];
            if (ep.gasFuel > 0)
                return { type:'grabNozzle', label:L.promptGrabNozzle(ep.gasFuel), epIdx:raycastEnginePumpIdx };
            return { type:'removeEnginePump', label:L.promptRemoveEnginePump, epIdx:raycastEnginePumpIdx };
        }
        // 設置済みポンプに照準
        if (raycastPumpIdx>=0) {
            const po = pumpObjs[raycastPumpIdx];
            if (po.attachedCan) {
                if (po.attachedCan.fill >= JERRY_CAN_CAP)
                    return { type:'detachCan', label:L.promptDetachCan, pumpIdx:raycastPumpIdx };
                return { type:'pumpOnce', label:L.promptPump(po.attachedCan.fill), pumpIdx:raycastPumpIdx };
            }
            return { type:'removePump', label:L.promptRemovePump, pumpIdx:raycastPumpIdx };
        }
        // ショップ展示品に照準 → 購入
        if (raycastShopItemIdx>=0) {
            const si = shopDisplayItems[raycastShopItemIdx];
            const name = si.type==='ladle' ? L.nameLadle
                : si.type==='handPump' ? L.nameHandPump
                : si.type==='handcart' ? L.nameCart
                : si.type==='drum' ? L.nameDrum
                : si.type==='enginePump' ? L.nameEnginePump
                : L.nameCan;
            return { type:'buyItem', label:L.promptBuy(name, si.price), shopItemIdx:raycastShopItemIdx };
        }
        // カートアイテムに照準 → 降ろす
        if (raycastCartSlotIdx>=0) return { type:'unloadCart', label:L.promptUnloadCart, slotIdx:raycastCartSlotIdx };
        // ワールドアイテムに照準 → 拾う
        if (aimItem) {
            let label;
            if (aimItem.type==='ladle') label=L.promptPickupLadle;
            else if (aimItem.type==='drum') label=L.promptPickupDrum(aimItem.fill, aimItem.contentType);
            else label=L.promptPickupCan(aimItem.fill, aimItem.contentType);
            return { type:'pickup', label, itemIdx:aimIdx };
        }
        // カート近傍 → 引く/離す
        if (nearCart) {
            return cartObj.isHeld
                ? { type:'releaseCart', label:L.promptReleaseCart }
                : { type:'grabCart',   label:L.promptGrabCart };
        }
        return null;
    }

    return null;
}

function canPrice(fill) {
    if (fill<=0) return 0;
    return Math.min(JERRY_CAN_CAP, fill); // $1/L
}
function drumPrice(fill) {
    if (fill<=0) return 0;
    return Math.min(DRUM_CAP, fill); // $1/L
}

// ===== アクション実行 =====
function triggerAction() {
    if (!currentAction) return;
    const L=I18N[currentLang];
    switch (currentAction.type) {
        case 'pickup':             doPickup(currentAction.itemIdx); break;
        case 'scoop':              doScoop(); break;
        case 'pour':               doPour(currentAction.canIdx); break;
        case 'pourDrum':           doPourDrum(currentAction.canIdx); break;
        case 'sell':               doSell(); break;
        case 'sellDrum':           doSellDrum(); break;
        case 'putDown':            doPutDown(); break;
        case 'grabCart':           doGrabCart(); break;
        case 'releaseCart':        doReleaseCart(); break;
        case 'loadCart':           doLoadCart(); break;
        case 'unloadCart':         doUnloadCart(currentAction.slotIdx); break;
        case 'buyItem':            doBuyItem(currentAction.shopItemIdx); break;
        case 'installPump':        doInstallPump(); break;
        case 'removePump':         doRemovePump(currentAction.pumpIdx); break;
        case 'attachCan':          doAttachCan(currentAction.pumpIdx); break;
        case 'detachCan':          doDetachCan(currentAction.pumpIdx); break;
        case 'pumpOnce':           doPumpOnce(currentAction.pumpIdx); break;
        case 'installEnginePump':  doInstallEnginePump(); break;
        case 'removeEnginePump':   doRemoveEnginePump(currentAction.epIdx); break;
        case 'grabNozzle':         doGrabNozzle(currentAction.epIdx); break;
        case 'releaseNozzle':      doReleaseNozzle(); break;
        case 'nozzleFill':         doNozzleFill(currentAction.canIdx); break;
        case 'fuelEnginePump':     doFuelEnginePump(currentAction.epIdx); break;
        case 'fillGas':            doFillGas(); break;
        case 'fillGasDrum':        doFillGasDrum(); break;
        case 'grabGasNozzle':      doGrabGasNozzle(currentAction.stIdx); break;
        case 'releaseGasNozzle':   doReleaseGasNozzle(); break;
        case 'gasNozzleFill':      doGasNozzleFill(currentAction.canIdx); break;
        case 'buyVehicleLot':      doBuyVehicleLotItem(currentAction.lotIdx); break;
        case 'enterVehicle':       doEnterVehicle(); break;
        case 'exitVehicle':        doExitVehicle(); break;
        case 'attachTowTank':      doAttachTowTank(currentAction.tankIdx); break;
        case 'detachTowTank':      doDetachTowTank(); break;
        case 'nozzleFillTowTank':  doNozzleFillTowTank(currentAction.tankIdx); break;
        case 'gasNozzleFillTowTank': doGasNozzleFillTowTank(currentAction.tankIdx); break;
        case 'sellTowTank':        doSellTowTank(); break;
    }
}

function doBuyItem(idx) {
    const si = shopDisplayItems[idx];
    if (!si) return;
    const L = I18N[currentLang];
    if (gameState.money < si.price) { showNotification(L.msgNoMoney); return; }
    gameState.money -= si.price;

    if (si.type === 'handcart') {
        // カートはすでにシーンにある — 商品登録を解除して有効化
        si.mesh.traverse(m => { if(m.isMesh) shopMeshToIdx.delete(m.uuid); });
        gameState.hasCart = true;
        cartObj.purchased = true;
        if (highlightedShopItemIdx === idx) {
            si.mesh.traverse(m => { if(m.isMesh&&m.material&&m.material.emissive) m.material.emissive.set(0x000000); });
            highlightedShopItemIdx = -1;
        }
        updateUI();
        showNotification(L.msgBought(L.nameCart, si.price));
        return;
    }

    spawnWorldItem(si.type, si.dropX, si.dropZ, false, 0, 0.04);
    updateUI();
    const name = si.type==='ladle' ? L.nameLadle : si.type==='handPump' ? L.nameHandPump
        : si.type==='drum' ? L.nameDrum : si.type==='enginePump' ? L.nameEnginePump : L.nameCan;
    showNotification(L.msgBought(name, si.price));
}

// ===== ポンプアクション =====
function doInstallPump() {
    const L = I18N[currentLang];
    const dp = getDropPos();
    const g = new THREE.Group();
    const pm = createHandPumpMesh();
    g.add(pm);
    g.position.set(dp.x, 0, dp.z);
    scene.add(g);

    const idx = pumpObjs.length;
    g.traverse(m => { if(m.isMesh) pumpMeshToIdx.set(m.uuid, idx); });
    pumpObjs.push({ group:g, x:dp.x, z:dp.z, attachedCan:null, canMesh:null });

    heldItem = null;
    raycastPumpIdx = -1; highlightedPumpIdx = -1;
    updateHeldMesh(); updateUI();
    showNotification(L.msgPumpInstalled);
}

function doRemovePump(pumpIdx) {
    const L = I18N[currentLang];
    const po = pumpObjs[pumpIdx];
    if (!po || po.attachedCan) return;

    po.group.traverse(m => { if(m.isMesh) pumpMeshToIdx.delete(m.uuid); });
    scene.remove(po.group);
    pumpObjs.splice(pumpIdx, 1);
    // インデックスを詰め直す
    pumpMeshToIdx.forEach((v,k) => { if(v > pumpIdx) pumpMeshToIdx.set(k, v-1); });

    heldItem = { type:'handPump', fill:0, hasOil:false };
    raycastPumpIdx = -1; highlightedPumpIdx = -1;
    updateHeldMesh(); updateUI();
    showNotification(L.msgPumpRemoved);
}

function doAttachCan(pumpIdx) {
    const L = I18N[currentLang];
    const po = pumpObjs[pumpIdx];

function doDetachCan(pumpIdx) {

    heldItem = { type:'jerryCan', fill: po.attachedCan.fill, hasOil:false };

        po.canMesh.traverse(m => { if(m.isMesh) pumpMeshToIdx.delete(m.uuid); });
        po.group.remove(po.canMesh); po.canMesh = null;
    }
    po.attachedCan = null;

    updateHeldMesh(); updateUI();
    showNotification(L.msgCanDetachedPump);
}

function doPumpOnce(pumpIdx) {
    const L = I18N[currentLang];
    const po = pumpObjs[pumpIdx];
    if (!po || !po.attachedCan) return;

    po.attachedCan.fill = Math.min(JERRY_CAN_CAP, po.attachedCan.fill + HAND_PUMP_AMOUNT);

    // 缶メッシュを更新（色変化のため再生成）
    if (po.canMesh) {
        const pos = po.canMesh.position.clone();
        const scl = po.canMesh.scale.x;
        po.canMesh.traverse(m => { if(m.isMesh) pumpMeshToIdx.delete(m.uuid); });
        po.group.remove(po.canMesh);
        po.canMesh = createJerryCanMesh(po.attachedCan.fill);
        po.canMesh.scale.setScalar(scl);
        po.canMesh.position.copy(pos);
        po.group.add(po.canMesh);
        po.canMesh.traverse(m => { if(m.isMesh) pumpMeshToIdx.set(m.uuid, pumpIdx); });
    }

    if (po.attachedCan.fill >= JERRY_CAN_CAP) {
        showNotification(L.msgCanFull);
    } else {
        showNotification(L.msgPumped(po.attachedCan.fill));
    }
}

function cartCapacityUsed() {
    if (!cartObj) return 0;
    return cartObj.slots.reduce((sum,s)=>sum+(s?(s.type==='drum'?5:1):0),0);
}

function doLoadCart() {
    if (!heldItem || !cartObj) return;
    const needed = heldItem.type==='drum' ? 5 : 1;
    if (cartCapacityUsed()+needed > 10) { showNotification(I18N[currentLang].msgCartFull); return; }
    const slotIdx = cartObj.slots.findIndex(s=>s===null);
    if (slotIdx<0) { showNotification(I18N[currentLang].msgCartFull); return; }

    const [lx,lz] = CART_SLOTS[slotIdx];
    let m;
    if (heldItem.type==='ladle') {
        m = createLadleMesh(heldItem.hasOil); m.scale.setScalar(1.5);
    } else if (heldItem.type==='drum') {
        m = createDrumMesh(heldItem.fill, heldItem.contentType); m.scale.setScalar(0.75);
    } else {
        m = createJerryCanMesh(heldItem.fill); m.scale.setScalar(1.3);
    }
    m.position.set(lx, 0.59, lz);
    m.rotation.y = (slotIdx % 2 === 0 ? -0.1 : 0.1);
    cartObj.group.add(m);
    m.traverse(child => { if(child.isMesh) cartObj.cartItemMeshMap.set(child.uuid, slotIdx); });

    cartObj.slots[slotIdx] = { type:heldItem.type, fill:heldItem.fill, hasOil:heldItem.hasOil, contentType:heldItem.contentType||null, mesh:m };

    if (heldMesh) { camera.remove(heldMesh); heldMesh=null; }
    heldItem = null;
    updateUI();
    showNotification(I18N[currentLang].msgLoadedCart);
}

    slot.mesh.traverse(child => { if(child.isMesh) cartObj.cartItemMeshMap.delete(child.uuid); });
    cartObj.slots[slotIdx] = null;

    // 手に持つ（カートは引き続き引ける状態を維持）
    heldItem = { type:slot.type, fill:slot.fill, hasOil:slot.hasOil, contentType:slot.contentType||null };
