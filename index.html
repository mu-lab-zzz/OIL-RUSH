    const L=I18N[currentLang];
    if (!heldItem||heldItem.type!=='engineNozzle') return;
    const ep=enginePumpObjs[heldItem.pumpIdx];
    if (!ep||ep.gasFuel<=0) { showNotification(L.msgOutOfGas); return; }
    if (canIdx<0||canIdx>=worldItems.length) return;
    const target=worldItems[canIdx];
    if (target.contentType==='gas') return;
    const cap=target.type==='drum'?DRUM_CAP:JERRY_CAN_CAP;
    if (target.fill>=cap) return;
    target.fill=Math.min(cap, target.fill+1); target.contentType='oil';
    ep.gasFuel=Math.max(0, ep.gasFuel - ENGINE_PUMP_GAS_RATE/ENGINE_PUMP_OIL_RATE);
    refreshWorldItemMesh(canIdx);
    updateUI();
    if (ep.gasFuel<=0) {
        showNotification(L.msgOutOfGas);
    } else {
        showNotification(L.msgNozzleFilled(target.fill, cap));
    }
}

function doFuelEnginePump(epIdx) {
    const L=I18N[currentLang];
    const ep=enginePumpObjs[epIdx];
    if (!ep) return;
    if (!heldItem||heldItem.contentType!=='gas') { showNotification(L.msgGasOnly); return; }
    const transfer=Math.min(heldItem.fill, ENGINE_PUMP_FUEL_CAP-ep.gasFuel);
    ep.gasFuel=Math.min(ENGINE_PUMP_FUEL_CAP, ep.gasFuel+transfer);
    heldItem.fill=Math.max(0, heldItem.fill-transfer);
    if (heldItem.fill<=0) heldItem.contentType=null;
    updateHeldMesh(); updateUI();
    showNotification(L.msgFueledEnginePump(ep.gasFuel));
}

function doPickup(idx) {
    if (idx<0||idx>=worldItems.length) return;
    const item=worldItems[idx];
    heldItem={type:item.type, fill:item.fill, hasOil:item.hasOil, contentType:item.contentType||null};
    removeWorldItem(idx);
    updateHeldMesh();
    updateUI();
    const L=I18N[currentLang];
    const name=item.type==='ladle'?L.nameLadle:item.type==='drum'?L.nameDrum
        :item.type==='enginePump'?L.nameEnginePump:item.type==='handPump'?L.nameHandPump
        :item.type==='pumpJack'?L.namePumpJack:item.type==='storageTank'?L.nameStorageTank
        :item.type==='refinery'?L.nameRefinery:L.nameCan;
    showNotification(L.msgPickedUp(name));
}

function doScoop() {
    heldItem.hasOil=true;
    updateHeldMesh();
    updateUI();
    showNotification(I18N[currentLang].msgScooped);
}

function doPour(canIdx) {
    if (canIdx<0||canIdx>=worldItems.length) return;
    const can=worldItems[canIdx];
    can.fill=Math.min(JERRY_CAN_CAP, can.fill+LADLE_AMOUNT);
    heldItem.hasOil=false;
    refreshWorldItemMesh(canIdx);
    updateHeldMesh();
    updateUI();
    if (can.fill>=JERRY_CAN_CAP) showNotification(I18N[currentLang].msgCanFull);
    else showNotification(I18N[currentLang].msgPoured(can.fill));
}

function doSell() {
    if (!heldItem||heldItem.fill<=0) { showNotification(I18N[currentLang].msgCanEmpty); return; }
    const earn=canPrice(heldItem.fill, heldItem.contentType);
    gameState.money+=earn;
    heldItem.fill=0;
    heldItem.contentType=null;
    updateHeldMesh();
    updateUI();
    showNotification(I18N[currentLang].msgSold(earn));
}

function doGrabCart() {
    if (!cartObj) return;
    cartObj.isHeld = true;
    updateUI();
    showNotification(I18N[currentLang].msgGrabbedCart);
}

function doReleaseCart() {
    if (!cartObj) return;
    cartObj.isHeld = false;
    updateUI();
    showNotification(I18N[currentLang].msgReleasedCart);
}

function cartCapacityUsed() {
    if (!cartObj) return 0;
    return cartObj.slots.reduce((sum,s)=>sum+(s?(s.type==='drum'?5:1):0),0);
}

function doLoadCart() {
    if (!heldItem || !cartObj) return;
    const needed = heldItem.type==='drum' ? 5 : 1;
    if (cartCapacityUsed()+needed > 10) { showNotification(I18N[currentLang].msgCartFull); return; }
    const slotIdx = cartObj.slots.findIndex(s=>s===null);
    if (slotIdx<0) { showNotification(I18N[currentLang].msgCartFull); return; }

    const [lx,lz] = CART_SLOTS[slotIdx];
    let m;
    if (heldItem.type==='ladle') {
        m = createLadleMesh(heldItem.hasOil); m.scale.setScalar(1.5);
    } else if (heldItem.type==='drum') {
        m = createDrumMesh(heldItem.fill, heldItem.contentType); m.scale.setScalar(0.75);
    } else {
        m = createJerryCanMesh(heldItem.fill); m.scale.setScalar(1.3);
    }
    m.position.set(lx, 0.59, lz);
    m.rotation.y = (slotIdx % 2 === 0 ? -0.1 : 0.1);
    cartObj.group.add(m);
    m.traverse(child => { if(child.isMesh) cartObj.cartItemMeshMap.set(child.uuid, slotIdx); });

    cartObj.slots[slotIdx] = { type:heldItem.type, fill:heldItem.fill, hasOil:heldItem.hasOil, contentType:heldItem.contentType||null, mesh:m };

    if (heldMesh) { camera.remove(heldMesh); heldMesh=null; }
    heldItem = null;
    updateUI();
    showNotification(I18N[currentLang].msgLoadedCart);
}

function doUnloadCart(slotIdx) {
    if (!cartObj || slotIdx<0 || !cartObj.slots[slotIdx]) return;
    const slot = cartObj.slots[slotIdx];

    // カートから削除
    cartObj.group.remove(slot.mesh);
    slot.mesh.traverse(child => { if(child.isMesh) cartObj.cartItemMeshMap.delete(child.uuid); });
    cartObj.slots[slotIdx] = null;

    // 手に持つ（カートは引き続き引ける状態を維持）
    heldItem = { type:slot.type, fill:slot.fill, hasOil:slot.hasOil, contentType:slot.contentType||null };
    updateHeldMesh();
    updateUI();
    showNotification(I18N[currentLang].msgUnloadedCart);
}

function doPutDown() {
    if (!heldItem) return;
    const L=I18N[currentLang];
    const {x:dx, z:dz}=getDropPos();
    const name=heldItem.type==='ladle'?L.nameLadle:heldItem.type==='drum'?L.nameDrum
        :heldItem.type==='enginePump'?L.nameEnginePump:heldItem.type==='handPump'?L.nameHandPump
        :heldItem.type==='pumpJack'?L.namePumpJack:heldItem.type==='storageTank'?L.nameStorageTank
        :heldItem.type==='pipe'?L.namePipe:heldItem.type==='junctionT'?L.nameJunctionT
        :heldItem.type==='junctionCross'?L.nameJunctionCross:L.nameCan;
    spawnWorldItem(heldItem.type, dx, dz, heldItem.hasOil, heldItem.fill, 0.04, heldItem.contentType||null);
    if (heldMesh) { camera.remove(heldMesh); heldMesh=null; }
    if (ghostMesh) { scene.remove(ghostMesh); ghostMesh = null; }
    placementRot = 0;
    heldItem=null;
    updateUI();
    showNotification(L.msgPutDown(name));
}

// ===== ゲームループ =====
let lastTime=performance.now(), autoSaveTimer=0;

function updateGame() {
    try {
        const now=performance.now();
        const delta=Math.min((now-lastTime)/1000, 0.1);
        lastTime=now;

        // ===== 移動 (運転中/徒歩) =====
        if (towVehicle && towVehicle.inVehicle) {
            // 車両操作
            let dRot = 0;
            if (joystickActive) {
                const _jdz = 0.174; // sin(10°)
                const _jx = Math.abs(joystickVector.x) < _jdz ? 0
                    : (joystickVector.x - Math.sign(joystickVector.x)*_jdz) / (1 - _jdz);
                dRot = -_jx * VEHICLE_TURN_SPEED * 0.45 * delta;
            } else {
                if (keys.a) dRot =  VEHICLE_TURN_SPEED * delta;
                if (keys.d) dRot = -VEHICLE_TURN_SPEED * delta;
            }
            if (dRot !== 0) {
                towVehicle.rot += dRot;
                gameState.cameraYaw += dRot;
            }
            let vspd=0;
            if (keys.w) vspd=VEHICLE_SPEED;
            if (keys.s) vspd=-VEHICLE_SPEED*0.5;
            if (joystickActive) vspd=-joystickVector.y*VEHICLE_SPEED;
            if (vspd!==0) {
                const nx2=towVehicle.x-Math.sin(towVehicle.rot)*vspd*delta;
                const nz2=towVehicle.z-Math.cos(towVehicle.rot)*vspd*delta;
                if (!checkCollision(nx2,nz2)) { towVehicle.x=nx2; towVehicle.z=nz2; }
            }
            towVehicle.group.position.set(towVehicle.x,0,towVehicle.z);
            towVehicle.group.rotation.y=towVehicle.rot;
            // カメラ: キャビン内FPS
            playerGroup.position.set(towVehicle.x,0,towVehicle.z);
            camera.position.set(
                towVehicle.x-Math.sin(towVehicle.rot)*0.6,
                2.2,
                towVehicle.z-Math.cos(towVehicle.rot)*0.6
            );
            // 牽引タンク追従
            if (towVehicle.hitchedTankIdx>=0) {
                const tt=towTanks[towVehicle.hitchedTankIdx];
                if (tt) {
                    tt.x=towVehicle.x+Math.sin(towVehicle.rot)*5.2;
                    tt.z=towVehicle.z+Math.cos(towVehicle.rot)*5.2;
                    tt.group.position.set(tt.x,0,tt.z);
                    tt.group.rotation.y=towVehicle.rot;
                }
            }
        } else {
            let ix=0,iz=0;
            if (keys.w) iz-=1; if (keys.s) iz+=1;
            if (keys.a) ix-=1; if (keys.d) ix+=1;
            if (joystickActive) { ix=joystickVector.x; iz=joystickVector.y; }

            const ml=Math.hypot(ix,iz);
            if (ml>0.1) {
                const spd=8.0*delta;
                const nx=ix/Math.max(1,ml), nz=iz/Math.max(1,ml);
                const sy=Math.sin(gameState.cameraYaw), cy=Math.cos(gameState.cameraYaw);
                const vx=(nx*cy+nz*sy)*spd, vz=(-nx*sy+nz*cy)*spd;
                const px2=playerGroup.position.x, pz2=playerGroup.position.z;
                if (!checkCollision(px2+vx,pz2))                      playerGroup.position.x=px2+vx;
                if (!checkCollision(playerGroup.position.x,pz2+vz))   playerGroup.position.z=pz2+vz;
            }
        }

        // ホース距離制限（エンジンノズル保持中）
        if (heldItem && heldItem.type==='engineNozzle') {
            const ep=enginePumpObjs[heldItem.pumpIdx];
            if (ep) {
                const hx=playerGroup.position.x-ep.x, hz=playerGroup.position.z-ep.z;
                const hd=Math.hypot(hx,hz);
                if (hd>ENGINE_HOSE_LENGTH) {
                    playerGroup.position.x=ep.x+hx/hd*ENGINE_HOSE_LENGTH;
                    playerGroup.position.z=ep.z+hz/hd*ENGINE_HOSE_LENGTH;
                }
            }
        }

        // ホース距離制限（ガスノズル保持中）
        if (heldItem && heldItem.type==='gasNozzle') {
            const gs=gasStationObjs[heldItem.stationIdx];
            if (gs) {
                const hx=playerGroup.position.x-gs.x, hz=playerGroup.position.z-gs.z;
                const hd=Math.hypot(hx,hz);
                if (hd>GAS_HOSE_LENGTH) {
                    playerGroup.position.x=gs.x+hx/hd*GAS_HOSE_LENGTH;
                    playerGroup.position.z=gs.z+hz/hd*GAS_HOSE_LENGTH;
                }
            }
        }

        // ホース距離制限（牽引タンク排出ノズル保持中）
        if (heldItem && heldItem.type==='towTankNozzle') {
            const tt=towTanks[heldItem.tankIdx];
            if (tt) {
                const hx=playerGroup.position.x-tt.x, hz=playerGroup.position.z-tt.z;
                const hd=Math.hypot(hx,hz);
                if (hd>TOW_TANK_DRAIN_HOSE) {
                    playerGroup.position.x=tt.x+hx/hd*TOW_TANK_DRAIN_HOSE;
                    playerGroup.position.z=tt.z+hz/hd*TOW_TANK_DRAIN_HOSE;
                }
            }
        }

        playerGroup.rotation.y=gameState.cameraYaw;
        if (!(towVehicle&&towVehicle.inVehicle)) {
            camera.position.set(playerGroup.position.x,1.45,playerGroup.position.z);
        }
        camera.rotation.y=gameState.cameraYaw;
        camera.rotation.x=gameState.cameraPitch;

        dirLight.position.set(playerGroup.position.x+30,40,playerGroup.position.z+20);
        dirLight.target.position.copy(playerGroup.position);
        dirLight.target.updateMatrixWorld();

        if (_gridHelper && gridOverlayVisible) {
            _gridHelper.position.set(
                Math.round(playerGroup.position.x),
                0.03,
                Math.round(playerGroup.position.z)
            );
        }

        // カート追従
        if (cartObj && cartObj.isHeld) {
            const sy=Math.sin(gameState.cameraYaw), cy=Math.cos(gameState.cameraYaw);
            cartObj.x = playerGroup.position.x + sy*1.8;
            cartObj.z = playerGroup.position.z + cy*1.8;
            cartObj.group.position.set(cartObj.x, 0, cartObj.z);
            cartObj.group.rotation.y = gameState.cameraYaw + Math.PI;
        }

        // レイキャスト：ワールドアイテム + カートアイテム
        raycaster.setFromCamera({x:0,y:0}, camera);
        const itemMeshes = [];
        const meshToIdx = new Map();
        worldItems.forEach((item,idx)=>{
            item.group.traverse(m=>{ if(m.isMesh){itemMeshes.push(m);meshToIdx.set(m.uuid,idx);} });
        });
        const hits = raycaster.intersectObjects(itemMeshes, false);
        raycastTargetIdx = (hits.length>0) ? (meshToIdx.get(hits[0].object.uuid)??-1) : -1;
        // 近接フォールバック（ワールドアイテム）
        if (proximitySelectEnabled && raycastTargetIdx<0 && worldItems.length>0) {
            const _px=playerGroup.position.x, _pz=playerGroup.position.z;
            let bestD=1.5*1.5, bestI=-1;
            worldItems.forEach((item,idx)=>{
                const d2=(_px-item.x)**2+(_pz-item.z)**2;
                if(d2<bestD){bestD=d2;bestI=idx;}
            });
            raycastTargetIdx=bestI;
        }

        // カートアイテムレイキャスト
        raycastCartSlotIdx = -1;
        if (cartObj && cartObj.cartItemMeshMap.size>0) {
            const cartMeshes = [];
            cartObj.group.traverse(m=>{ if(m.isMesh && cartObj.cartItemMeshMap.has(m.uuid)) cartMeshes.push(m); });
            const cartHits = raycaster.intersectObjects(cartMeshes, false);
            if (cartHits.length>0) {
                const slot = cartObj.cartItemMeshMap.get(cartHits[0].object.uuid);
                if (slot!==undefined) raycastCartSlotIdx = slot;
            }
        }

        // ショップ展示品レイキャスト（近接なし: 列選択が必要）
        raycastShopItemIdx = -1;
        if (shopDisplayItems.length > 0) {
            const shopMeshes = [];
            shopDisplayItems.forEach(si => { si.mesh.traverse(m=>{ if(m.isMesh) shopMeshes.push(m); }); });
            const shopHits = raycaster.intersectObjects(shopMeshes, false);
            if (shopHits.length > 0) {
                const idx = shopMeshToIdx.get(shopHits[0].object.uuid);
                if (idx !== undefined) raycastShopItemIdx = idx;
            }
        }

        // 設置済みポンプレイキャスト
        raycastPumpIdx = -1;
        if (pumpObjs.length > 0) {
            const pumpMeshes = [];
            pumpObjs.forEach(po => { po.group.traverse(m=>{ if(m.isMesh) pumpMeshes.push(m); }); });
            const pumpHits = raycaster.intersectObjects(pumpMeshes, false);
            if (pumpHits.length > 0) {
                const idx = pumpMeshToIdx.get(pumpHits[0].object.uuid);
                if (idx !== undefined) raycastPumpIdx = idx;
            }
            // 近接フォールバック
            if (proximitySelectEnabled && raycastPumpIdx<0) {
                const _px=playerGroup.position.x, _pz=playerGroup.position.z;
                let bestD=1.8*1.8, bestI=-1;
                pumpObjs.forEach((po,idx)=>{
                    const d2=(_px-po.x)**2+(_pz-po.z)**2;
                    if(d2<bestD){bestD=d2;bestI=idx;}
                });
                raycastPumpIdx=bestI;
            }
        }

        // エンジンポンプレイキャスト（ノズル非保持時のみ）
        raycastEnginePumpIdx = -1;
        if (enginePumpObjs.length > 0 && !(heldItem && heldItem.type==='engineNozzle')) {
            const epMeshes = [];
            enginePumpObjs.forEach(ep => { ep.group.traverse(m=>{ if(m.isMesh) epMeshes.push(m); }); });
            const epHits = raycaster.intersectObjects(epMeshes, false);
            if (epHits.length > 0) {
                const idx = enginePumpMeshToIdx.get(epHits[0].object.uuid);
                if (idx !== undefined) raycastEnginePumpIdx = idx;
            }
            // 近接フォールバック
            if (proximitySelectEnabled && raycastEnginePumpIdx<0) {
                const _px=playerGroup.position.x, _pz=playerGroup.position.z;
                let bestD=2.0*2.0, bestI=-1;
                enginePumpObjs.forEach((ep,idx)=>{
                    const d2=(_px-ep.x)**2+(_pz-ep.z)**2;
                    if(d2<bestD){bestD=d2;bestI=idx;}
                });
                raycastEnginePumpIdx=bestI;
            }
        }

        // ガソリンスタンドノズルレイキャスト（ガスノズル非保持時のみ）
        raycastGasNozzleIdx = -1;
        if (gasStationObjs.length > 0 && !(heldItem && heldItem.type==='gasNozzle')) {
            const gnMeshes = [];
            gasStationObjs.forEach(gs => { if(gs.nozzleMesh && gs.nozzleMesh.visible) gs.nozzleMesh.traverse(m=>{ if(m.isMesh) gnMeshes.push(m); }); });
            if (gnMeshes.length > 0) {
                const gnHits = raycaster.intersectObjects(gnMeshes, false);
                if (gnHits.length > 0) {
                    const idx = gasNozzleMeshToIdx.get(gnHits[0].object.uuid);
                    if (idx !== undefined) raycastGasNozzleIdx = idx;
                }
            }
            // 近接フォールバック
            if (proximitySelectEnabled && raycastGasNozzleIdx<0) {
                const _px=playerGroup.position.x, _pz=playerGroup.position.z;
                let bestD=2.0*2.0, bestI=-1;
                gasStationObjs.forEach((gs,idx)=>{
                    if(!gs.nozzleMesh||!gs.nozzleMesh.visible) return;
                    const d2=(_px-gs.x)**2+(_pz-gs.z)**2;
                    if(d2<bestD){bestD=d2;bestI=idx;}
                });
                raycastGasNozzleIdx=bestI;
            }
        }

        // 牽引タンクレイキャスト
        raycastTowTankIdx = -1;
        if (towTanks.length > 0) {
            const ttMeshes=[];
            towTanks.forEach(tt=>{ tt.group.traverse(m=>{ if(m.isMesh) ttMeshes.push(m); }); });
            const ttHits=raycaster.intersectObjects(ttMeshes,false);
            if (ttHits.length>0) {
                const idx=towTankMeshToIdx.get(ttHits[0].object.uuid);
                if (idx!==undefined) raycastTowTankIdx=idx;
            }
            // 近接フォールバック
            if (proximitySelectEnabled && raycastTowTankIdx<0) {
                const _px=playerGroup.position.x, _pz=playerGroup.position.z;
                let bestD=2.5*2.5, bestI=-1;
                towTanks.forEach((tt,idx)=>{
                    const tp=tt.group.position;
                    const d2=(_px-tp.x)**2+(_pz-tp.z)**2;
                    if(d2<bestD){bestD=d2;bestI=idx;}
                });
                raycastTowTankIdx=bestI;
            }
        }

        // 車両ロットレイキャスト（近接なし: 個別選択が必要）
        raycastVehicleLotIdx = -1;
        if (vehicleLotItems.length > 0) {
            const vlMeshes=[];
            vehicleLotItems.forEach(vi=>{ vi.mesh.traverse(m=>{ if(m.isMesh) vlMeshes.push(m); }); });
            const vlHits=raycaster.intersectObjects(vlMeshes,false);
            if (vlHits.length>0) {
                const idx=vehicleLotMeshToIdx.get(vlHits[0].object.uuid);
                if (idx!==undefined) raycastVehicleLotIdx=idx;
            }
        }

        // 採掘機レイキャスト
        raycastPumpJackIdx = -1;
        if (pumpJackObjs.length > 0) {
            const pjMeshes=[];
            pumpJackObjs.forEach(pj=>{ pj.group.traverse(m=>{ if(m.isMesh) pjMeshes.push(m); }); });
            const pjHits=raycaster.intersectObjects(pjMeshes,false);
            if (pjHits.length>0) {
                const idx=pumpJackMeshToIdx.get(pjHits[0].object.uuid);
                if (idx!==undefined) raycastPumpJackIdx=idx;
            }
            // 近接フォールバック
            if (proximitySelectEnabled && raycastPumpJackIdx<0) {
                const _px=playerGroup.position.x, _pz=playerGroup.position.z;
                let bestD=2.5*2.5, bestI=-1;
                pumpJackObjs.forEach((pj,idx)=>{
                    const d2=(_px-pj.x)**2+(_pz-pj.z)**2;
                    if(d2<bestD){bestD=d2;bestI=idx;}
                });
                raycastPumpJackIdx=bestI;
            }
        }

        // 貯蔵タンクレイキャスト
        raycastStorageTankIdx = -1;
        if (storageTankObjs.length > 0) {
            const stMeshes=[];
            storageTankObjs.forEach(st=>{ st.group.traverse(m=>{ if(m.isMesh) stMeshes.push(m); }); });
            const stHits=raycaster.intersectObjects(stMeshes,false);
            if (stHits.length>0) {
                const idx=storageTankMeshToIdx.get(stHits[0].object.uuid);
                if (idx!==undefined) raycastStorageTankIdx=idx;
            }
            // 近接フォールバック
            if (proximitySelectEnabled && raycastStorageTankIdx<0) {
                const _px=playerGroup.position.x, _pz=playerGroup.position.z;
                let bestD=3.0*3.0, bestI=-1;
                storageTankObjs.forEach((st,idx)=>{
                    const d2=(_px-st.x)**2+(_pz-st.z)**2;
                    if(d2<bestD){bestD=d2;bestI=idx;}
                });
                raycastStorageTankIdx=bestI;
            }
        }

        // 精製施設レイキャスト
        raycastRefineryIdx = -1;
        if (refineryObjs.length > 0) {
            const rfMeshes=[];
            refineryObjs.forEach(rf=>{ rf.group.traverse(m=>{ if(m.isMesh) rfMeshes.push(m); }); });
            const rfHits=raycaster.intersectObjects(rfMeshes,false);
            if (rfHits.length>0) {
                const idx=refineryMeshToIdx.get(rfHits[0].object.uuid);
                if (idx!==undefined) raycastRefineryIdx=idx;
            }
            // 近接フォールバック
            if (proximitySelectEnabled && raycastRefineryIdx<0) {
                const _px=playerGroup.position.x, _pz=playerGroup.position.z;
                let bestD=4.0*4.0, bestI=-1;
                refineryObjs.forEach((rf,idx)=>{
                    const d2=(_px-rf.x)**2+(_pz-rf.z)**2;
                    if(d2<bestD){bestD=d2;bestI=idx;}
                });
                raycastRefineryIdx=bestI;
            }
        }

        // pinnedTarget 適用（タップ/クリック選択）
        // クロスヘアが何も取らなかった種別にのみ上書き（クロスヘア優先）
        // 遠くなりすぎたらピン解除（距離8m超）
        if (pinnedTarget) {
            const _ppx=playerGroup.position.x, _ppz=playerGroup.position.z;
            const dist=Math.hypot(_ppx-pinnedTarget.x, _ppz-pinnedTarget.z);
            if (dist > 8) { pinnedTarget=null; }
            else {
                switch(pinnedTarget.type) {
                    case 'pumpJack':    if(raycastPumpJackIdx<0)    raycastPumpJackIdx   =pinnedTarget.idx; break;
                    case 'storageTank': if(raycastStorageTankIdx<0) raycastStorageTankIdx=pinnedTarget.idx; break;
                    case 'pump':        if(raycastPumpIdx<0)        raycastPumpIdx       =pinnedTarget.idx; break;
                    case 'enginePump':  if(raycastEnginePumpIdx<0)  raycastEnginePumpIdx =pinnedTarget.idx; break;
                    case 'towTank':     if(raycastTowTankIdx<0)     raycastTowTankIdx    =pinnedTarget.idx; break;
                    case 'worldItem':   if(raycastTargetIdx<0)      raycastTargetIdx     =pinnedTarget.idx; break;
                    case 'refinery':    if(raycastRefineryIdx<0)    raycastRefineryIdx   =pinnedTarget.idx; break;
                }
            }
        }

        // 採掘機アニメーション＆採油
        pumpJackObjs.forEach(pj => {
            if (pj.fuelLevel > 0) {
                pj.crankAngle = (pj.crankAngle + delta * PUMP_JACK_CRANK_SPD) % (Math.PI * 2);
                pj.crankGrp.rotation.x = pj.crankAngle;
                const beamAng = PUMP_JACK_BEAM_AMP * Math.sin(pj.crankAngle);
                pj.beamGrp.rotation.x = beamAng;
                const hhLocalY = -0.12 * Math.cos(beamAng) + 1.15 * Math.sin(beamAng);
                const hhWorldY = 3.06 + hhLocalY;
                const rodTopY = hhWorldY - 0.04;
                const rodBotY = 0.25;
                const rodLen = Math.max(0.1, rodTopY - rodBotY);
                pj.rod.position.y = rodBotY + rodLen * 0.5;
                pj.rod.scale.y = rodLen / 2.0;

                pj.fuelLevel = Math.max(0, pj.fuelLevel - PUMP_JACK_GAS_RATE * delta);
                if (pj.oilBuffer < PUMP_JACK_OIL_BUF) {
                    pj.oilBuffer = Math.min(PUMP_JACK_OIL_BUF, pj.oilBuffer + PUMP_JACK_OIL_RATE * delta);
                }
            }
        });

        currentAction=computeCurrentAction();

        // エンジンノズル連続充填（SPACE押しっぱなし・5L/秒）
        if (heldItem && heldItem.type==='engineNozzle' && keys.space) {
            if (currentAction && currentAction.type==='nozzleFill') {
                engineNozzleFillAccum += delta;
                const tickInterval = 1/ENGINE_PUMP_OIL_RATE; // 0.2秒/L
                while (engineNozzleFillAccum >= tickInterval) {
                    engineNozzleFillAccum -= tickInterval;
                    doNozzleFill(currentAction.canIdx);
                }
            } else {
                engineNozzleFillAccum = 0;
            }
        } else {
            engineNozzleFillAccum = 0;
        }

        // 牽引タンク排出ノズル連続排出（SPACE押しっぱなし・5L/秒）
        if (heldItem && heldItem.type==='towTankNozzle' && keys.space) {
            const drainType = currentAction && (currentAction.type==='towTankDrainStorage'||currentAction.type==='towTankDrainPumpJack'||currentAction.type==='towTankDrainCan');
            if (drainType) {
                towTankDrainAccum += delta;
                const tickInterval = 1/TOW_TANK_DRAIN_RATE;
                while (towTankDrainAccum >= tickInterval) {
                    towTankDrainAccum -= tickInterval;
                    if (currentAction.type==='towTankDrainStorage') doTowTankDrainStorage(currentAction.stIdx);
                    else if (currentAction.type==='towTankDrainPumpJack') doTowTankDrainPumpJack(currentAction.pjIdx);
                    else if (currentAction.type==='towTankDrainCan') doTowTankDrainCan(currentAction.canIdx);
                }
            } else {
                towTankDrainAccum = 0;
            }
        } else {
            towTankDrainAccum = 0;
        }

        const prompt=document.getElementById('interaction-prompt');
        const crosshairEl=document.getElementById('crosshair');
        if (currentAction) { prompt.style.display='block'; prompt.innerText=currentAction.label; }
        else { prompt.style.display='none'; }

        // クロスヘア色：アクションあり→緑、なし→白
        const hasAction = !!(currentAction && currentAction.type!=='putDown');
        crosshairEl.classList.toggle('active', hasAction);

        // ワールドアイテムハイライト
        const newHighlightIdx = raycastTargetIdx;
        if (newHighlightIdx !== highlightedItemIdx) {
            if (highlightedItemIdx>=0 && highlightedItemIdx<worldItems.length) {
                worldItems[highlightedItemIdx].group.traverse(m=>{
                    if (m.isMesh&&m.material&&m.material.emissive) m.material.emissive.set(0x000000);
                });
            }
            highlightedItemIdx = newHighlightIdx;
        }
        if (highlightedItemIdx>=0 && highlightedItemIdx<worldItems.length) {
            const blink = 0.4 + 0.4*Math.abs(Math.sin(now*0.005));
            // アクション有効なら緑、照準のみなら薄い白
            const actionable = currentAction && (currentAction.type==='pickup'||currentAction.type==='pour');
            const r = actionable ? 0.05*blink : 0.3*blink;
            const g = actionable ? 0.9*blink  : 0.3*blink;
            const b = actionable ? 0.1*blink  : 0.3*blink;
            worldItems[highlightedItemIdx].group.traverse(m=>{
                if (m.isMesh&&m.material&&m.material.emissive) m.material.emissive.set(new THREE.Color(r,g,b));
            });
        }

        // カートアイテムハイライト
        const newCartHighlight = raycastCartSlotIdx;
        if (newCartHighlight !== highlightedCartSlotIdx) {
            if (highlightedCartSlotIdx>=0 && cartObj && cartObj.slots[highlightedCartSlotIdx]) {
                cartObj.slots[highlightedCartSlotIdx].mesh.traverse(m=>{
                    if(m.isMesh&&m.material&&m.material.emissive) m.material.emissive.set(0x000000);
                });
            }
            highlightedCartSlotIdx = newCartHighlight;
        }
        if (highlightedCartSlotIdx>=0 && cartObj && cartObj.slots[highlightedCartSlotIdx]) {
            const blink2 = 0.45+0.45*Math.abs(Math.sin(now*0.005));
            cartObj.slots[highlightedCartSlotIdx].mesh.traverse(m=>{
                if(m.isMesh&&m.material&&m.material.emissive)
                    m.material.emissive.set(new THREE.Color(0.05*blink2,0.9*blink2,0.1*blink2));
            });
        }

        // ショップ展示品ハイライト（金色点滅）
        const newShopHighlight = raycastShopItemIdx;
        if (newShopHighlight !== highlightedShopItemIdx) {
            if (highlightedShopItemIdx>=0 && shopDisplayItems[highlightedShopItemIdx]) {
                shopDisplayItems[highlightedShopItemIdx].mesh.traverse(m=>{
                    if(m.isMesh&&m.material&&m.material.emissive) m.material.emissive.set(0x000000);
                });
            }
            highlightedShopItemIdx = newShopHighlight;
        }
        if (highlightedShopItemIdx>=0 && shopDisplayItems[highlightedShopItemIdx]) {
            const blink3 = 0.45+0.45*Math.abs(Math.sin(now*0.005));
            shopDisplayItems[highlightedShopItemIdx].mesh.traverse(m=>{
                if(m.isMesh&&m.material&&m.material.emissive)
                    m.material.emissive.set(new THREE.Color(0.9*blink3, 0.6*blink3, 0.0));
            });
        }

        // 設置済みポンプハイライト（シアン点滅）
        const newPumpHighlight = raycastPumpIdx;
        if (newPumpHighlight !== highlightedPumpIdx) {
            if (highlightedPumpIdx>=0 && pumpObjs[highlightedPumpIdx]) {
                pumpObjs[highlightedPumpIdx].group.traverse(m=>{
                    if(m.isMesh&&m.material&&m.material.emissive) m.material.emissive.set(0x000000);
                });
            }
            highlightedPumpIdx = newPumpHighlight;
        }
        if (highlightedPumpIdx>=0 && pumpObjs[highlightedPumpIdx]) {
            const blink4 = 0.4+0.4*Math.abs(Math.sin(now*0.005));
            pumpObjs[highlightedPumpIdx].group.traverse(m=>{
                if(m.isMesh&&m.material&&m.material.emissive)
                    m.material.emissive.set(new THREE.Color(0.0, 0.7*blink4, 0.9*blink4));
            });
        }

        // エンジンポンプハイライト（オレンジ点滅）
        const newEpHighlight = raycastEnginePumpIdx;
        if (newEpHighlight !== highlightedEnginePumpIdx) {
            if (highlightedEnginePumpIdx>=0 && enginePumpObjs[highlightedEnginePumpIdx]) {
                enginePumpObjs[highlightedEnginePumpIdx].group.traverse(m=>{
                    if(m.isMesh&&m.material&&m.material.emissive) m.material.emissive.set(0x000000);
                });
            }
            highlightedEnginePumpIdx = newEpHighlight;
        }
        if (highlightedEnginePumpIdx>=0 && enginePumpObjs[highlightedEnginePumpIdx]) {
            const blinkE = 0.4+0.4*Math.abs(Math.sin(now*0.005));
            enginePumpObjs[highlightedEnginePumpIdx].group.traverse(m=>{
                if(m.isMesh&&m.material&&m.material.emissive)
                    m.material.emissive.set(new THREE.Color(0.9*blinkE, 0.4*blinkE, 0.0));
            });
        }

        // ガスノズルハイライト（黄色点滅）
        const newGnHighlight = raycastGasNozzleIdx;
        if (newGnHighlight !== highlightedGasNozzleIdx) {
            if (highlightedGasNozzleIdx>=0 && gasStationObjs[highlightedGasNozzleIdx]?.nozzleMesh) {
                gasStationObjs[highlightedGasNozzleIdx].nozzleMesh.traverse(m=>{
                    if(m.isMesh&&m.material&&m.material.emissive) m.material.emissive.set(0x000000);
                });
            }
            highlightedGasNozzleIdx = newGnHighlight;
        }
        if (highlightedGasNozzleIdx>=0 && gasStationObjs[highlightedGasNozzleIdx]?.nozzleMesh) {
            const blinkG = 0.4+0.4*Math.abs(Math.sin(now*0.005));
            gasStationObjs[highlightedGasNozzleIdx].nozzleMesh.traverse(m=>{
                if(m.isMesh&&m.material&&m.material.emissive)
                    m.material.emissive.set(new THREE.Color(0.9*blinkG, 0.8*blinkG, 0.0));
            });
        }

        // 牽引タンクハイライト（緑点滅）
        const newTTHighlight=raycastTowTankIdx;
        if (newTTHighlight!==highlightedTowTankIdx) {
            if (highlightedTowTankIdx>=0&&towTanks[highlightedTowTankIdx])
                towTanks[highlightedTowTankIdx].group.traverse(m=>{ if(m.isMesh&&m.material&&m.material.emissive) m.material.emissive.set(0x000000); });
            highlightedTowTankIdx=newTTHighlight;
        }
        if (highlightedTowTankIdx>=0&&towTanks[highlightedTowTankIdx]) {
            const blinkTT=0.4+0.4*Math.abs(Math.sin(now*0.005));
            towTanks[highlightedTowTankIdx].group.traverse(m=>{ if(m.isMesh&&m.material&&m.material.emissive) m.material.emissive.set(new THREE.Color(0,0.8*blinkTT,0.2*blinkTT)); });
        }

        // 車両ロットハイライト（金色点滅）
        const newVLHighlight=raycastVehicleLotIdx;
        if (newVLHighlight!==highlightedVehicleLotIdx) {
            if (highlightedVehicleLotIdx>=0&&vehicleLotItems[highlightedVehicleLotIdx])
                vehicleLotItems[highlightedVehicleLotIdx].mesh.traverse(m=>{ if(m.isMesh&&m.material&&m.material.emissive) m.material.emissive.set(0x000000); });
            highlightedVehicleLotIdx=newVLHighlight;
        }
        if (highlightedVehicleLotIdx>=0&&vehicleLotItems[highlightedVehicleLotIdx]) {
            const blinkVL=0.45+0.45*Math.abs(Math.sin(now*0.005));
            vehicleLotItems[highlightedVehicleLotIdx].mesh.traverse(m=>{ if(m.isMesh&&m.material&&m.material.emissive) m.material.emissive.set(new THREE.Color(0.9*blinkVL,0.6*blinkVL,0)); });
        }

        // 採掘機ハイライト（紫点滅）
        const newPJHighlight=raycastPumpJackIdx;
        if (newPJHighlight!==highlightedPumpJackIdx) {
            if (highlightedPumpJackIdx>=0&&pumpJackObjs[highlightedPumpJackIdx])
                pumpJackObjs[highlightedPumpJackIdx].group.traverse(m=>{ if(m.isMesh&&m.material&&m.material.emissive) m.material.emissive.set(0x000000); });
            highlightedPumpJackIdx=newPJHighlight;
        }
        if (highlightedPumpJackIdx>=0&&pumpJackObjs[highlightedPumpJackIdx]) {
            const blinkPJ=0.4+0.4*Math.abs(Math.sin(now*0.005));
            pumpJackObjs[highlightedPumpJackIdx].group.traverse(m=>{ if(m.isMesh&&m.material&&m.material.emissive) m.material.emissive.set(new THREE.Color(0.6*blinkPJ,0,0.9*blinkPJ)); });
        }

        // 貯蔵タンクハイライト（水色点滅）
        const newSTHighlight=raycastStorageTankIdx;
        if (newSTHighlight!==highlightedStorageTankIdx) {
            if (highlightedStorageTankIdx>=0&&storageTankObjs[highlightedStorageTankIdx])
                storageTankObjs[highlightedStorageTankIdx].group.traverse(m=>{ if(m.isMesh&&m.material&&m.material.emissive) m.material.emissive.set(0x000000); });
            highlightedStorageTankIdx=newSTHighlight;
        }
        if (highlightedStorageTankIdx>=0&&storageTankObjs[highlightedStorageTankIdx]) {
            const blinkST=0.4+0.4*Math.abs(Math.sin(now*0.005));
            storageTankObjs[highlightedStorageTankIdx].group.traverse(m=>{ if(m.isMesh&&m.material&&m.material.emissive) m.material.emissive.set(new THREE.Color(0,0.7*blinkST,0.9*blinkST)); });
        }

        autoSaveTimer+=delta;
        if (autoSaveTimer>=10) { autoSaveTimer=0; saveGame(true); }

        // グリッド設置プレビュー更新
        updateGhostMesh();
        updatePipeGhostMesh();

        // パイプライン流体転送
        simulatePipeFlow(delta);
        simulateRefinery(delta);

        // スカイドームをカメラ位置に追従（端が見えないよう）
        if (skyDome) skyDome.position.copy(camera.position);
        // 雲をゆっくり流す
        clouds.forEach(c => {
            c.position.x += delta * 0.4;
            if (c.position.x > 200) c.position.x -= 420;
        });

        renderer.render(scene,camera);
    } catch(err) { console.error('Loop error:',err); }
    requestAnimationFrame(updateGame);
}

// ===== UI =====
function updateUI() {
    const L=I18N[currentLang];
    document.getElementById('ui-money').innerText=L.money+gameState.money;
    let heldText=L.heldNone;
    if (heldItem) {
        if (heldItem.type==='ladle') heldText=L.heldLadle(heldItem.hasOil);
        else if (heldItem.type==='handPump') heldText=(currentLang==='ja'?'手持ち: ':'Holding: ')+L.nameHandPump;
        else if (heldItem.type==='enginePump') heldText=(currentLang==='ja'?'手持ち: ':'Holding: ')+L.nameEnginePump;
        else if (heldItem.type==='drum') heldText=L.heldDrum(heldItem.fill, heldItem.contentType);
        else if (heldItem.type==='engineNozzle') {
            const ep=enginePumpObjs[heldItem.pumpIdx];
            heldText=L.heldNozzle(ep?ep.gasFuel:0);
        }
        else if (heldItem.type==='gasNozzle') heldText=L.heldGasNozzle;
        else if (heldItem.type==='towTankNozzle') {
            const tt=towTanks[heldItem.tankIdx];
            const ct=tt?tt.contentType:null;
            const f=tt?tt.fill:0;
            heldText=(currentLang==='ja'?`手持ち: 排出ノズル (${ct==='gas'?'ガス':'原油'} ${f}L)`:`Holding: drain nozzle (${ct==='gas'?'gas':'oil'} ${f}L)`);
        }
        else if (heldItem.type==='pumpJack')      heldText=(currentLang==='ja'?'手持ち: ':'Holding: ')+L.namePumpJack;
        else if (heldItem.type==='storageTank')   heldText=(currentLang==='ja'?'手持ち: ':'Holding: ')+L.nameStorageTank;
        else if (heldItem.type==='pipe')          heldText=(currentLang==='ja'?'手持ち: ':'Holding: ')+L.namePipe;
        else if (heldItem.type==='junctionT')     heldText=(currentLang==='ja'?'手持ち: ':'Holding: ')+L.nameJunctionT;
        else if (heldItem.type==='junctionCross') heldText=(currentLang==='ja'?'手持ち: ':'Holding: ')+L.nameJunctionCross;
        else if (heldItem.type==='refinery')      heldText=(currentLang==='ja'?'手持ち: ':'Holding: ')+L.nameRefinery;
        else heldText=L.heldCan(heldItem.fill, heldItem.contentType);
    }
    if (towVehicle && towVehicle.inVehicle) {
        const ht=towVehicle.hitchedTankIdx>=0?towTanks[towVehicle.hitchedTankIdx]:null;
        heldText=L.heldVehicle(ht?ht.fill:0, ht?ht.capacity:0);
    }
    if (cartObj && cartObj.isHeld) {
        heldText += ' / ' + L.heldCart(cartCapacityUsed());
    }
    document.getElementById('ui-held').innerText=heldText;
    document.getElementById('ui-hint').innerText=L.hintText;
    document.getElementById('btn-lang').innerText=currentLang==='ja'?'English':'日本語';
    const rotBtn=document.getElementById('rotate-button');
    if (rotBtn) rotBtn.style.display=(heldItem&&GRID_SNAP_TYPES.includes(heldItem.type))?'flex':'none';
}

// ===== セーブ/ロード =====
function saveGame(isAuto=false) {
    gameState.playerPos.x=playerGroup.position.x;
    gameState.playerPos.z=playerGroup.position.z;
    gameState.savedWorldItems=worldItems.map(i=>({type:i.type,x:i.x,z:i.z,fill:i.fill,hasOil:i.hasOil,contentType:i.contentType||null}));
    gameState.savedHeldItem=heldItem?{...heldItem}:null;
    gameState.savedPumps=pumpObjs.map(po=>({x:po.x,z:po.z,attachedCan:po.attachedCan?{...po.attachedCan}:null}));
    gameState.savedEnginePumps=enginePumpObjs.map(ep=>({x:ep.x,z:ep.z,gasFuel:ep.gasFuel}));
    gameState.savedCartSlots=cartObj?cartObj.slots.map(s=>s?{type:s.type,fill:s.fill,hasOil:s.hasOil,contentType:s.contentType||null}:null):[];
    gameState.savedCartPos=cartObj?{x:cartObj.x,z:cartObj.z}:null;
    gameState.savedTowVehicle=towVehiclePurchased&&towVehicle?{x:towVehicle.x,z:towVehicle.z,rot:towVehicle.rot,hitchedTankIdx:towVehicle.hitchedTankIdx}:null;
    gameState.savedTowTanks=towTanks.map(tt=>({x:tt.x,z:tt.z,capacity:tt.capacity,fill:tt.fill,contentType:tt.contentType}));
    gameState.savedPumpJacks=pumpJackObjs.map(pj=>({x:pj.x,z:pj.z,fuelLevel:pj.fuelLevel,oilBuffer:pj.oilBuffer,nearSpringIdx:pj.nearSpringIdx,rot:pj.rot||0}));
    gameState.savedStorageTanks=storageTankObjs.map(st=>({x:st.x,z:st.z,level:st.level,liquidType:st.liquidType||null,rot:st.rot||0}));
    gameState.savedRefineries=refineryObjs.map(rf=>({x:rf.x,z:rf.z,rot:rf.rot||0,enabled:rf.enabled,products:{...rf.products},oilBuf:rf.oilBuf,fuelBuf:rf.fuelBuf}));
    gameState.savedPipes=[...pipeEdges.entries()].map(([ek,v])=>{
        const parts=ek.split(':');
        const [gx1,gz1]=parts[0].split(',').map(Number);
        const [gx2,gz2]=parts[1].split(',').map(Number);
        return {gx1,gz1,gx2,gz2,liquidType:v.liquidType};
    });
    gameState.savedJunctions=[...junctionNodes.entries()].map(([nk,v])=>{
        const {gx,gz}=parseNodeKey(nk);
        return {gx,gz,type:v.type,rot:v.rot};
    });
    localStorage.setItem('oil_rush_save',JSON.stringify(gameState));
    showNotification(isAuto?I18N[currentLang].msgAutoSaved:I18N[currentLang].msgDataSaved);
}

function loadGame() {
    const data=localStorage.getItem('oil_rush_save');
    if (!data) return;
    try {
        const saved=JSON.parse(data);
        if (typeof saved.money!=='number') throw new Error('bad');
        // 旧データ移行
        if (saved.barrels!==undefined) { delete saved.barrels; delete saved.maxBarrels; }
        if (saved.emptyCans!==undefined) { delete saved.emptyCans; delete saved.filledCans; delete saved.savedCans; }
        if (!saved.playerPos) saved.playerPos={x:-35,z:0};
        if (saved.cameraYaw===undefined) saved.cameraYaw=0;
        if (saved.cameraPitch===undefined) saved.cameraPitch=0;
        if (saved.hasCart===undefined) saved.hasCart=false;
        Object.assign(gameState,saved);

        if (playerGroup) playerGroup.position.set(gameState.playerPos.x,0,gameState.playerPos.z);

        // カートリセット & 購入状態復元
        if (cartObj) {
            cartObj.slots.forEach((s,i)=>{
                if (s) { cartObj.group.remove(s.mesh); cartObj.slots[i]=null; }
            });
            cartObj.cartItemMeshMap.clear();
            cartObj.isHeld = false;
            if (gameState.hasCart) {
                cartObj.purchased = true;
                cartObj.group.traverse(m => { if(m.isMesh) shopMeshToIdx.delete(m.uuid); });
                // カート位置復元
                if (gameState.savedCartPos) {
                    cartObj.x=gameState.savedCartPos.x; cartObj.z=gameState.savedCartPos.z;
                    cartObj.group.position.set(cartObj.x,0,cartObj.z);
                }
                // カートスロット復元
                (gameState.savedCartSlots||[]).forEach((s,i)=>{
                    if (!s) return;
                    const [lx,lz]=CART_SLOTS[i];
                    let m;
                    if (s.type==='ladle') { m=createLadleMesh(s.hasOil); m.scale.setScalar(1.5); }
                    else if (s.type==='drum') { m=createDrumMesh(s.fill,s.contentType||null); m.scale.setScalar(0.75); }
                    else { m=createJerryCanMesh(s.fill); m.scale.setScalar(1.3); }
                    m.position.set(lx,0.59,lz); m.rotation.y=(i%2===0?-0.1:0.1);
                    cartObj.group.add(m);
                    m.traverse(c=>{if(c.isMesh)cartObj.cartItemMeshMap.set(c.uuid,i);});
                    cartObj.slots[i]={type:s.type,fill:s.fill,hasOil:s.hasOil,contentType:s.contentType||null,mesh:m};
                });
            } else {
                cartObj.purchased = false;
                // createHandcart()で登録済み — 再登録は不要
            }
        }

        // ワールドアイテム再構築
        clearWorldItems();
        const items=gameState.savedWorldItems||getDefaultWorldItems();
        items.forEach(i=>spawnWorldItem(i.type,i.x,i.z,i.hasOil||false,i.fill||0,0.04,i.contentType||null));

        // ポンプ再構築
        clearPumpObjs();
        (gameState.savedPumps||[]).forEach(p=>restorePump(p.x,p.z,p.attachedCan));

        // エンジンポンプ再構築
        clearEnginePumpObjs();
        (gameState.savedEnginePumps||[]).forEach(ep=>restoreEnginePump(ep.x,ep.z,ep.gasFuel));

        // タンクトラック復元
        clearTowVehicleObjs();
        if (gameState.savedTowVehicle) {
            const sv=gameState.savedTowVehicle;
            const g=createTowVehicleMesh();
            g.position.set(sv.x,0,sv.z); g.rotation.y=sv.rot;
            scene.add(g);
            towVehicle={group:g,x:sv.x,z:sv.z,rot:sv.rot,inVehicle:false,hitchedTankIdx:sv.hitchedTankIdx};
            g.traverse(m=>{ if(m.isMesh) towVehicleMeshUUIDs.add(m.uuid); });
            towVehiclePurchased=true;
        }
        // 牽引タンク復元
        while(towTanks.length>0){const tt=towTanks.pop();scene.remove(tt.group);}
        towTankMeshToIdx.clear();
        (gameState.savedTowTanks||[]).forEach((tt,i)=>{
            const g=createTowTankMesh(tt.capacity,tt.fill,tt.contentType);
            g.position.set(tt.x,0,tt.z); scene.add(g);
            g.traverse(m=>{ if(m.isMesh) towTankMeshToIdx.set(m.uuid,i); });
            towTanks.push({group:g,x:tt.x,z:tt.z,capacity:tt.capacity,fill:tt.fill,contentType:tt.contentType});
        });

        // 施設ポートを先にクリア（再登録時の重複防止）
        clearFacilityPorts();

        // 採掘機復元
        clearPumpJackObjs();
        (gameState.savedPumpJacks||[]).forEach(pj=>restorePumpJack(pj.x,pj.z,pj.fuelLevel||0,pj.oilBuffer||0,pj.nearSpringIdx||0,pj.rot||0));

        // 貯蔵タンク復元
        clearStorageTankObjs();
        (gameState.savedStorageTanks||[]).forEach(st=>restoreStorageTank(st.x,st.z,st.level||0,st.rot||0,st.liquidType||null));

        // 精製施設復元
        clearRefineryObjs();
        (gameState.savedRefineries||[]).forEach(rf=>restoreRefinery(rf.x,rf.z,rf.rot||0,rf.enabled!==false,rf.products||{},rf.oilBuf||0,rf.fuelBuf||0));

        // パイプ・ジャンクション復元
        clearPipeObjs();
        (gameState.savedPipes||[]).forEach(p=>restorePipe(p.gx1,p.gz1,p.gx2,p.gz2,p.liquidType||null));
        (gameState.savedJunctions||[]).forEach(j=>restoreJunction(j.gx,j.gz,j.type,j.rot||0));
        // ノードジョイントを全更新（パイプ・ジャンクション復元後）
        pipeNodeConns.forEach((_,nk)=>{ const {gx,gz}=parseNodeKey(nk); updateNodeJoint(gx,gz); });

        // 手持ち復元
        heldItem=gameState.savedHeldItem?{...gameState.savedHeldItem}:null;
        updateHeldMesh();
        updateUI();
        showNotification(I18N[currentLang].msgDataLoaded);
    } catch(e) { console.error(e); }
}

function clearTowVehicleObjs() {
    if (towVehicle) { scene.remove(towVehicle.group); towVehicle=null; }
    towVehiclePurchased=false; towVehicleMeshUUIDs.clear();
}

function clearWorldItems() {
    while (worldItems.length>0) { scene.remove(worldItems[0].group); worldItems.splice(0,1); }
}

function clearPumpObjs() {
    while (pumpObjs.length>0) { scene.remove(pumpObjs[0].group); pumpObjs.splice(0,1); }
    pumpMeshToIdx.clear();
    raycastPumpIdx=-1; highlightedPumpIdx=-1;
}

function restorePump(x, z, attachedCan) {
    const g = new THREE.Group();
    g.add(createHandPumpMesh());
    g.position.set(x, 0, z);
    scene.add(g);
    const idx = pumpObjs.length;
    g.traverse(m => { if(m.isMesh) pumpMeshToIdx.set(m.uuid, idx); });
    const po = { group:g, x, z, attachedCan:attachedCan?{...attachedCan}:null, canMesh:null };
    if (po.attachedCan) {
        const cm = createJerryCanMesh(po.attachedCan.fill);
        cm.scale.setScalar(1.0); cm.position.set(0.42,0,0.08);
        g.add(cm); po.canMesh = cm;
        cm.traverse(m => { if(m.isMesh) pumpMeshToIdx.set(m.uuid, idx); });
    }
    pumpObjs.push(po);
}

function clearEnginePumpObjs() {
    while (enginePumpObjs.length>0) { scene.remove(enginePumpObjs[0].group); enginePumpObjs.splice(0,1); }
    enginePumpMeshToIdx.clear();
    raycastEnginePumpIdx=-1; highlightedEnginePumpIdx=-1;
}

function restoreEnginePump(x, z, gasFuel) {
    const g=new THREE.Group();
    g.add(createEnginePumpMesh());
    g.position.set(x,0,z);
    scene.add(g);
    const idx=enginePumpObjs.length;
    g.traverse(m=>{ if(m.isMesh) enginePumpMeshToIdx.set(m.uuid,idx); });
    enginePumpObjs.push({group:g, x, z, gasFuel:gasFuel||0});
}

function clearPumpJackObjs() {
    while(pumpJackObjs.length>0){ scene.remove(pumpJackObjs[0].group); pumpJackObjs.splice(0,1); }
    pumpJackMeshToIdx.clear();
    raycastPumpJackIdx=-1; highlightedPumpJackIdx=-1;
}

function restorePumpJack(x, z, fuelLevel, oilBuffer, nearSpringIdx, rot=0) {
    const pjMesh = createPumpJackMesh();
    const g = pjMesh.group;
    g.position.set(x, 0, z);
    g.rotation.y = rot;
    scene.add(g);
    const idx = pumpJackObjs.length;
    g.traverse(m=>{ if(m.isMesh) pumpJackMeshToIdx.set(m.uuid, idx); });
    pumpJackObjs.push({ group:g, crankGrp:pjMesh.crankGrp, beamGrp:pjMesh.beamGrp, rod:pjMesh.rod,
        x, z, fuelLevel, oilBuffer, crankAngle:0, nearSpringIdx, rot });
    const {gx,gz}=worldToGrid(x,z);
    const spring=findOilSpringAtGrid(gx,gz);
    if (spring) spring.pumpJackIdx=idx;
    registerFacilityPorts('pumpJack', idx, gx, gz, rot);
}

function clearStorageTankObjs() {
    while(storageTankObjs.length>0){ scene.remove(storageTankObjs[0].group); storageTankObjs.splice(0,1); }
    storageTankMeshToIdx.clear();
    raycastStorageTankIdx=-1; highlightedStorageTankIdx=-1;
}

function clearRefineryObjs() {
    while(refineryObjs.length>0){ scene.remove(refineryObjs[0].group); refineryObjs.splice(0,1); }
    refineryMeshToIdx.clear();
    raycastRefineryIdx=-1; highlightedRefineryIdx=-1;
}

function restoreRefinery(x, z, rot, enabled, products, oilBuf, fuelBuf) {
    const result = createRefineryMesh();
    const g = result.group;
    g.position.set(x, 0, z);
    g.rotation.y = rot;
    scene.add(g);
    const idx = refineryObjs.length;
    g.traverse(m=>{ if(m.isMesh) refineryMeshToIdx.set(m.uuid, idx); });
    const defaultProducts = {gas:0,diesel:0,kerosene:0,naphtha:0,lpg:0,heavyoil:0};
    const mergedProducts = Object.assign(defaultProducts, products||{});
    refineryObjs.push({ group:g, x, z, rot, enabled:enabled!==false,
        products:mergedProducts, oilBuf:oilBuf||0, fuelBuf:fuelBuf||0,
        switchMat:result.switchMat, blocked:false });
    const {gx,gz}=worldToGrid(x, z);
    registerFacilityPorts('refinery', idx, gx, gz, rot);
}

function restoreStorageTank(x, z, level, rot=0, liquidType=null) {
    const g = createStorageTankMesh();
    g.position.set(x, 0, z);
    g.rotation.y = rot;
    scene.add(g);
    const idx = storageTankObjs.length;
    g.traverse(m=>{ if(m.isMesh) storageTankMeshToIdx.set(m.uuid, idx); });
    storageTankObjs.push({ group:g, x, z, level, liquidType: liquidType||null, rot });
    const {gx,gz}=worldToGrid(x,z);
    registerFacilityPorts('storageTank', idx, gx, gz, rot);
}

function clearPipeObjs() {
    pipeEdges.forEach(e=>scene.remove(e.mesh));
    pipeEdges.clear();
    junctionNodes.forEach(e=>scene.remove(e.mesh));
    junctionNodes.clear();
    nodeJointMeshes.forEach(m=>scene.remove(m));
    nodeJointMeshes.clear();
    pipeNodeConns.clear();
}

function restorePipe(gx1, gz1, gx2, gz2, liquidType) {
    const axis=gx1!==gx2?'x':'z';
    const x=(gx1+gx2)/2*GRID_SNAP, z=(gz1+gz2)/2*GRID_SNAP;
    const seg=createPipeSegmentMesh(axis);
    seg.position.set(x,0.5,z);
    scene.add(seg);
    pipeEdges.set(edgeKey(gx1,gz1,gx2,gz2),{liquidType,mesh:seg});
    const nk1=nodeKey(gx1,gz1),nk2=nodeKey(gx2,gz2);
    if (!pipeNodeConns.has(nk1)) pipeNodeConns.set(nk1,new Set());
    if (!pipeNodeConns.has(nk2)) pipeNodeConns.set(nk2,new Set());
    pipeNodeConns.get(nk1).add(nk2);
    pipeNodeConns.get(nk2).add(nk1);
}

function restoreJunction(gx, gz, type, rot) {
    const wp=gridToWorld(gx,gz);
    const m=type==='T'?createTJunctionMesh():createCrossJunctionMesh();
    m.position.set(wp.x,0,wp.z); m.rotation.y=rot;
    scene.add(m);
    const nk=nodeKey(gx,gz);
    junctionNodes.set(nk,{type,rot,mesh:m});
    if (nodeJointMeshes.has(nk)) { scene.remove(nodeJointMeshes.get(nk)); nodeJointMeshes.delete(nk); }
}

function getDefaultWorldItems() {
    return []; // 道具は道具屋で購入
}

function initWorldItemsDefault() {
    clearWorldItems();
    getDefaultWorldItems().forEach(i=>spawnWorldItem(i.type,i.x,i.z,i.hasOil,i.fill,0.88));
}

function openDataModal() {
    document.getElementById('data-modal').style.display='flex';
    document.getElementById('modal-title').innerText=I18N[currentLang].modalTitle;
    document.getElementById('data-textarea').value='';
}
function closeDataModal() { document.getElementById('data-modal').style.display='none'; }

function exportData() {
    gameState.playerPos.x=playerGroup.position.x;
    gameState.playerPos.z=playerGroup.position.z;
    gameState.savedWorldItems=worldItems.map(i=>({type:i.type,x:i.x,z:i.z,fill:i.fill,hasOil:i.hasOil}));
    gameState.savedHeldItem=heldItem?{...heldItem}:null;
    document.getElementById('data-textarea').value=btoa(JSON.stringify(gameState));
}

function importData() {
    const text=document.getElementById('data-textarea').value.trim();
    try {
        const json=JSON.parse(atob(text));
        if (typeof json.money!=='number') throw new Error();
        Object.assign(gameState,json);
        if (!gameState.playerPos) gameState.playerPos={x:-35,z:0};
        if (gameState.hasCart===undefined) gameState.hasCart=false;
        playerGroup.position.set(gameState.playerPos.x,0,gameState.playerPos.z);
        clearWorldItems();
        const items=gameState.savedWorldItems||getDefaultWorldItems();
        items.forEach(i=>spawnWorldItem(i.type,i.x,i.z,i.hasOil||false,i.fill||0,0.04,i.contentType||null));
        clearPumpObjs();
        (gameState.savedPumps||[]).forEach(p=>restorePump(p.x,p.z,p.attachedCan));
        clearEnginePumpObjs();
        (gameState.savedEnginePumps||[]).forEach(ep=>restoreEnginePump(ep.x,ep.z,ep.gasFuel));
        if (cartObj) {
            cartObj.slots.forEach((s,i)=>{ if(s){cartObj.group.remove(s.mesh);cartObj.slots[i]=null;} });
            cartObj.cartItemMeshMap.clear(); cartObj.isHeld=false;
            if (gameState.hasCart) {
                cartObj.purchased=true;
                cartObj.group.traverse(m=>{if(m.isMesh)shopMeshToIdx.delete(m.uuid);});
                if (gameState.savedCartPos) {
                    cartObj.x=gameState.savedCartPos.x; cartObj.z=gameState.savedCartPos.z;
                    cartObj.group.position.set(cartObj.x,0,cartObj.z);
                }
                (gameState.savedCartSlots||[]).forEach((s,i)=>{
                    if (!s) return;
                    const [lx,lz]=CART_SLOTS[i];
                    let m;
                    if (s.type==='ladle') { m=createLadleMesh(s.hasOil); m.scale.setScalar(1.5); }
                    else if (s.type==='drum') { m=createDrumMesh(s.fill,s.contentType||null); m.scale.setScalar(0.75); }
                    else { m=createJerryCanMesh(s.fill); m.scale.setScalar(1.3); }
                    m.position.set(lx,0.59,lz); m.rotation.y=(i%2===0?-0.1:0.1);
                    cartObj.group.add(m);
                    m.traverse(c=>{if(c.isMesh)cartObj.cartItemMeshMap.set(c.uuid,i);});
                    cartObj.slots[i]={type:s.type,fill:s.fill,hasOil:s.hasOil,contentType:s.contentType||null,mesh:m};
                });
            } else { cartObj.purchased=false; }
        }
        heldItem=gameState.savedHeldItem?{...gameState.savedHeldItem}:null;
        updateHeldMesh(); updateUI(); saveGame(); closeDataModal();
        showNotification(I18N[currentLang].msgImportOk);
    } catch(e) { alert(I18N[currentLang].msgImportFail); }
}

// ===== 岩アセットのプリロード =====
function preloadRock(callback) {
    const loader = new THREE.OBJLoader();
    loader.load('Rock1.obj', function(obj) {
        obj.traverse(function(child) {
            if (child.isMesh && child.name !== 'Plane') {
                if (!rockGeo) rockGeo = child.geometry;
            }
        });
        if (!rockGeo) {
            obj.traverse(function(child) { if (child.isMesh) rockGeo = child.geometry; });
        }
        const texLoader = new THREE.TextureLoader();
        texLoader.load('rock_texture.jpg', function(tex) {
            rockTex = tex;
            callback();
        }, undefined, function() { callback(); });
    }, undefined, function() { callback(); });
}

// ===== 初期化 =====
window.addEventListener('DOMContentLoaded',()=>{
    preloadRock(function() {
        initThree();
        const hasSave=!!localStorage.getItem('oil_rush_save');
        if (hasSave) {
            loadGame();
        } else {
            initWorldItemsDefault();
            updateUI();
        }
        requestAnimationFrame(updateGame);
    });
});
</script>
