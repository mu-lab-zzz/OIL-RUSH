<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Oil Rush 3D</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #1a1a1a; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #fff; touch-action: none; }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        .interactive { pointer-events: auto; }
        #header { position: absolute; top: 15px; left: 15px; right: 15px; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
        .stats-card { background: rgba(0,0,0,0.75); border: 1px solid rgba(255,255,255,0.2); backdrop-filter: blur(5px); padding: 12px 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .money-text { font-size: 24px; font-weight: bold; color: #4CAF50; }
        .held-text { font-size: 13px; color: #FFC107; margin-top: 4px; }
        .hint-text { font-size: 11px; color: rgba(255,255,255,0.5); margin-top: 3px; }
        .menu-buttons { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
        .btn { background: #2c3e50; color: white; border: 1px solid #34495e; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; transition: background 0.2s, transform 0.1s; }
        .btn:hover { background: #34495e; } .btn:active { transform: scale(0.95); }
        #notification { position: absolute; top: 80px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.88); color: #fff; padding: 10px 22px; border-radius: 20px; border: 1px solid #FFC107; font-weight: bold; pointer-events: none; opacity: 0; transition: opacity 0.3s; white-space: nowrap; z-index: 20; }
        #interaction-prompt { position: absolute; bottom: 160px; left: 50%; transform: translateX(-50%); background: rgba(46,204,113,0.93); color: #fff; padding: 9px 20px; border-radius: 12px; font-weight: bold; font-size: 14px; display: none; box-shadow: 0 0 12px rgba(46,204,113,0.5); white-space: nowrap; }
        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.85); box-shadow: 0 0 3px rgba(0,0,0,0.7); pointer-events: none; transition: background 0.1s, box-shadow 0.1s; }
        #crosshair.active { background: #2ecc71; box-shadow: 0 0 6px rgba(46,204,113,0.9); }
        #touch-controls { display: none; position: absolute; bottom: 20px; left: 0; width: 100%; justify-content: space-between; align-items: flex-end; padding: 0 24px; pointer-events: none; }
        #joystick-zone { width: 110px; height: 110px; background: rgba(255,255,255,0.12); border: 2px solid rgba(255,255,255,0.3); border-radius: 55px; position: relative; touch-action: none; pointer-events: auto; }
        #joystick-knob { width: 46px; height: 46px; background: rgba(255,255,255,0.55); border-radius: 23px; position: absolute; top: 32px; left: 32px; pointer-events: none; }
        #action-button { width: 82px; height: 82px; background: rgba(230,126,34,0.88); border: 3px solid rgba(255,255,255,0.45); border-radius: 41px; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 13px; color: white; touch-action: manipulation; pointer-events: auto; text-align: center; line-height: 1.3; }
        #rotate-button { width: 60px; height: 60px; background: rgba(52,152,219,0.88); border: 3px solid rgba(255,255,255,0.45); border-radius: 30px; display: none; justify-content: center; align-items: center; font-size: 28px; color: white; touch-action: manipulation; pointer-events: auto; }
        .modal { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 100; justify-content: center; align-items: center; pointer-events: auto; }
        .modal-content { background: #222; border: 1px solid #444; width: 90%; max-width: 500px; padding: 20px; border-radius: 8px; }
        .modal-header { font-size: 18px; font-weight: bold; margin-bottom: 15px; border-bottom: 1px solid #444; padding-bottom: 8px; }
        textarea { width: 100%; height: 120px; background: #111; color: #0f0; border: 1px solid #333; padding: 8px; font-family: monospace; resize: none; margin-bottom: 15px; border-radius: 4px; }
        .modal-buttons { display: flex; justify-content: flex-end; gap: 10px; }
        #btn-settings { width: 40px; height: 40px; background: rgba(44,62,80,0.9); border: 1px solid rgba(255,255,255,0.25); border-radius: 8px; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s, transform 0.1s; backdrop-filter: blur(4px); }
        #btn-settings:hover { background: rgba(52,73,94,0.95); } #btn-settings:active { transform: scale(0.93); }
        #settings-modal .modal-content { max-width: 360px; }
        .settings-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
        .settings-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .settings-label { font-size: 14px; color: #ccc; }
        .toggle-btn { position: relative; width: 48px; height: 26px; background: #444; border: none; border-radius: 13px; cursor: pointer; transition: background 0.2s; flex-shrink: 0; }
        .toggle-btn::after { content:''; position: absolute; left: 3px; top: 3px; width: 20px; height: 20px; background: #fff; border-radius: 50%; transition: transform 0.2s; }
        .toggle-btn.on { background: #e74c3c; }
        .toggle-btn.on::after { transform: translateX(22px); }
        .toggle-btn.on-green { background: #27ae60; }
        .toggle-btn.on-green::after { transform: translateX(22px); }
        #debug-badge { display: none; position: absolute; top: 12px; left: 50%; transform: translateX(-50%); background: rgba(231,76,60,0.92); color: #fff; font-size: 11px; font-weight: bold; padding: 2px 10px; border-radius: 10px; pointer-events: none; z-index: 15; letter-spacing: 1px; }
        body.debug-mode #debug-badge { display: block; }
        @media (pointer: coarse) { #touch-controls { display: flex; } #interaction-prompt { bottom: 155px; } }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
</head>
<body>
<div id="canvas-container"></div>
<div id="ui-layer">
    <div id="header">
        <div class="stats-card">
            <div class="money-text" id="ui-money">$0</div>
            <div class="held-text" id="ui-held">手持ち: なし</div>
            <div class="hint-text" id="ui-hint">← 西: 油田　東: 町 →</div>
        </div>
        <button id="btn-settings" class="interactive" onclick="openSettingsModal()">⚙</button>
    </div>
    <div id="debug-badge">DEBUG MODE</div>
    <div id="notification"></div>
    <div id="crosshair"></div>
    <div id="interaction-prompt"></div>
    <div id="touch-controls">
        <div id="joystick-zone"><div id="joystick-knob"></div></div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:10px;">
            <div id="rotate-button" onclick="doTouchRotate()">↺</div>
            <div id="action-button" onclick="triggerAction()">ACT</div>
        </div>
    </div>
</div>
<div id="settings-modal" class="modal" onclick="if(event.target===this)closeSettingsModal()">
    <div class="modal-content">
        <div class="modal-header" id="settings-title">⚙ 設定</div>
        <div class="settings-group">
            <div class="settings-row">
                <span class="settings-label" id="lbl-lang">言語 / Language</span>
                <button class="btn" id="btn-lang" onclick="toggleLanguage()">English</button>
            </div>
            <div class="settings-row">
                <span class="settings-label" id="lbl-save">セーブ</span>
                <button class="btn" onclick="saveGame();closeSettingsModal()" id="btn-save-s">保存する</button>
            </div>
            <div class="settings-row">
                <span class="settings-label" id="lbl-load">ロード</span>
                <button class="btn" onclick="loadGame();closeSettingsModal()" id="btn-load-s">読み込む</button>
            </div>
            <div class="settings-row">
                <span class="settings-label" id="lbl-data">データ管理</span>
                <button class="btn" onclick="closeSettingsModal();openDataModal()" id="btn-data-s">開く</button>
            </div>
        </div>
        <div style="border-top:1px solid #444;padding-top:14px;margin-top:4px;">
            <div class="settings-row">
                <div>
                    <div class="settings-label" id="lbl-touch">タッチ/クリック選択</div>
                    <div style="font-size:11px;color:#888;margin-top:2px;" id="lbl-touch-sub">画面タップ・クリックでオブジェクトを選択</div>
                </div>
                <button class="toggle-btn on-green" id="btn-touch" onclick="toggleTouchSelect()"></button>
            </div>
            <div class="settings-row" style="margin-top:10px;">
                <div>
                    <div class="settings-label" id="lbl-prox">近接自動選択</div>
                    <div style="font-size:11px;color:#888;margin-top:2px;" id="lbl-prox-sub">近くのオブジェクトを自動選択</div>
                </div>
                <button class="toggle-btn" id="btn-prox" onclick="toggleProximitySelect()"></button>
            </div>
        </div>
        <div style="border-top:1px solid #444;padding-top:14px;margin-top:4px;">
            <div class="settings-row">
                <div>
                    <div class="settings-label" id="lbl-debug" style="color:#e74c3c;font-weight:bold;">🐛 デバッグモード</div>
                    <div style="font-size:11px;color:#888;margin-top:2px;" id="lbl-debug-sub">全商品を無料で購入できます</div>
                </div>
                <button class="toggle-btn" id="btn-debug" onclick="toggleDebugMode()"></button>
            </div>
        </div>
        <div class="modal-buttons" style="margin-top:18px;">
            <button class="btn" onclick="closeSettingsModal()" id="btn-close-s">閉じる</button>
        </div>
    </div>
</div>
<div id="data-modal" class="modal">
    <div class="modal-content">
        <div class="modal-header" id="modal-title">セーブデータ管理</div>
        <textarea id="data-textarea" placeholder="セーブデータを貼り付けるか、エクスポートに使用します..."></textarea>
        <div class="modal-buttons">
            <button class="btn" onclick="exportData()">エクスポート</button>
            <button class="btn" onclick="importData()">インポート</button>
            <button class="btn" onclick="closeDataModal()">閉じる</button>
        </div>
    </div>
</div>

// 将来の精製設備・パイプライン設置の基盤。ワールド座標 = グリッド座標 (1ユニット=1m)
const GRID_CELL = 1;
const _gridMap = new Map(); // "gx,gz" → {type, ref}

function worldToGrid(x, z) {
    return { gx: Math.round(x / GRID_CELL), gz: Math.round(z / GRID_CELL) };
}
function gridToWorld(gx, gz) {
    return { x: gx * GRID_CELL, z: gz * GRID_CELL };
}
function snapToGrid(x, z) {
    const { gx, gz } = worldToGrid(x, z);
    return gridToWorld(gx, gz);
}
function gridKey(gx, gz)  { return `${gx},${gz}`; }
function gridGet(gx, gz)  { return _gridMap.get(gridKey(gx, gz)) || null; }
function gridFree(gx, gz) { return !_gridMap.has(gridKey(gx, gz)); }
function gridSet(gx, gz, type, ref = null) { _gridMap.set(gridKey(gx, gz), { type, ref }); }
function gridDel(gx, gz)  { _gridMap.delete(gridKey(gx, gz)); }

function gridCellsInRect(cx, cz, halfW, halfD) {
    const a = worldToGrid(cx - halfW + 0.5, cz - halfD + 0.5);
    const b = worldToGrid(cx + halfW - 0.5, cz + halfD - 0.5);
    const out = [];
    for (let gx = a.gx; gx <= b.gx; gx++)
        for (let gz = a.gz; gz <= b.gz; gz++)
            out.push({ gx, gz });
    return out;
}
function gridFreeRect(cx, cz, halfW, halfD) {
    return gridCellsInRect(cx, cz, halfW, halfD).every(c => gridFree(c.gx, c.gz));
}
function gridSetRect(cx, cz, halfW, halfD, type, ref = null) {
    gridCellsInRect(cx, cz, halfW, halfD).forEach(c => gridSet(c.gx, c.gz, type, ref));
}
function gridDelRect(cx, cz, halfW, halfD) {
    gridCellsInRect(cx, cz, halfW, halfD).forEach(c => gridDel(c.gx, c.gz));
}

function makeDesertTex() {
    const c = document.createElement('canvas'); c.width = c.height = 512;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#8c6d46'; ctx.fillRect(0,0,512,512);
    for (let i=0; i<40000; i++) {
        const x=Math.random()*512, y=Math.random()*512, r=Math.random()*2+0.5, s=Math.floor(Math.random()*60)-30;
        ctx.fillStyle=`rgb(${140+s},${109+s},${70+s})`;
        ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
    }
    ctx.strokeStyle='rgba(60,40,20,0.15)'; ctx.lineWidth=1.5;
    for (let i=0; i<30; i++) {
        ctx.beginPath(); let cx=Math.random()*512, cy=Math.random()*512; ctx.moveTo(cx,cy);
        for (let j=0; j<5; j++) { cx+=(Math.random()-0.5)*60; cy+=(Math.random()-0.5)*60; ctx.lineTo(cx,cy); }
        ctx.stroke();
    }
    const t = new THREE.CanvasTexture(c);
    t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(60,60); return t;
}
function makeAsphaltTex() {

    const ctx = c.getContext('2d');
    ctx.fillStyle='#1a1a1a'; ctx.fillRect(0,0,256,256);
    for (let i=0; i<5000; i++) {
        const x=Math.random()*256, y=Math.random()*256, s=Math.floor(Math.random()*20)-10;
        ctx.fillStyle=`rgb(${26+s},${26+s},${26+s})`; ctx.fillRect(x,y,2,2);
    }
    const t = new THREE.CanvasTexture(c);
    t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(4,4); return t;
}

// ===== 採掘機メッシュ (3×3×5m, ポンプジャック) =====
function createPumpJackMesh() {
    const g = new THREE.Group();
    function bk(w,h,d,c,r=0.82){
        const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),
            new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:0.3}));
        m.castShadow=true; m.receiveShadow=true; return m;
    }
    function cy(rt,rb,h,c,seg=12){
        const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),
            new THREE.MeshStandardMaterial({color:c,roughness:0.7,metalness:0.4}));
        m.castShadow=true; m.receiveShadow=true; return m;
    }
    const red=0x8B2010, steel=0x3a4450, dark=0x1e2228;

    // ベーススキッド
    const skid=bk(2.8,0.2,1.6,dark); skid.position.set(0,0.1,0); g.add(skid);
    const rl1=bk(2.9,0.1,0.18,dark); rl1.position.set(0,0.05,0.65); g.add(rl1);
    const rl2=bk(2.9,0.1,0.18,dark); rl2.position.set(0,0.05,-0.65); g.add(rl2);

    // モーター/ギアボックス
    const mot=bk(0.88,0.54,0.74,dark); mot.position.set(0,0.47,0.85); g.add(mot);
    const fan=cy(0.21,0.21,0.08,steel,8); fan.rotation.z=Math.PI/2; fan.position.set(0.48,0.54,0.85); g.add(fan);
    const exh=cy(0.04,0.04,0.36,steel,6); exh.position.set(-0.28,0.97,0.85); g.add(exh);

    // サンプソンポスト (中央垂直柱)
    const post=bk(0.26,2.85,0.26,red); post.position.set(0,1.625,0); g.add(post);
    // Aフレームブレース (X方向の対角ブレース)
    const bAng=Math.atan2(0.60,2.85);
    const bLen=Math.sqrt(0.60*0.60+2.85*2.85);
    const br1=bk(0.09,bLen,0.22,red); br1.position.set(-0.30,1.625,0); br1.rotation.z=bAng; g.add(br1);
    const br2=bk(0.09,bLen,0.22,red); br2.position.set( 0.30,1.625,0); br2.rotation.z=-bAng; g.add(br2);
    // ピボットキャップ
    const pvt=bk(0.52,0.22,0.52,steel); pvt.position.set(0,3.12,0); g.add(pvt);

    // クランクグループ (z軸まわりに回転)
    const crankGrp=new THREE.Group();
    crankGrp.position.set(0,1.1,1.05);
    const cDisk=cy(0.46,0.46,0.16,steel,16); cDisk.rotation.x=Math.PI/2; crankGrp.add(cDisk);
    const cCap=cy(0.50,0.50,0.05,dark,16); cCap.rotation.x=Math.PI/2; cCap.position.z=-0.10; crankGrp.add(cCap);
    const cwt=bk(0.60,0.30,0.18,dark); cwt.position.set(0,-0.44,0); crankGrp.add(cwt);
    const cpin=cy(0.05,0.05,0.20,0x999999,6); cpin.rotation.x=Math.PI/2; cpin.position.set(0,0.42,0); crankGrp.add(cpin);
    g.add(crankGrp);

    // ピットマンアーム (クランクとビームを繋ぐ近似表示)
    const pitman=bk(0.08,1.95,0.08,steel);
    pitman.position.set(0,2.05,0.88); pitman.rotation.x=0.38; g.add(pitman);

    // ウォーキングビームグループ (x軸まわりに揺動, 原点をピボット位置に)
    const beamGrp=new THREE.Group();
    beamGrp.position.set(0,3.06,0);
    const beam=bk(0.22,0.16,2.4,red); beamGrp.add(beam);
    // ホースヘッド (前端, local z=-1.15)
    const hhB=bk(0.26,0.84,0.22,red); hhB.position.set(0,0.25,-1.15); beamGrp.add(hhB);
    const hhT=cy(0.20,0.20,0.18,red,12); hhT.position.set(0,0.76,-1.15); beamGrp.add(hhT);
    const brid=bk(0.46,0.10,0.10,steel); brid.position.set(0,-0.12,-1.15); beamGrp.add(brid);
    g.add(beamGrp);

    // ポリッシュロッド (ホースヘッドから地面まで, アニメーション更新)
    const rod=cy(0.032,0.032,2.0,0xcccccc,6);
    rod.position.set(0,2.0,-1.15); g.add(rod);

    // ウェルヘッド
    const wh=bk(0.28,0.22,0.28,steel); wh.position.set(0,0.11,-0.65); g.add(wh);
    const whF=cy(0.17,0.17,0.06,steel,8); whF.position.set(0,0.25,-0.65); g.add(whF);

    // 原油排出口 (緑, 右側 +x) — パイプポート登録方向(+x)に合わせる
    // 支柱: スキッドからy=0.5のパイプ高さまで接続
    const oSupport=bk(0.28,0.62,0.28,dark); oSupport.position.set(1.20,0.31,0); g.add(oSupport);
    // 排出パイプ (スキッド内部→グリッドノードx=2.0まで延伸)
    const oOut=cy(0.09,0.09,0.88,0x1e7a2f,8);
    oOut.rotation.z=Math.PI/2; oOut.position.set(1.64,0.5,0); g.add(oOut);
    const oCap=cy(0.13,0.13,0.06,0x135220,8);
    oCap.rotation.z=Math.PI/2; oCap.position.set(2.06,0.5,0); g.add(oCap);

    // 燃料供給口 (黒, 左側 -x) — パイプ接続可能な燃料吸入口
    const fSupport=bk(0.28,0.62,0.28,dark); fSupport.position.set(-1.20,0.31,0); g.add(fSupport);
    const fIn=cy(0.09,0.09,0.88,0x1a1a1a,8);
    fIn.rotation.z=Math.PI/2; fIn.position.set(-1.64,0.5,0); g.add(fIn);
    const fCap=cy(0.13,0.13,0.06,0x0a0a0a,8);
    fCap.rotation.z=Math.PI/2; fCap.position.set(-2.06,0.5,0); g.add(fCap);

    return { group:g, crankGrp, beamGrp, rod };
}

    // 壁面ポートラベル (近づくと見える程度の小さな文字、ポート色と合わせる)
    function makeWallLabel(text, col, w, x, y, z, ry) {
        const cw=256, ch=64;
        const cv=document.createElement('canvas'); cv.width=cw; cv.height=ch;
        const ctx=cv.getContext('2d');
        // 半透明黒背景
        ctx.fillStyle='rgba(0,0,0,0.68)';
        ctx.fillRect(0,0,cw,ch);
        // テキスト
        ctx.fillStyle=col;
        ctx.font='bold 26px sans-serif';
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(text, cw/2, ch/2);
        const tex=new THREE.CanvasTexture(cv);
        const mat=new THREE.MeshBasicMaterial({map:tex,transparent:true,side:THREE.DoubleSide,depthWrite:false});
        const pl=new THREE.Mesh(new THREE.PlaneGeometry(w, w*ch/cw), mat);
        pl.position.set(x,y,z); pl.rotation.y=ry;
        g.add(pl);
    }
    const LW=1.0, LY=1.8;
    // 左壁 (x=-3, facing outward -X → ry=-PI/2)
    makeWallLabel('原油 IN',  '#00c853', LW, -3.06, LY,  0,    -Math.PI/2);
    // 前壁 (z=-3, facing outward -Z → ry=PI)
    makeWallLabel('燃料 IN',  '#999999', LW,  0,    LY, -3.06,  Math.PI);
    // 後壁 (z=+3, facing outward +Z → ry=0)
    makeWallLabel('ガス OUT', '#888888', LW, -2,    LY,  3.06,  0);
    makeWallLabel('軽油 OUT', '#ccaa00', LW,  0,    LY,  3.06,  0);
    makeWallLabel('灯油 OUT', '#00aacc', LW,  2,    LY,  3.06,  0);
    // 右壁 (x=+3, facing outward +X → ry=PI/2)
    makeWallLabel('ナフサ OUT','#ff7700', LW,  3.06, LY,  2,     Math.PI/2);
    makeWallLabel('LPG OUT',  '#aa66ff', LW,  3.06, LY,  0,     Math.PI/2);
    makeWallLabel('重油 OUT', '#aa6600', LW,  3.06, LY, -2,     Math.PI/2);

    return { group: g, switchMat: switchLed.material };
}

function createTowTankMesh(capacity, fill=0, contentType=null) {
    const g = new THREE.Group();
    // 容量により寸法を決定
    const r = capacity<=500 ? 0.85 : capacity<=1500 ? 1.1 : 1.45;
    const h = capacity<=500 ? 2.2  : capacity<=1500 ? 3.0  : 4.0;
    const tankColor = contentType==='gas' ? 0xb71c1c : (fill>0 ? 0x1a237e : 0x37474f);
    const tankMat = new THREE.MeshStandardMaterial({color:tankColor,roughness:0.4,metalness:0.6});
    const bandMat = new THREE.MeshStandardMaterial({color:0x78909c,roughness:0.3,metalness:0.8});
    const frameMat= new THREE.MeshStandardMaterial({color:0x546e7a,roughness:0.5,metalness:0.6});

    // 本体シリンダー（横置き）
    const body = new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,16), tankMat);
    body.rotation.z = Math.PI/2; body.position.y = r + 0.55; body.castShadow=true; g.add(body);
    // 端蓋
    const capMat = new THREE.MeshStandardMaterial({color:0x546e7a,roughness:0.35,metalness:0.7});
    [-h/2, h/2].forEach(ox => {
        const cap = new THREE.Mesh(new THREE.CylinderGeometry(r*0.98,r*0.98,0.08,16), capMat);
        cap.rotation.z = Math.PI/2; cap.position.set(ox, r+0.55, 0); g.add(cap);
    });
    // バンド
    const nbands = capacity<=500?2:capacity<=1500?3:4;
    for(let i=0;i<nbands;i++){
        const bx2=-(h/2)+h*(i+0.5)/nbands;
        const band=new THREE.Mesh(new THREE.TorusGeometry(r+0.04,0.06,8,20),bandMat);
        band.rotation.x=Math.PI/2; band.rotation.y=Math.PI/2;
        band.position.set(bx2,r+0.55,0); g.add(band);
    }
    // 充填インジケータ
    if(fill>0){
        const cap2 = TOW_TANK_CAPS[`towTank${capacity}`] || capacity;
        const ratio = Math.min(fill/cap2,1);
        const fh = h * ratio * 0.92;
        const fillColor = contentType==='gas'?0xff6f00:0x060606;
        const fmesh = new THREE.Mesh(
            new THREE.CylinderGeometry(r*0.85,r*0.85,fh,12),
            new THREE.MeshStandardMaterial({color:fillColor,roughness:0.05,metalness:0.9})
        );
        fmesh.rotation.z=Math.PI/2; fmesh.position.set(-h/2*(1-ratio)+fh/2-h/2,r+0.55,0); g.add(fmesh);
    }
    // フレーム（支持脚）
    const legH = 0.55;
    [-h*0.35, h*0.35].forEach(ox2 => {
        [-0.55,0.55].forEach(oz2 => {
            const leg = bx(0.12,legH,0.12,0x546e7a,0.6,0.5);
            leg.position.set(ox2, legH/2, oz2); g.add(leg);
        });
        const xbar = bx(0.1,0.1,1.3,0x546e7a,0.6,0.5);
        xbar.position.set(ox2, legH, 0); g.add(xbar);
    });
    // 充填口
    const filler = new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.12,0.22,8),
        new THREE.MeshStandardMaterial({color:0x424242,roughness:0.6}));
    filler.position.set(0, r*2+0.55+0.11, 0); g.add(filler);
    // 容量ラベル用の色帯
    const labelColor = capacity<=500?0xffa000:capacity<=1500?0x1565c0:0x558b2f;
    const label = new THREE.Mesh(new THREE.CylinderGeometry(r+0.01,r+0.01,0.3,16),
        new THREE.MeshStandardMaterial({color:labelColor,roughness:0.5}));
    label.rotation.z=Math.PI/2; label.position.set(0,r+0.55,0); g.add(label);

    g.traverse(m=>{ m.castShadow=true; m.receiveShadow=true; });
    return g;
}

// ===== ワールドアイテム スポーン/削除/更新 =====
function spawnWorldItem(type, x, z, hasOil=false, fill=0, yPos=0, contentType=null) {
    const g = new THREE.Group();
    let mesh;
    if (type === 'ladle') {
        mesh = createLadleMesh(hasOil);
        mesh.rotation.set(0, Math.PI*0.15 + x*0.01, 0);
        mesh.scale.setScalar(1.5);
    } else if (type === 'handPump') {
        mesh = createHandPumpMesh();
        mesh.scale.setScalar(1.0);
    } else if (type === 'drum') {
        mesh = createDrumMesh(fill, contentType);
        mesh.scale.setScalar(1.0);
    } else if (type === 'enginePump') {
        mesh = createEnginePumpMesh();
        mesh.scale.setScalar(1.0);
    } else if (type === 'pumpJack') {
        mesh = createPumpJackMesh().group;
        mesh.scale.setScalar(1.0);
    } else if (type === 'storageTank') {
        mesh = createStorageTankMesh();
        mesh.scale.setScalar(1.0);
    } else if (type === 'pipe') {
        mesh = createPipeSegmentMesh('x');
        mesh.scale.setScalar(0.8);
    } else if (type === 'junctionT') {
        mesh = createTJunctionMesh();
        mesh.scale.setScalar(0.8);
    } else if (type === 'junctionCross') {
        mesh = createCrossJunctionMesh();
        mesh.scale.setScalar(0.8);
    } else if (type === 'refinery') {
        mesh = createRefineryMesh().group;
        mesh.scale.setScalar(0.6);
    } else {
        mesh = createJerryCanMesh(fill);
        mesh.scale.setScalar(1.3);
    }
    g.add(mesh);
    g.position.set(x, yPos, z);
    scene.add(g);
    const entry = { type, group: g, x, z, fill, hasOil, contentType };
    worldItems.push(entry);
    return entry;
}

function removeWorldItem(idx) {
    if (highlightedItemIdx === idx) highlightedItemIdx = -1;
    else if (highlightedItemIdx > idx) highlightedItemIdx--;
    scene.remove(worldItems[idx].group);
    worldItems.splice(idx, 1);
}

function refreshWorldItemMesh(idx) {
    if (highlightedItemIdx === idx) highlightedItemIdx = -1; // グループ差し替え前にリセット
    const item = worldItems[idx];
    const oldG = item.group;
    const pos = oldG.position.clone();
    scene.remove(oldG);
    // 新しいグループ作成
    const g = new THREE.Group();
    let mesh;
    if (item.type === 'ladle') {
        mesh = createLadleMesh(item.hasOil);
        mesh.scale.setScalar(1.5);
    } else if (item.type === 'drum') {
        mesh = createDrumMesh(item.fill, item.contentType);
        mesh.scale.setScalar(1.0);
    } else {
        mesh = createJerryCanMesh(item.fill);
        mesh.scale.setScalar(1.3);
    }
    g.add(mesh);
    g.position.copy(pos);
    scene.add(g);
    item.group = g;
}

// ===== ドロップ位置（コリジョン回避） =====
function isItemPosBlocked(x, z) {
    const hw=0.3; // アイテム占有半径
    for (const b of collisionBoxes) {
        if (x+hw>b.x-b.hw && x-hw<b.x+b.hw && z+hw>b.z-b.hd && z-hw<b.z+b.hd) return true;
    }
    if (x<-585||x>585||z<-585||z>585) return true;
    return false;
}

function getDropPos() {
    const fx=-Math.sin(gameState.cameraYaw), fz=-Math.cos(gameState.cameraYaw);
    const px=playerGroup.position.x, pz=playerGroup.position.z;
    // 前方1.2mから少しずつ近づいて最初に有効な位置を返す
    for (let dist=1.2; dist>=0.3; dist-=0.15) {
        const cx=px+fx*dist, cz=pz+fz*dist;
        if (!isItemPosBlocked(cx, cz)) return {x:cx, z:cz};
    }
    // 全てブロックされていたらプレイヤー位置の横にずらす
    const sx=-fz, sz=fx; // 右方向ベクトル
    for (let s=0.5; s<=1.5; s+=0.5) {
        const cx=px+sx*s, cz=pz+sz*s;
        if (!isItemPosBlocked(cx, cz)) return {x:cx, z:cz};
        if (!isItemPosBlocked(px-sx*s, pz-sz*s)) return {x:px-sx*s, z:pz-sz*s};
    }
    return {x:px, z:pz}; // 最終フォールバック
}

function getGridSnapPos() {
    const MAX_PLACE_DIST = 15;
    const dir = new THREE.Vector3();
    camera.getWorldDirection(dir);
    let tx, tz;
    if (dir.y < -0.01) {
        // 視線とy=0平面の交点を求める
        let t = camera.position.y / (-dir.y);
        t = Math.min(t, MAX_PLACE_DIST);
        tx = camera.position.x + dir.x * t;
        tz = camera.position.z + dir.z * t;
    } else {
        // 水平か上向きの場合は正面2mにフォールバック
        const fx = -Math.sin(gameState.cameraYaw);
        const fz = -Math.cos(gameState.cameraYaw);
        tx = playerGroup.position.x + fx * 2.0;
        tz = playerGroup.position.z + fz * 2.0;
    }
    return {
        x: Math.round(tx / GRID_SNAP) * GRID_SNAP,
        z: Math.round(tz / GRID_SNAP) * GRID_SNAP
    };
}

// ===== パイプラインヘルパー =====
function nodeKey(gx, gz) { return `${gx},${gz}`; }
function parseNodeKey(key) { const [a,b]=key.split(','); return {gx:+a,gz:+b}; }
function edgeKey(gx1,gz1,gx2,gz2) {
    return (gx1<gx2||(gx1===gx2&&gz1<gz2)) ? `${gx1},${gz1}:${gx2},${gz2}` : `${gx2},${gz2}:${gx1},${gz1}`;
}
function worldToGrid(wx,wz) { return {gx:Math.round(wx/GRID_SNAP),gz:Math.round(wz/GRID_SNAP)}; }
function gridToWorld(gx,gz) { return {x:gx*GRID_SNAP, z:gz*GRID_SNAP}; }
function findOilSpringAtGrid(gx,gz) { return oilSprings.find(s=>s.gx===gx&&s.gz===gz)||null; }
function rotateGridDir(dx,dz,rotY) {
    const c=Math.round(Math.cos(rotY)), s=Math.round(Math.sin(rotY));
    return {dx:c*dx-s*dz, dz:s*dx+c*dz};
}
// プレイヤーが向いている方向の最近グリッド辺を返す
function getPipeSnapEdge() {
    const px=playerGroup.position.x, pz=playerGroup.position.z;
    const fx=-Math.sin(gameState.cameraYaw), fz=-Math.cos(gameState.cameraYaw);
    const gx0=Math.round(px/GRID_SNAP), gz0=Math.round(pz/GRID_SNAP);
    if (Math.abs(fx) >= Math.abs(fz)) {
        const gx1 = fx>=0 ? gx0 : gx0-1;
        return {gx1,gz1:gz0,gx2:gx1+1,gz2:gz0,axis:'x'};
    } else {
        const gz1 = fz>=0 ? gz0 : gz0-1;
        return {gx1:gx0,gz1,gx2:gx0,gz2:gz1+1,axis:'z'};
    }
}
// ネットワーク内の液体種別を調べる
function getNetworkLiquidType(startKey) {
    const visited=new Set([startKey]), queue=[startKey];
    while (queue.length>0) {
        const key=queue.shift();
        const ports=portRegistry.get(key);
        if (ports) for (const p of ports) { if (p.liquidType) return p.liquidType; }
        const conns=pipeNodeConns.get(key)||new Set();
        for (const nk of conns) {
            if (!visited.has(nk)) { visited.add(nk); queue.push(nk); }
        }
    }
    return null;
}
// ノードジョイント(エルボ球)の更新
function updateNodeJoint(gx,gz) {
    const nk=nodeKey(gx,gz);
    if (nodeJointMeshes.has(nk)) { scene.remove(nodeJointMeshes.get(nk)); nodeJointMeshes.delete(nk); }
    if (junctionNodes.has(nk)) return; // 分岐パイプが占有している
    const conns=pipeNodeConns.get(nk)||new Set();
    if (conns.size<1) return;
    const jm=createNodeJointMesh();
    const wp=gridToWorld(gx,gz);
    jm.position.set(wp.x,0.5,wp.z);
    scene.add(jm);
    nodeJointMeshes.set(nk,jm);
}
// 液体種別カラー取得
function getLiquidColor(liquidType, portType) {
    if (!liquidType) return 0x777777; // 任意 = グレー
    const isOut = portType === 'out';
    switch (liquidType) {
        case 'oil':      return isOut ? 0xff8c00 : 0x00c853;
        case 'gas':      return 0x222222;
        case 'diesel':   return 0xccaa00;
        case 'kerosene': return 0x00aacc;
        case 'naphtha':  return 0xff7700;
        case 'lpg':      return 0x9944cc;
        case 'heavyoil': return 0x3d1a00;
        default:         return isOut ? 0xff8c00 : 0x00c853;
    }
}
// ポート方向矢印コーン生成（3Dメッシュ: カメラ方向に依存しない）
function createPortArrowMesh(portType, dx, dz, liquidType) {
    const isOut = portType === 'out';
    const col = getLiquidColor(liquidType, portType);
    // 排出口: 施設から外向き / 吸入口: 施設へ向く
    const adx = isOut ? dx : -dx;
    const adz = isOut ? dz : -dz;
    const mat = new THREE.MeshBasicMaterial({ color: col, side: THREE.DoubleSide });
    // ConeGeometryはデフォルトY軸向き（先端が+Y）→ 水平方向へ回転
    const cone = new THREE.Mesh(new THREE.ConeGeometry(0.22, 0.65, 8), mat);
    if      (adx > 0) cone.rotation.z = -Math.PI / 2;
    else if (adx < 0) cone.rotation.z =  Math.PI / 2;
    else if (adz > 0) cone.rotation.x =  Math.PI / 2;
    else              cone.rotation.x = -Math.PI / 2;
    return cone;
}
// 施設接続口を全クリア（ロード前に呼ぶ）
function clearFacilityPorts() {
    portRegistry.clear();
    portMarkers.forEach(m=>scene.remove(m)); portMarkers.clear();
    portLabels.forEach(s=>scene.remove(s));  portLabels.clear();
}
// 施設接続口の登録
function registerFacilityPorts(facilityType, idx, gx, gz, rotY) {
    const addPort=(dx,dz,portType,liquidType)=>{
        const d=rotateGridDir(dx,dz,rotY);
        const pgx=gx+d.dx, pgz=gz+d.dz;
        const key=nodeKey(pgx,pgz);
        if (!portRegistry.has(key)) portRegistry.set(key,[]);
        portRegistry.get(key).push({facilityType,idx,portType,liquidType});
        // 地面マーカー + 矢印ラベル
        if (!portMarkers.has(key)) {
            const col = getLiquidColor(liquidType, portType);
            const emit = col;
            const mat = new THREE.MeshStandardMaterial({color:col,roughness:0.8,emissive:emit,emissiveIntensity:0.35});
            const mark = new THREE.Mesh(new THREE.CylinderGeometry(0.35,0.35,0.06,16), mat);
            const wp=gridToWorld(pgx,pgz);
            mark.position.set(wp.x,0.03,wp.z);
            scene.add(mark);
            portMarkers.set(key,mark);
        }
    };
    if (facilityType==='pumpJack') {
        addPort( 1,0,'out','oil');  // 右側 (+x) → 原油排出口
        addPort(-1,0,'in', 'gas');  // 左側 (-x) → 燃料吸入口
    } else if (facilityType==='storageTank') {
        addPort(-1,0,'in', null);   // 左側 (-x) → 任意液体吸入口
        addPort( 1,0,'out',null);   // 右側 (+x) → 任意液体排出口
    } else if (facilityType==='refinery') {
        addPort(-2, 0,'in', 'oil');      // 左側 → 原油吸入口
        addPort( 0,-2,'in', null);       // 前側 → 燃料吸入口 (gas/diesel)
        addPort(-1, 2,'out','gas');      // 後左 → ガソリン排出口  (~1m間隔)
        addPort( 0, 2,'out','diesel');   // 後中 → 軽油排出口
        addPort( 1, 2,'out','kerosene'); // 後右 → 灯油排出口
        addPort( 2, 1,'out','naphtha');  // 右後 → ナフサ排出口
        addPort( 2, 0,'out','lpg');      // 右中 → LPG排出口
        addPort( 2,-1,'out','heavyoil'); // 右前 → 重油排出口
    }
}
function unregisterFacilityPorts(facilityType, idx) {
    for (const [key,ports] of portRegistry) {
        const filtered=ports.filter(p=>!(p.facilityType===facilityType&&p.idx===idx));
        if (filtered.length===0) {
            portRegistry.delete(key);
            if (portMarkers.has(key)) { scene.remove(portMarkers.get(key)); portMarkers.delete(key); }
            if (portLabels.has(key))  { scene.remove(portLabels.get(key));  portLabels.delete(key); }
        } else portRegistry.set(key,filtered);
    }
    // 削除後に残ったポートのインデックスを更新
    for (const [key,ports] of portRegistry) {
        ports.forEach(p=>{ if(p.facilityType===facilityType&&p.idx>idx) p.idx--; });
    }
}
// BFS: 指定ノードから接続されている排出口を探す
function findConnectedSources(startKey, liquidType) {
    const visited=new Set([startKey]), queue=[startKey], sources=[];
    while (queue.length>0) {
        const key=queue.shift();
        const ports=portRegistry.get(key);
        if (ports) {
            for (const p of ports) {
                if (p.portType==='out' && (p.liquidType===liquidType||p.liquidType===null)) sources.push(p);
            }
        }
        const conns=pipeNodeConns.get(key)||new Set();
        for (const nk of conns) {
            if (!visited.has(nk)) { visited.add(nk); queue.push(nk); }
        }
    }
    return sources;
}
// BFS: 指定ノードから接続されている吸入口を探す
function findConnectedSinks(startKey, liquidType) {
    const visited=new Set([startKey]), queue=[startKey], sinks=[];
    while (queue.length>0) {
        const key=queue.shift();
        const ports=portRegistry.get(key);
        if (ports) {
            for (const p of ports) {
                if (p.portType==='in' && (p.liquidType===liquidType||p.liquidType===null)) sinks.push(p);
            }
        }
        const conns=pipeNodeConns.get(key)||new Set();
        const numConns=conns.size;
        // 3本以上の場合は分岐パイプが必要
        if (numConns>=3) {
            const junc=junctionNodes.get(key);
            if (numConns===3 && (!junc||junc.type!=='T')) continue;
            if (numConns>=4 && (!junc||junc.type!=='cross')) continue;
        }
        for (const nk of conns) {
            if (!visited.has(nk)) { visited.add(nk); queue.push(nk); }
        }
    }
    return sinks;
}
// 流体シミュレーション (毎フレーム呼ぶ)
function simulatePipeFlow(delta) {
    // 共通: シンクを重複除去して返す
    function dedup(arr) {
        const seen=new Set();
        return arr.filter(s=>{ const k=`${s.facilityType}:${s.idx}`; if(seen.has(k))return false; seen.add(k);return true; });
    }

    // 採掘機 → タンク/精製施設 (原油)
    pumpJackObjs.forEach((pj)=>{
        if (pj.oilBuffer<=0) return;
        const {gx,gz}=worldToGrid(pj.x,pj.z);
        const d=rotateGridDir(1,0,pj.group.rotation.y);
        const outNK=nodeKey(gx+d.dx, gz+d.dz);
        const conns=pipeNodeConns.get(outNK);
        const ports=portRegistry.get(outNK)||[];
        const direct=ports.filter(p=>p.portType==='in'&&(p.liquidType==='oil'||p.liquidType===null));
        const sinks=dedup([...direct,...(conns&&conns.size>0?findConnectedSinks(outNK,'oil'):[])]);
        if (sinks.length===0) return;
        const totalAvail=Math.min(pj.oilBuffer, PUMP_JACK_OIL_RATE*delta);
        const perSink=totalAvail/sinks.length;
        let moved=0;
        sinks.forEach(s=>{
            if (s.facilityType==='storageTank') {
                const tank=storageTankObjs[s.idx];
                if (!tank||(tank.liquidType&&tank.liquidType!=='oil')) return;
                const add=Math.min(perSink, STORAGE_TANK_CAP-tank.level);
                if (add>0) { tank.level+=add; tank.liquidType='oil'; moved+=add; }
            } else if (s.facilityType==='refinery') {
                const rf=refineryObjs[s.idx];
                if (!rf) return;
                const add=Math.min(perSink, REFINERY_OIL_BUF_CAP-rf.oilBuf);
                if (add>0) { rf.oilBuf+=add; moved+=add; }
            }
        });
        pj.oilBuffer=Math.max(0, pj.oilBuffer-moved);
    });

    // タンク → タンク/採掘機/精製施設 (貯蔵中の任意液体を排出)
    const TANK_TRANSFER_RATE = 5.0; // L/秒
    storageTankObjs.forEach((srcTank, srcIdx)=>{
        if (srcTank.level<=0||!srcTank.liquidType) return;
        const lt=srcTank.liquidType;
        const {gx,gz}=worldToGrid(srcTank.x, srcTank.z);
        const d=rotateGridDir(1,0, srcTank.rot||0);
        const outNK=nodeKey(gx+d.dx, gz+d.dz);
        const conns=pipeNodeConns.get(outNK);
        const ports=portRegistry.get(outNK)||[];
        const direct=ports.filter(p=>p.portType==='in'&&(p.liquidType===lt||p.liquidType===null));
        const allSinks=dedup([...direct,...(conns&&conns.size>0?findConnectedSinks(outNK,lt):[])]);
        const sinks=allSinks.filter(s=>!(s.facilityType==='storageTank'&&s.idx===srcIdx));
        if (sinks.length===0) return;
        const totalAvail=Math.min(srcTank.level, TANK_TRANSFER_RATE*delta);
        const perSink=totalAvail/sinks.length;
        let moved=0;
        sinks.forEach(s=>{
            if (s.facilityType==='storageTank') {
                const dst=storageTankObjs[s.idx];
                if (!dst||(dst.liquidType&&dst.liquidType!==lt)) return;
                const add=Math.min(perSink, STORAGE_TANK_CAP-dst.level);
                if (add>0) { dst.level+=add; dst.liquidType=lt; moved+=add; }
            } else if (s.facilityType==='pumpJack'&&(lt==='gas'||lt==='diesel')) {
                const pj=pumpJackObjs[s.idx];
                if (!pj) return;
                const add=Math.min(perSink, PUMP_JACK_FUEL_CAP-pj.fuelLevel);
                if (add>0) { pj.fuelLevel+=add; moved+=add; }
            } else if (s.facilityType==='refinery') {
                const rf=refineryObjs[s.idx];
                if (!rf) return;
                if (lt==='oil') {
                    const add=Math.min(perSink, REFINERY_OIL_BUF_CAP-rf.oilBuf);
                    if (add>0) { rf.oilBuf+=add; moved+=add; }
                } else if (lt==='gas'||lt==='diesel') {
                    const add=Math.min(perSink, REFINERY_FUEL_BUF_CAP-rf.fuelBuf);
                    if (add>0) { rf.fuelBuf+=add; moved+=add; }
                }
            }
        });
        srcTank.level=Math.max(0, srcTank.level-moved);
        if (srcTank.level===0) srcTank.liquidType=null;
    });

    // 精製施設 → 貯蔵タンク (精製物の排出)
    const REFINERY_PUSH_RATE = 8.0; // L/秒 per product
    refineryObjs.forEach((rf, rfIdx)=>{
        const {gx,gz}=worldToGrid(rf.x, rf.z);
        const productMap = {
            gas:      rotateGridDir(-1, 2, rf.rot||0),
            diesel:   rotateGridDir( 0, 2, rf.rot||0),
            kerosene: rotateGridDir( 1, 2, rf.rot||0),
            naphtha:  rotateGridDir( 2, 1, rf.rot||0),
            lpg:      rotateGridDir( 2, 0, rf.rot||0),
            heavyoil: rotateGridDir( 2,-1, rf.rot||0)
        };
        Object.entries(productMap).forEach(([product, dir])=>{
            const amount = rf.products[product];
            if (amount<=0) return;
            const outNK=nodeKey(gx+dir.dx, gz+dir.dz);
            const conns=pipeNodeConns.get(outNK);
            const ports=portRegistry.get(outNK)||[];
            const direct=ports.filter(p=>p.portType==='in'&&(p.liquidType===product||p.liquidType===null));
            const sinks=dedup([...direct,...(conns&&conns.size>0?findConnectedSinks(outNK,product):[])]);
            if (sinks.length===0) return;
            const totalAvail=Math.min(amount, REFINERY_PUSH_RATE*delta);
            const perSink=totalAvail/sinks.length;
            let moved=0;
            sinks.forEach(s=>{
                if (s.facilityType==='storageTank') {
                    const dst=storageTankObjs[s.idx];
                    if (!dst||(dst.liquidType&&dst.liquidType!==product)) return;
                    const add=Math.min(perSink, STORAGE_TANK_CAP-dst.level);
                    if (add>0) { dst.level+=add; dst.liquidType=product; moved+=add; }
                }
            });
            rf.products[product]=Math.max(0, rf.products[product]-moved);
        });
    });
}
// 精製施設シミュレーション
let refineryBlinkTimer = 0;
function simulateRefinery(delta) {
    refineryBlinkTimer = (refineryBlinkTimer + delta) % 1.0;
    const blinkOn = refineryBlinkTimer < 0.5;
    refineryObjs.forEach(rf => {
        if (!rf.switchMat) return;
        const blocked = Object.values(rf.products).some(v => v >= REFINERY_PRODUCT_CAP);
        if (blocked) {
            // 黄色明滅
            rf.switchMat.emissive.set(blinkOn ? 0xdddd00 : 0x222200);
            rf.switchMat.color.set(blinkOn ? 0xdddd00 : 0x333300);
            rf.blocked = true;
        } else if (rf.enabled) {
            rf.switchMat.emissive.set(0x00cc00);
            rf.switchMat.color.set(0x00cc00);
            rf.blocked = false;
        } else {
            rf.switchMat.emissive.set(0xcc0000);
            rf.switchMat.color.set(0xcc0000);
            rf.blocked = false;
        }
        if (!rf.enabled || blocked) return;
        if (rf.oilBuf <= 0 || rf.fuelBuf <= 0) return;
        const oilPerTick = REFINERY_OIL_RATE * delta;
        const fuelPerTick = REFINERY_FUEL_RATE * delta;
        const actualOil = Math.min(oilPerTick, rf.oilBuf);
        const actualFuel = Math.min(fuelPerTick, rf.fuelBuf);
        const ratio = Math.min(actualOil / oilPerTick, actualFuel / fuelPerTick);
        const oilUsed = oilPerTick * ratio;
        const fuelUsed = fuelPerTick * ratio;
        if (oilUsed <= 0) return;
        rf.oilBuf  = Math.max(0, rf.oilBuf  - oilUsed);
        rf.fuelBuf = Math.max(0, rf.fuelBuf - fuelUsed);
        Object.keys(REFINERY_YIELDS).forEach(product => {
            const produced = oilUsed * REFINERY_YIELDS[product];
            rf.products[product] = Math.min(REFINERY_PRODUCT_CAP, (rf.products[product]||0) + produced);
        });
    });
}

// パイプゴーストメッシュ更新
function updatePipeGhostMesh() {
    if (!heldItem||heldItem.type!=='pipe') {
        if (pipeGhostMesh) { scene.remove(pipeGhostMesh); pipeGhostMesh=null; pipeGhostAxis=null; }
        return;
    }
    const edge=getPipeSnapEdge();
    const ek=edgeKey(edge.gx1,edge.gz1,edge.gx2,edge.gz2);
    const occupied=pipeEdges.has(ek);
    if (!pipeGhostMesh||pipeGhostAxis!==edge.axis) {
        if (pipeGhostMesh) scene.remove(pipeGhostMesh);
        pipeGhostMesh=new THREE.Group();
        const seg=createPipeSegmentMesh(edge.axis);
        seg.traverse(ch=>{ if(ch.isMesh){ ch.material=ch.material.clone(); ch.material.transparent=true; ch.material.opacity=0.4; ch.material.depthWrite=false; } });
        pipeGhostMesh.add(seg);
        scene.add(pipeGhostMesh);
        pipeGhostAxis=edge.axis;
    }
    const x=(edge.gx1+edge.gx2)/2*GRID_SNAP, z=(edge.gz1+edge.gz2)/2*GRID_SNAP;
    pipeGhostMesh.position.set(x,0,z);
    const col=occupied?0xff4444:0x44aaff;
    pipeGhostMesh.traverse(ch=>{ if(ch.isMesh&&ch.material) ch.material.color.set(col); });
}
// パイプ設置
function doInstallPipe() {
    const L=I18N[currentLang];
    const edge=getPipeSnapEdge();
    const ek=edgeKey(edge.gx1,edge.gz1,edge.gx2,edge.gz2);
    if (pipeEdges.has(ek)) { showNotification(L.msgPipeOccupied); return; }
    const ltA=getNetworkLiquidType(nodeKey(edge.gx1,edge.gz1));
    const ltB=getNetworkLiquidType(nodeKey(edge.gx2,edge.gz2));
    if (ltA&&ltB&&ltA!==ltB) { showNotification(L.msgPipeLiquidMismatch); return; }
    const x=(edge.gx1+edge.gx2)/2*GRID_SNAP, z=(edge.gz1+edge.gz2)/2*GRID_SNAP;
    const seg=createPipeSegmentMesh(edge.axis);
    seg.position.set(x,0.5,z);
    scene.add(seg);
    pipeEdges.set(ek,{liquidType:ltA||ltB||null, mesh:seg});
    const nk1=nodeKey(edge.gx1,edge.gz1), nk2=nodeKey(edge.gx2,edge.gz2);
    if (!pipeNodeConns.has(nk1)) pipeNodeConns.set(nk1,new Set());
    if (!pipeNodeConns.has(nk2)) pipeNodeConns.set(nk2,new Set());
    pipeNodeConns.get(nk1).add(nk2);
    pipeNodeConns.get(nk2).add(nk1);
    updateNodeJoint(edge.gx1,edge.gz1);
    updateNodeJoint(edge.gx2,edge.gz2);
    if (pipeGhostMesh) { scene.remove(pipeGhostMesh); pipeGhostMesh=null; pipeGhostAxis=null; }
    heldItem=null; updateHeldMesh(); updateUI();
    showNotification(L.msgPipeInstalled);
}
// T字分岐設置
function doInstallJunctionT() {
    const L=I18N[currentLang];
    const gp=getGridSnapPos();
    const gx=Math.round(gp.x/GRID_SNAP), gz=Math.round(gp.z/GRID_SNAP);
    const nk=nodeKey(gx,gz);
    if (junctionNodes.has(nk)) { showNotification(L.msgJunctionOccupied); return; }
    const m=createTJunctionMesh();
    m.position.set(gp.x,0,gp.z); m.rotation.y=placementRot;

    if (ghostMesh) { scene.remove(ghostMesh); ghostMesh=null; }
    placementRot=0; heldItem=null; updateHeldMesh(); updateUI();
    showNotification(L.msgJunctionInstalled);
}
// 十字分岐設置
function doInstallJunctionCross() {
    const L=I18N[currentLang];
    const gp=getGridSnapPos();
    const gx=Math.round(gp.x/GRID_SNAP), gz=Math.round(gp.z/GRID_SNAP);
    const nk=nodeKey(gx,gz);
    if (junctionNodes.has(nk)) { showNotification(L.msgJunctionOccupied); return; }
    const m=createCrossJunctionMesh();
    m.position.set(gp.x,0,gp.z); m.rotation.y=placementRot;
    scene.add(m);
    junctionNodes.set(nk,{type:'cross',rot:placementRot,mesh:m});
    if (nodeJointMeshes.has(nk)) { scene.remove(nodeJointMeshes.get(nk)); nodeJointMeshes.delete(nk); }
    if (ghostMesh) { scene.remove(ghostMesh); ghostMesh=null; }
    placementRot=0; heldItem=null; updateHeldMesh(); updateUI();
    showNotification(L.msgJunctionInstalled);
}
// パイプ撤去
function doRemovePipe() {
    const L=I18N[currentLang];
    const edge=getPipeSnapEdge();
    const ek=edgeKey(edge.gx1,edge.gz1,edge.gx2,edge.gz2);
    const entry=pipeEdges.get(ek);
    if (!entry) return;
    scene.remove(entry.mesh);
    pipeEdges.delete(ek);
    const nk1=nodeKey(edge.gx1,edge.gz1), nk2=nodeKey(edge.gx2,edge.gz2);
    const c1=pipeNodeConns.get(nk1); if(c1){ c1.delete(nk2); if(c1.size===0) pipeNodeConns.delete(nk1); }
    const c2=pipeNodeConns.get(nk2); if(c2){ c2.delete(nk1); if(c2.size===0) pipeNodeConns.delete(nk2); }
    updateNodeJoint(edge.gx1,edge.gz1);
    updateNodeJoint(edge.gx2,edge.gz2);
    showNotification(L.msgPipeRemoved);
}
// 分岐パイプ撤去
function doRemoveJunction() {
    const L=I18N[currentLang];
    const gp=getGridSnapPos();
    const gx=Math.round(gp.x/GRID_SNAP), gz=Math.round(gp.z/GRID_SNAP);
    const nk=nodeKey(gx,gz);
    const entry=junctionNodes.get(nk);
    if (!entry) return;
    scene.remove(entry.mesh);
    junctionNodes.delete(nk);
    updateNodeJoint(gx,gz); // 接続がまだあればエルボ球を復元
    heldItem = { type: entry.type==='T' ? 'junctionT' : 'junctionCross', fill:0, hasOil:false };
    updateHeldMesh(); updateUI();
    showNotification(L.msgJunctionRemoved);
}

function createGhostMesh(type) {
    let g;
    if (type === 'pumpJack') {
        g = createPumpJackMesh().group;
    } else if (type === 'junctionT') {
        g = createTJunctionMesh();
    } else if (type === 'junctionCross') {
        g = createCrossJunctionMesh();
    } else if (type === 'refinery') {
        g = createRefineryMesh().group;
    } else {
        g = createStorageTankMesh();
    }
    g.traverse(m => {
        if (m.isMesh) {
            m.material = m.material.clone();
            m.material.transparent = true;
            m.material.opacity = 0.35;
            m.material.color.set(0x44aaff);
            m.material.depthWrite = false;
        }
    });
    return g;
}

// ポンプジャック専用: 近くの油田中心に吸着 (3m以内)
function getPumpJackSnapPos() {
    const gp = getGridSnapPos();
    const ATTRACT_R2 = 3 * 3;
    let best = null, bestD2 = ATTRACT_R2;
    oilSprings.forEach(s => {
        const d2 = (gp.x - s.worldX)**2 + (gp.z - s.worldZ)**2;
        if (d2 < bestD2) { bestD2 = d2; best = s; }
    });
    return best ? { x: best.worldX, z: best.worldZ } : gp;
}

function updateGhostMesh() {
    const needGhost = heldItem && GRID_SNAP_TYPES.includes(heldItem.type);
    if (!needGhost) {
        if (ghostMesh) { scene.remove(ghostMesh); ghostMesh = null; }
        return;
    }
    if (!ghostMesh || ghostMesh._ghostType !== heldItem.type) {
        if (ghostMesh) scene.remove(ghostMesh);
        ghostMesh = createGhostMesh(heldItem.type);
        ghostMesh._ghostType = heldItem.type;
        scene.add(ghostMesh);
    }
    let gp, ghostColor;
    if (heldItem.type === 'pumpJack') {
        gp = getPumpJackSnapPos();
        const {gx,gz} = worldToGrid(gp.x, gp.z);
        const spring = findOilSpringAtGrid(gx, gz);
        ghostColor = (spring && spring.pumpJackIdx < 0) ? 0x44ff88 : 0xff3333;
    } else {
        gp = getGridSnapPos();
        ghostColor = 0x44aaff;
    }
    ghostMesh.position.set(gp.x, 0, gp.z);
    ghostMesh.rotation.y = placementRot;
    // 色を毎フレーム更新
    ghostMesh.traverse(m => { if (m.isMesh) m.material.color.setHex(ghostColor); });
}

// ===== 空（スカイドーム＋雲） =====
function createSky() {
    // グラデーションシェーダースカイドーム
    const skyVert = `
        varying vec3 vWorldDir;
        void main() {
            vWorldDir = normalize((modelMatrix * vec4(position, 0.0)).xyz);
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
    `;
    const skyFrag = `
        uniform vec3 zenithColor;
        uniform vec3 horizonColor;
        uniform vec3 sunDir;
        varying vec3 vWorldDir;
        void main() {
            float t = pow(clamp(vWorldDir.y, 0.0, 1.0), 0.42);
            vec3 sky = mix(horizonColor, zenithColor, t);

            // ホライズン帯のオレンジグロー
            float hz = pow(1.0 - clamp(abs(vWorldDir.y) * 4.0, 0.0, 1.0), 4.0);
            sky = mix(sky, vec3(0.98, 0.60, 0.22), hz * 0.32);

            // 太陽外縁グロー
            float sd = clamp(dot(normalize(vWorldDir), sunDir), 0.0, 1.0);
            sky += vec3(1.0, 0.82, 0.45) * pow(sd, 10.0) * 0.55;
            // 太陽ディスク
            sky += vec3(1.0, 0.97, 0.88) * pow(sd, 300.0) * 3.0;

            gl_FragColor = vec4(sky, 1.0);
        }
    `;

    skyDome = new THREE.Mesh(
        new THREE.SphereGeometry(700, 32, 16),
        new THREE.ShaderMaterial({
            vertexShader: skyVert,
            fragmentShader: skyFrag,
            uniforms: {
                zenithColor:  { value: new THREE.Color(0x1a5099) },
                horizonColor: { value: new THREE.Color(0xc8956b) },
                sunDir:       { value: new THREE.Vector3(0.557, 0.743, 0.371) },
            },
            side: THREE.BackSide,
            depthWrite: false,
        })
    );
    skyDome.renderOrder = -1;
    scene.add(skyDome);

    // フォグをホライズン色に合わせる
    scene.fog = new THREE.FogExp2(0xc8956b, 0.0018);

    // 雲
    const cloudBase = new THREE.MeshStandardMaterial({
        color: 0xf5f0ea, roughness: 1.0, transparent: true, opacity: 0.88, depthWrite: false
    });
    [
        [-80, 58, -45, 32, 9],
        [ 35, 64, -85, 24, 7],
        [110, 52, -28, 36, 10],
        [-38, 60,  78, 22, 7],
        [ 78, 56,  68, 30, 9],
        [-130,68,  22, 26, 8],
        [155, 54, -58, 28, 8],
        [  8, 70,-128, 20, 6],
        [ 60, 62, 130, 26, 8],
        [-100,50,  -5, 30, 8],
    ].forEach(([x, y, z, w, h]) => {
        const g = new THREE.Group();
        const cm = cloudBase.clone();
        const mk = (sw, sh, sd) => {
            const m = new THREE.Mesh(new THREE.BoxGeometry(sw, sh, sd), cm);
            m.castShadow = false; return m;
        };
        // 主体
        const main = mk(w, h, w*0.52); g.add(main);
        // 横の膨らみ
        [[-w*0.36,-h*0.12, 0],[w*0.36,-h*0.12, 0],[0,-h*0.10, w*0.18]].forEach(([ox,oy,oz])=>{
            const p = mk(w*0.62, h*0.72, w*0.44);
            p.position.set(ox,oy,oz); g.add(p);
        });
        g.position.set(x, y, z);
        g.rotation.y = x * 0.05; // 雑な向きのバラツキ
        scene.add(g);
        clouds.push(g);
    });
}

function checkCollision(x, z) {
    const pr=0.45;
    if (x<-585||x>585||z<-585||z>585) return true;
    for (const b of collisionBoxes) {
        if (x+pr>b.x-b.hw && x-pr<b.x+b.hw && z+pr>b.z-b.hd && z-pr<b.z+b.hd) return true;
    }
    return false;
}

function createOilSpring(cx, cz, scale) {
    const gcx = Math.round(cx), gcz = Math.round(cz);
    const g = new THREE.Group(); g.position.set(gcx, 0, gcz);

    // 決定論的シード (位置から生成)
    const seed = ((gcx * 127 + gcz * 311) & 0x7fff);
    const baseR = scale * 3.8;

    // 有機的半径関数 — ビジュアルとグリッド登録の両方で共用
    function oR(a, r, s) {
        return r * (0.76 + 0.19*Math.sin(s*0.031 + a*3.1)
                       + 0.11*Math.sin(s*0.017 + a*5.2)
                       + 0.05*Math.sin(s*0.053 + a*8.4));
    }

    // 有機的シェイプを生成 (ShapeGeometry用 XZ平面)
    function makeOrgShape(r, nPts, s) {
        const pts = [];
        for (let i = 0; i < nPts; i++) {
            const a = (i/nPts)*Math.PI*2;
            const rad = oR(a, r, s);
            pts.push(new THREE.Vector2(Math.cos(a)*rad, Math.sin(a)*rad));
        }
        const sh = new THREE.Shape(pts);
        const geo = new THREE.ShapeGeometry(sh, 3);
        geo.rotateX(-Math.PI/2);
        return geo;
    }

    const oilMat = new THREE.MeshStandardMaterial({
        color:0x07050a, roughness:0.04, metalness:0.96
    });
    const rimMat = new THREE.MeshStandardMaterial({
        color:0x1a0f07, roughness:0.95, metalness:0.02
    });
    const mudMat = new THREE.MeshStandardMaterial({
        color:0x2c1a09, roughness:0.98, metalness:0.0
    });
    const rockMat = new THREE.MeshStandardMaterial({color:0x6b4c38, roughness:0.91, map: rockTex||null});

    // ① 外縁 (泥・岩盤帯)
    const rimM = new THREE.Mesh(makeOrgShape(baseR*1.42, 26, seed), rimMat);
    rimM.position.y=0.012; rimM.receiveShadow=true; g.add(rimM);

    // ② 泥スプラッターブロブ (縁に自然なランダム感)
    for (let mi=0; mi<5; mi++) {
        const ma = seed*0.041 + mi*1.26;
        const mr = oR(ma, baseR, seed) * (0.92 + 0.12*Math.sin(mi*4.3));
        const ms = baseR*(0.13 + 0.07*Math.sin(mi*7.1+seed*0.023));
        const mGeo = makeOrgShape(ms, 8, seed+mi*137);
        const mMesh = new THREE.Mesh(mGeo, mudMat);
        mMesh.position.set(Math.cos(ma)*mr, 0.020, Math.sin(ma)*mr);
        g.add(mMesh);
    }

    // ③ メイン原油面
    const oilM = new THREE.Mesh(makeOrgShape(baseR, 30, seed+50), oilMat);
    oilM.position.y=0.032; oilM.receiveShadow=true; g.add(oilM);

    // ④ サテライト小池 (メイン池の周囲に2〜3か所)
    [[seed*0.047+0.7, 0.58, 0.52],[seed*0.029+3.4, 0.65, 0.38]].forEach(([sa,sf,szf],si)=>{
        const sr = oR(sa, baseR, seed) * sf;
        const sx = Math.cos(sa)*sr, sz = Math.sin(sa)*sr;
        const satR = baseR * szf;
        const satRimM = new THREE.Mesh(makeOrgShape(satR*1.5, 14, seed+si*200), rimMat);
        satRimM.position.set(sx, 0.010, sz); g.add(satRimM);
        const satM = new THREE.Mesh(makeOrgShape(satR, 14, seed+si*200+60), oilMat);
        satM.position.set(sx, 0.032, sz); g.add(satM);
    });

    // ⑤ 岩 (縁に沿って決定論的に配置)
    for (let ri=0; ri<6; ri++) {
        const ra = seed*0.019 + ri*(Math.PI*2/6) + Math.sin(ri*2.1)*0.35;
        const rr = oR(ra, baseR, seed) * (1.06 + 0.08*Math.sin(ri*3.7));
        const rs = (0.28 + 0.13*(ri%3)) * scale;
        const rGeo = rockGeo || new THREE.DodecahedronGeometry(rs, 1);
        const rock = new THREE.Mesh(rGeo, rockMat);
        const rsc = rockGeo ? rs * 0.54 : 1;
        rock.scale.set(rsc, rsc, rsc);
        const ry = rockGeo ? 0.31*rsc : rs*0.5;
        rock.position.set(Math.cos(ra)*rr, ry, Math.sin(ra)*rr);
        rock.rotation.set(ri*1.4, ra*2.3, ri*0.8);
        rock.castShadow=true; g.add(rock);
    }

    scene.add(g);

    // グリッド登録 (oR関数と完全一致)
    const gR = Math.ceil(baseR * 1.5);
    for (let dx=-gR; dx<=gR; dx++) {
        for (let dz=-gR; dz<=gR; dz++) {
            const dist = Math.sqrt(dx*dx+dz*dz);
            const a = dist<0.01 ? 0 : Math.atan2(dz,dx);
            const oilEdge = oR(a, baseR, seed+50);
            const rimEdge = oR(a, baseR*1.42, seed);
            if (dist<=oilEdge)      gridSet(gcx+dx, gcz+dz, 'oilPool');
            else if (dist<=rimEdge) gridSet(gcx+dx, gcz+dz, 'oilRim');
        }
    }

    interactables.push({type:'oil', group:g, radius: baseR * 1.5});

    // 油田中心グリッドを登録
    const sgx = Math.round(gcx / GRID_SNAP);
    const sgz = Math.round(gcz / GRID_SNAP);
    oilSprings.push({ gx: sgx, gz: sgz, worldX: sgx * GRID_SNAP, worldZ: sgz * GRID_SNAP, pumpJackIdx: -1 });
}

function createDerrick(x,z) {

}

}

// ===== 商品展示倉庫 =====
function createShopDisplay(x, z, rotY=0) {
    const g = new THREE.Group(); g.position.set(x, 0, z);
    g.rotation.y = rotY;

    // ローカル座標 → ワールド座標変換
    const cosR = Math.cos(rotY), sinR = Math.sin(rotY);
    function wld(lx, lz) { return [x + lx*cosR + lz*sinR, z - lx*sinR + lz*cosR]; }

    const W=24, D=40, H=6;
    const hw=W/2, hd=D/2;

    // 床
    const floor = bx(W, 0.1, D, 0x9e9e9e, 0.93);
    floor.position.set(0, 0.05, 0); g.add(floor);

    // 奥壁
    const wBack = bx(W+0.5, H, 0.45, 0x546e7a, 0.75, 0.35);
    wBack.position.set(0, H/2, -hd); g.add(wBack);

    // 側壁 (入り口側 4m 開放)
    const sideLen = D - 4;
    const wL = bx(0.45, H, sideLen, 0x546e7a, 0.75, 0.35);
    wL.position.set(-hw, H/2, -hd + sideLen/2); g.add(wL);
    const wR = bx(0.45, H, sideLen, 0x546e7a, 0.75, 0.35);
    wR.position.set( hw, H/2, -hd + sideLen/2); g.add(wR);

    // 屋根
    const roofMain = bx(W+0.7, 0.4, D+0.7, 0x37474f, 0.55, 0.45);
    roofMain.position.set(0, H+0.2, 0); g.add(roofMain);

    // 入り口キャノピー (庇)
    const canopy = bx(W+0.7, 0.2, 5.5, 0x37474f, 0.55, 0.45);
    canopy.position.set(0, H-0.5, hd+2.5); g.add(canopy);

    // 支柱 6本 (前・中・後 × 左右)
    [[-hw+0.45, hd-0.45], [hw-0.45, hd-0.45],
     [-hw+0.45, 0],        [hw-0.45, 0],
     [-hw+0.45, -hd+0.45], [hw-0.45, -hd+0.45]].forEach(([cx,cz])=>{
        const col = bx(0.55, H+0.4, 0.55, 0x263238, 0.6, 0.5);
        col.position.set(cx, (H+0.4)/2, cz); g.add(col);
    });

    // 看板
    const sig  = bx(W-3, 1.5, 0.28, 0x1b5e20, 0.8);
    sig.position.set(0, H+1.05, hd-0.1); g.add(sig);
    const sigF = bx(W-4.2, 1.0, 0.09, 0xa5d6a7, 0.7);
    sigF.position.set(0, H+1.05, hd+0.06); g.add(sigF);

    scene.add(g);

    // コリジョン: 回転後のワールド座標で奥壁・左右壁を登録
    const [bwx,bwz] = wld(0, -hd);
    const [lwx,lwz] = wld(-hw, -hd+sideLen/2);
    const [rwx,rwz] = wld( hw, -hd+sideLen/2);
    const is90 = Math.abs(Math.abs(rotY) - Math.PI/2) < 0.01;
    if (is90) {
        // ±90°: 奥壁は z 方向に広がる、側壁は x 方向に広がる
        collisionBoxes.push({x:bwx, z:bwz, hw:0.35,      hd:hw});
        collisionBoxes.push({x:lwx, z:lwz, hw:sideLen/2,  hd:0.35});
        collisionBoxes.push({x:rwx, z:rwz, hw:sideLen/2,  hd:0.35});
    } else {
        // 0°/180°: 奥壁は x 方向に広がる、側壁は z 方向に広がる
        collisionBoxes.push({x:bwx, z:bwz, hw:hw,         hd:0.35});
        collisionBoxes.push({x:lwx, z:lwz, hw:0.35,        hd:sideLen/2});
        collisionBoxes.push({x:rwx, z:rwz, hw:0.35,        hd:sideLen/2});
    }

    // --- 商品台座 (3列 × 4行) ---
    const COLS = [-8, 0, 8];
    const ROWS = [+5, -3, -11, -19];

    const CATALOG = [
        {type:'ladle',         price:5,    col:0, row:0},
        {type:'jerryCan',      price:15,   col:1, row:0},
        {type:'drum',          price:120,  col:2, row:0},
        {type:'handPump',      price:20,   col:0, row:1},
        {type:'enginePump',    price:300,  col:1, row:1},
        {type:'pumpJack',      price:1800, col:2, row:1},
        {type:'storageTank',   price:800,  col:0, row:2},
        {type:'pipe',          price:10,   col:1, row:2},
        {type:'junctionT',     price:80,   col:2, row:2},
        {type:'junctionCross', price:150,  col:0, row:3},
        {type:'refinery',      price:REFINERY_PRICE, col:1, row:3},
    ];

    CATALOG.forEach(({type, price, col, row}) => {
        const lx = COLS[col], lz = ROWS[row];

        const ped = bx(1.8, 0.9, 1.8, 0x5d4037, 0.9);
        ped.position.set(lx, 0.45, lz); g.add(ped);
        const pedTop = bx(1.9, 0.06, 1.9, 0xd7ccc8, 0.82);
        pedTop.position.set(lx, 0.93, lz); g.add(pedTop);
        const plac = bx(1.0, 0.35, 0.09, 0xfff9c4, 0.7);
        plac.position.set(lx, 1.08, lz+0.95); g.add(plac);

        const baseY = 0.96;
        let m;
        if (type === 'ladle') {
            m = createLadleMesh(false); m.scale.setScalar(2.2);
            m.position.set(lx, baseY+0.22, lz); m.rotation.y = 0.4;
        } else if (type === 'handPump') {
            m = createHandPumpMesh(); m.scale.setScalar(0.78);
            m.position.set(lx, baseY, lz);
        } else if (type === 'drum') {
            m = createDrumMesh(0, null); m.scale.setScalar(1.6);
            m.position.set(lx, baseY+0.08, lz);
        } else if (type === 'enginePump') {
            m = createEnginePumpMesh(); m.scale.setScalar(0.75);
            m.position.set(lx, baseY, lz);
        } else if (type === 'pumpJack') {
            m = createPumpJackMesh().group; m.scale.setScalar(0.45);
            m.position.set(lx, baseY, lz);
        } else if (type === 'storageTank') {
            m = createStorageTankMesh(); m.scale.setScalar(0.38);
            m.position.set(lx, baseY, lz);
        } else if (type === 'pipe') {
            m = createPipeSegmentMesh('x'); m.scale.setScalar(0.55);
            m.position.set(lx, baseY+0.28, lz);
        } else if (type === 'junctionT') {
            m = createTJunctionMesh(); m.scale.setScalar(0.52);
            m.position.set(lx, baseY, lz);
        } else if (type === 'junctionCross') {
            m = createCrossJunctionMesh(); m.scale.setScalar(0.52);
            m.position.set(lx, baseY, lz);
        } else if (type === 'refinery') {
            m = createRefineryMesh().group; m.scale.setScalar(0.18);
            m.position.set(lx, baseY, lz);
        } else {
            m = createJerryCanMesh(0); m.scale.setScalar(2.0);
            m.position.set(lx, baseY+0.06, lz);
        }
        g.add(m);

        const idx = shopDisplayItems.length;
        m.traverse(child => { if (child.isMesh) shopMeshToIdx.set(child.uuid, idx); });
        // ドロップ位置: 入口の外 (回転考慮)
        const [dropX, dropZ] = wld(lx, hd+2);
        shopDisplayItems.push({ type, price, mesh:m, dropX, dropZ });
    });

    // --- リヤカー ---
    const cLX = COLS[1], cLZ = ROWS[1];
    const cartMark = bx(3.5, 0.06, 6.0, 0x8d6e63, 0.92);
    cartMark.position.set(cLX, 0.03, cLZ); g.add(cartMark);
    const [cartWX, cartWZ] = wld(cLX, cLZ);
    createHandcart(cartWX, cartWZ);
}

function createHandcart(x, z) {
    const g = new THREE.Group();
    const metalMat = new THREE.MeshStandardMaterial({color:0x607d8b,roughness:0.4,metalness:0.7});
    const woodMat  = new THREE.MeshStandardMaterial({color:0x8d6e63,roughness:0.85});
    const wheelMat = new THREE.MeshStandardMaterial({color:0x212121,roughness:0.8});
    const rimMat   = new THREE.MeshStandardMaterial({color:0x78909c,roughness:0.3,metalness:0.8});

    // 荷台床板
    const bed = new THREE.Mesh(new THREE.BoxGeometry(1.2,0.07,2.8), woodMat);
    bed.position.y=0.55; bed.castShadow=true; g.add(bed);

    // 荷台左右・前後サイド枠
    [[-0.62,0,0.04,2.82,0.18],[0.62,0,0.04,2.82,0.18],[0,-1.43,1.28,0.04,0.22],[0,1.43,1.28,0.04,0.22]].forEach(([ex,ez,ew,ed,eh])=>{
        const f = bx(ew,eh,ed,0x546e7a,0.4,0.6);
        f.position.set(ex,0.64,ez); g.add(f);
    });

    // 車輪 2個 (前方)
    for (const sx of [-0.68,0.68]) {
        const whl = new THREE.Mesh(new THREE.CylinderGeometry(0.36,0.36,0.10,20), wheelMat);
        whl.rotation.z=Math.PI/2; whl.position.set(sx,0.36,-1.2); whl.castShadow=true; g.add(whl);
        const rim = new THREE.Mesh(new THREE.TorusGeometry(0.36,0.04,8,20), rimMat);
        rim.rotation.x=Math.PI/2; rim.position.set(sx,0.36,-1.2); g.add(rim);
        const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.07,0.12,8), rimMat);
        hub.rotation.z=Math.PI/2; hub.position.set(sx,0.36,-1.2); g.add(hub);
    }
    // 車軸
    const axle = new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,1.5,8), metalMat);
    axle.rotation.z=Math.PI/2; axle.position.set(0,0.36,-1.2); g.add(axle);

    // フレーム下桁
    const fbl = bx(1.28,0.07,2.86,0x546e7a,0.4,0.6); fbl.position.set(0,0.37,0); g.add(fbl);

    // ハンドル支柱 (後方)
    for (const sx of [-0.5,0.5]) {
        const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,0.7,8), metalMat);
        pole.position.set(sx,0.93,1.4); g.add(pole);
    }
    // ハンドルバー
    const hbar = new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,1.1,8), metalMat);
    hbar.rotation.z=Math.PI/2; hbar.position.set(0,1.28,1.4); g.add(hbar);
    // ハンドルグリップ
    for (const sx of [-0.48,0.48]) {
        const grip = new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,0.18,8), new THREE.MeshStandardMaterial({color:0x212121,roughness:0.9}));
        grip.rotation.z=Math.PI/2; grip.position.set(sx,1.28,1.4); g.add(grip);
    }
    // 前足 (駐車支え)
    for (const sx of [-0.38,0.38]) {
        const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.035,0.55,8), metalMat);
        leg.position.set(sx,0.275,-1.47); g.add(leg);
    }

    g.position.set(x,0,z);
    scene.add(g);

    cartObj = {
        group: g, x, z, isHeld: false,
        purchased: false,
        slots: new Array(10).fill(null),
        cartItemMeshMap: new Map()
    };

    // 未購入なら商品として登録
    if (gameState.hasCart) {
        cartObj.purchased = true;
    } else {
        const idx = shopDisplayItems.length;
        g.traverse(m => { if(m.isMesh) shopMeshToIdx.set(m.uuid, idx); });
        shopDisplayItems.push({ type:'handcart', price:80, mesh:g, dropX:x, dropZ:z });
    }
}

function createHouse(x,z,wallColor,roofColor,rotation) {

    const W=6,H=3.5,D=5;
    const wall=bx(W,H,D,wallColor); wall.position.y=H/2; g.add(wall);
    const roofGeo=new THREE.ConeGeometry(4.5,2.2,4);
    const roof=new THREE.Mesh(roofGeo,new THREE.MeshStandardMaterial({color:roofColor,roughness:0.9}));
    roof.rotation.y=Math.PI/4;
    roof.scale.set(W/(4.5*Math.SQRT2),1,D/(4.5*Math.SQRT2));
    roof.position.y=H+1.1; roof.castShadow=true; g.add(roof);
    const door=bx(1.1,2.1,0.12,0x4e342e); door.position.set(0,1.05,D/2+0.06); g.add(door);
    [[-1.8,2.0],[1.8,2.0]].forEach(([wx,wy])=>{
        const win=bx(1.2,1.0,0.12,0x90caf9); win.position.set(wx,wy,D/2+0.06); g.add(win);
    });
    const chimney=new THREE.Mesh(
        new THREE.BoxGeometry(0.5,1.2,0.5),
        new THREE.MeshStandardMaterial({color:0x795548,roughness:0.9})
    );
    chimney.position.set(1.5,H+2.2+0.6,-1); chimney.castShadow=true; g.add(chimney);
    scene.add(g);
    const hw=rotation!==0?3.5:3.0, hd=rotation!==0?3.5:2.5;
    collisionBoxes.push({x,z,hw,hd});
}

     [-58,8,0.5],[-75,-18,0.8],[-40,30,0.7],

    // メイン道路南側 (z=-7): アームを道路側(+z北)に向ける → rotY=π

     [80,-7],[110,-7],[140,-7],[170,-7],[200,-7],[230,-7],[260,-7],[290,-7]].forEach(([x,z])=>createStreetLight(x,z,Math.PI));

    [[-45,-5],[-68,-20],[-85,0]].forEach(([x,z])=>createJunkPile(x,z));
}
function createRock(x,z,s) {
    const geo = rockGeo || new THREE.DodecahedronGeometry(s*0.55,1);
    const mat = new THREE.MeshStandardMaterial({color:0x7a5c48, roughness:0.9, map: rockTex||null});
    const m = new THREE.Mesh(geo, mat);
    const sc = rockGeo ? s*0.3 : 1;
    m.scale.set(sc,sc,sc);
    m.position.set(x, rockGeo ? 0.31*sc : s*0.27, z);
    m.rotation.set(Math.random()*2, Math.random()*2, Math.random()*2);
    m.castShadow=true; m.receiveShadow=true; scene.add(m);
}
function createStreetLight(x,z,rotY=0) {
    const g=new THREE.Group(); g.position.set(x,0,z); g.rotation.y=rotY;
    const pole=bx(0.1,4.5,0.1,0x9e9e9e,0.5,0.8); pole.position.y=2.25; g.add(pole);
    const arm=bx(0.08,0.08,0.8,0x9e9e9e,0.5,0.8); arm.position.set(0,4.5,-0.4); g.add(arm);
    const lamp=new THREE.Mesh(new THREE.SphereGeometry(0.18,8,6),
        new THREE.MeshStandardMaterial({color:0xffff88,emissive:0xffff00,emissiveIntensity:0.8}));
    lamp.position.set(0,4.5,-0.8); g.add(lamp);
    const light=new THREE.PointLight(0xffeeaa,0.6,18);
    light.position.set(0,4.4,-0.8); g.add(light); scene.add(g);
}
function createJunkPile(x,z) {
    const g=new THREE.Group(); g.position.set(x,0,z);
    const colors=[0x546e7a,0x37474f,0x455a64];
    for (let i=0; i<4; i++) {
        const junk=bx(0.5+Math.random()*0.8,0.4+Math.random()*0.6,0.4+Math.random()*0.8,colors[i%colors.length],0.8,0.4);
        junk.position.set((Math.random()-0.5)*2,0.3,(Math.random()-0.5)*2);
        junk.rotation.y=Math.random()*Math.PI; g.add(junk);
    }
    scene.add(g);
}
