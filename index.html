<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Oil Rush 3D</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #1a1a1a; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #fff; touch-action: none; }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        .interactive { pointer-events: auto; }
        /* Header */
        #header { position: absolute; top: 15px; left: 15px; right: 15px; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
        .stats-card { background: rgba(0,0,0,0.75); border: 1px solid rgba(255,255,255,0.2); backdrop-filter: blur(5px); padding: 12px 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .money-text { font-size: 24px; font-weight: bold; color: #4CAF50; }
        .inventory-text { font-size: 13px; color: #FFC107; margin-top: 4px; }
        .hint-text { font-size: 11px; color: rgba(255,255,255,0.5); margin-top: 3px; }
        .menu-buttons { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
        .btn { background: #2c3e50; color: white; border: 1px solid #34495e; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; transition: background 0.2s, transform 0.1s; }
        .btn:hover { background: #34495e; }
        .btn:active { transform: scale(0.95); }
        /* Notification */
        #notification { position: absolute; top: 80px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); color: #fff; padding: 10px 20px; border-radius: 20px; border: 1px solid #FFC107; font-weight: bold; pointer-events: none; opacity: 0; transition: opacity 0.3s; text-align: center; white-space: nowrap; z-index: 20; }
        /* Interaction prompt */
        #interaction-prompt { position: absolute; bottom: 108px; left: 50%; transform: translateX(-50%); background: rgba(46,204,113,0.92); color: #fff; padding: 8px 18px; border-radius: 12px; font-weight: bold; font-size: 14px; display: none; box-shadow: 0 0 10px rgba(46,204,113,0.5); white-space: nowrap; }
        /* Toolbar */
        #toolbar { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; pointer-events: auto; }
        .tslot { width: 68px; height: 68px; background: rgba(0,0,0,0.75); border: 2px solid rgba(255,255,255,0.28); border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; cursor: pointer; transition: border-color 0.15s, background 0.15s; }
        .tslot.active { border-color: #FFD700; background: rgba(255,215,0,0.15); box-shadow: 0 0 10px rgba(255,215,0,0.4); }
        .tslot:hover { background: rgba(255,255,255,0.08); }
        .tkey { position: absolute; top: 3px; left: 6px; font-size: 10px; color: rgba(255,255,255,0.5); }
        .ticon { font-size: 24px; line-height: 1; }
        .tlabel { font-size: 9px; color: rgba(255,255,255,0.75); margin-top: 2px; text-align: center; line-height: 1.2; }
        .tbadge { position: absolute; top: 3px; right: 5px; background: #e74c3c; color: white; font-size: 10px; font-weight: bold; border-radius: 9px; padding: 0 4px; min-width: 16px; text-align: center; }
        .toil { display: none; width: 10px; height: 10px; background: #030303; border-radius: 50%; position: absolute; bottom: 6px; right: 7px; }
        /* Touch controls */
        #touch-controls { display: none; position: absolute; bottom: 100px; left: 0; width: 100%; justify-content: space-between; align-items: flex-end; padding: 0 20px; pointer-events: none; }
        #joystick-zone { width: 110px; height: 110px; background: rgba(255,255,255,0.12); border: 2px solid rgba(255,255,255,0.3); border-radius: 55px; position: relative; touch-action: none; pointer-events: auto; }
        #joystick-knob { width: 46px; height: 46px; background: rgba(255,255,255,0.55); border-radius: 23px; position: absolute; top: 32px; left: 32px; pointer-events: none; }
        #action-button { width: 80px; height: 80px; background: rgba(230,126,34,0.85); border: 3px solid rgba(255,255,255,0.45); border-radius: 40px; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 13px; color: white; touch-action: manipulation; pointer-events: auto; text-align: center; }
        /* Modal */
        .modal { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 100; justify-content: center; align-items: center; pointer-events: auto; }
        .modal-content { background: #222; border: 1px solid #444; width: 90%; max-width: 500px; padding: 20px; border-radius: 8px; }
        .modal-header { font-size: 18px; font-weight: bold; margin-bottom: 15px; border-bottom: 1px solid #444; padding-bottom: 8px; }
        textarea { width: 100%; height: 120px; background: #111; color: #0f0; border: 1px solid #333; padding: 8px; font-family: monospace; resize: none; margin-bottom: 15px; border-radius: 4px; }
        .modal-buttons { display: flex; justify-content: flex-end; gap: 10px; }
        @media (pointer: coarse) { #touch-controls { display: flex; } }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<div id="canvas-container"></div>
<div id="ui-layer">
    <div id="header">
        <div class="stats-card">
            <div class="money-text" id="ui-money">$0</div>
            <div class="inventory-text" id="ui-inv">空缶: 3　満缶: 0</div>
            <div class="hint-text" id="ui-hint">← 西: 油田　東: 町 →</div>
        </div>
        <div class="menu-buttons interactive">
            <button class="btn" id="btn-lang" onclick="toggleLanguage()">English</button>
            <button class="btn" onclick="saveGame()">セーブ</button>
            <button class="btn" onclick="loadGame()">ロード</button>
            <button class="btn" onclick="openDataModal()">データ管理</button>
        </div>
    </div>
    <div id="notification"></div>
    <div id="interaction-prompt"></div>
    <div id="toolbar">
        <div class="tslot active" id="tslot-0" onclick="selectSlot(0)">
            <span class="tkey">1</span>
            <div class="ticon">🪣</div>
            <div class="tlabel" id="tlabel-0">ひしゃく</div>
            <div class="toil" id="toil-0"></div>
        </div>
        <div class="tslot" id="tslot-1" onclick="selectSlot(1)">
            <span class="tkey">2</span>
            <div class="ticon">🫙</div>
            <div class="tlabel" id="tlabel-1">空缶</div>
            <span class="tbadge" id="tbadge-1">3</span>
        </div>
        <div class="tslot" id="tslot-2" onclick="selectSlot(2)">
            <span class="tkey">3</span>
            <div class="ticon" style="color:rgba(255,255,255,0.2);font-size:18px">—</div>
        </div>
        <div class="tslot" id="tslot-3" onclick="selectSlot(3)">
            <span class="tkey">4</span>
            <div class="ticon" style="color:rgba(255,255,255,0.2);font-size:18px">—</div>
        </div>
    </div>
    <div id="touch-controls">
        <div id="joystick-zone"><div id="joystick-knob"></div></div>
        <div id="action-button" onclick="triggerAction()">ACT</div>
    </div>
</div>
<div id="data-modal" class="modal">
    <div class="modal-content">
        <div class="modal-header" id="modal-title">セーブデータ管理</div>
        <textarea id="data-textarea" placeholder="セーブデータを貼り付けるか、エクスポートに使用します..."></textarea>
        <div class="modal-buttons">
            <button class="btn" onclick="exportData()">エクスポート</button>
            <button class="btn" onclick="importData()">インポート</button>
            <button class="btn" onclick="closeDataModal()">閉じる</button>
        </div>
    </div>
</div>
<script>
// ===== I18N =====
const I18N = {
    ja: {
        money: "所持金: $",
        hintText: "← 西: 油田　東: 町 →",
        inv: (e, f) => `空缶: ${e}　手持ち満缶: ${f}`,
        promptScoop: "[SPACE] 原油を掬う (ひしゃく)",
        promptPour: (n) => `[SPACE] ジェリ缶に注ぐ (${n}/5)`,
        promptPickup: (n) => `[SPACE] ジェリ缶を回収 (${n}/5)`,
        promptSell: "[SPACE] 出荷場で売却",
        promptBuyCan: "[SPACE] 空ジェリ缶を購入 ($100)",
        promptPlace: "[SPACE] ここにジェリ缶を設置",
        ladleLabel: "ひしゃく", canLabel: "空缶",
        msgScooped: "原油を掬った！",
        msgPoured: (n) => `注いだ！ (${n}/5)`,
        msgFull: "ジェリ缶が満タン！ 回収しよう",
        msgPlaced: "ジェリ缶を設置した",
        msgPickedUp: (n) => `ジェリ缶を回収 (${n}/5)`,
        msgSold: (earn) => `売却完了！ +$${earn}`,
        msgNoCan: "空のジェリ缶がない！",
        msgNoOil: "ひしゃくに原油がない！",
        msgBadPlace: "ここには設置できない",
        msgBought: "ジェリ缶を購入！ (-$100)",
        msgNoMoney: "お金が足りない！",
        msgNoFilled: "手持ちの缶がない！",
        msgAutoSaved: "オートセーブ完了",
        msgDataSaved: "セーブ完了",
        msgDataLoaded: "ロード完了",
        msgImportOk: "インポート成功",
        msgImportFail: "無効なデータです",
        modalTitle: "セーブデータ管理"
    },
    en: {
        money: "Money: $",
        hintText: "← West: Oil Field　East: Town →",
        inv: (e, f) => `Empty cans: ${e}　Filled: ${f}`,
        promptScoop: "[SPACE] Scoop Oil (ladle)",
        promptPour: (n) => `[SPACE] Pour into can (${n}/5)`,
        promptPickup: (n) => `[SPACE] Pick up can (${n}/5)`,
        promptSell: "[SPACE] Sell at Depot",
        promptBuyCan: "[SPACE] Buy empty can ($100)",
        promptPlace: "[SPACE] Place Jerry Can here",
        ladleLabel: "Ladle", canLabel: "Empty Can",
        msgScooped: "Oil scooped!",
        msgPoured: (n) => `Poured! (${n}/5)`,
        msgFull: "Can is full! Pick it up",
        msgPlaced: "Jerry can placed",
        msgPickedUp: (n) => `Picked up can (${n}/5)`,
        msgSold: (earn) => `Sold! +$${earn}`,
        msgNoCan: "No empty jerry cans!",
        msgNoOil: "No oil in ladle!",
        msgBadPlace: "Can't place here",
        msgBought: "Bought jerry can! (-$100)",
        msgNoMoney: "Not enough money!",
        msgNoFilled: "No filled cans to sell!",
        msgAutoSaved: "Auto-saved",
        msgDataSaved: "Game saved",
        msgDataLoaded: "Game loaded",
        msgImportOk: "Import successful",
        msgImportFail: "Invalid data format",
        modalTitle: "Save Data Management"
    }
};

let currentLang = 'ja';

// ===== ゲーム状態 =====
let gameState = {
    money: 0,
    emptyCans: 3,
    filledCans: [],     // fill levels (1-5) in inventory
    savedCans: [],      // [{x,z,fill}] placed in world (persisted)
    playerPos: { x: -35, z: 0 },
    cameraYaw: 0, cameraPitch: 0
};

// ===== Three.js グローバル =====
let scene, camera, renderer, dirLight;
let playerGroup;
const interactables = [];
const collisionBoxes = [];

// ===== ツールバー/ひしゃく状態 =====
let activeSlot = 0;
let ladleHasOil = false;
let heldMesh = null;

// ===== 設置ジェリ缶 =====
const placedCans = []; // {group, fill, x, z}

// ===== ゴーストプレビュー =====
let ghostGroup = null;
let ghostMaterials = [];

// ===== カレントアクション =====
let currentAction = null;

// ===== テクスチャ生成 =====
function makeDesertTex() {
    const c = document.createElement('canvas');
    c.width = c.height = 512;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#8c6d46'; ctx.fillRect(0, 0, 512, 512);
    for (let i = 0; i < 40000; i++) {
        const x = Math.random()*512, y = Math.random()*512;
        const r = Math.random()*2+0.5, s = Math.floor(Math.random()*60)-30;
        ctx.fillStyle = `rgb(${140+s},${109+s},${70+s})`;
        ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
    }
    ctx.strokeStyle = 'rgba(60,40,20,0.15)'; ctx.lineWidth = 1.5;
    for (let i = 0; i < 30; i++) {
        ctx.beginPath();
        let cx = Math.random()*512, cy = Math.random()*512;
        ctx.moveTo(cx, cy);
        for (let j = 0; j < 5; j++) { cx += (Math.random()-0.5)*60; cy += (Math.random()-0.5)*60; ctx.lineTo(cx, cy); }
        ctx.stroke();
    }
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(20, 20);
    return t;
}

function makeAsphaltTex() {
    const c = document.createElement('canvas');
    c.width = c.height = 256;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#1a1a1a'; ctx.fillRect(0, 0, 256, 256);
    for (let i = 0; i < 5000; i++) {
        const x = Math.random()*256, y = Math.random()*256, s = Math.floor(Math.random()*20)-10;
        ctx.fillStyle = `rgb(${26+s},${26+s},${26+s})`; ctx.fillRect(x, y, 2, 2);
    }
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(4, 4);
    return t;
}

// ===== メッシュヘルパー =====
function bx(w, h, d, color, roughness=0.8, metalness=0.0) {
    const m = new THREE.Mesh(
        new THREE.BoxGeometry(w, h, d),
        new THREE.MeshStandardMaterial({ color, roughness, metalness })
    );
    m.castShadow = true; m.receiveShadow = true;
    return m;
}

// ===== ひしゃくメッシュ =====
function createLadleMesh(hasOil=false) {
    const g = new THREE.Group();
    const woodMat = new THREE.MeshStandardMaterial({ color: 0x6d4c41, roughness: 0.9 });
    const metalMat = new THREE.MeshStandardMaterial({ color: 0x9e9e9e, roughness: 0.3, metalness: 0.8 });

    // 柄
    const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.018, 0.75, 7), woodMat);
    handle.rotation.z = Math.PI / 2;
    handle.position.x = 0.3;
    handle.castShadow = true; g.add(handle);

    // お椀部分 (半球)
    const bowlOuter = new THREE.Mesh(
        new THREE.SphereGeometry(0.11, 10, 6, 0, Math.PI*2, 0, Math.PI/1.8),
        metalMat
    );
    bowlOuter.rotation.x = Math.PI;
    bowlOuter.position.set(-0.07, 0.02, 0);
    bowlOuter.castShadow = true; g.add(bowlOuter);

    const bowlInner = new THREE.Mesh(
        new THREE.SphereGeometry(0.096, 10, 6, 0, Math.PI*2, 0, Math.PI/1.8),
        new THREE.MeshStandardMaterial({ color: 0x777777, roughness: 0.4, metalness: 0.7, side: THREE.BackSide })
    );
    bowlInner.rotation.x = Math.PI;
    bowlInner.position.set(-0.07, 0.02, 0); g.add(bowlInner);

    // 原油 (掬ったとき)
    if (hasOil) {
        const oil = new THREE.Mesh(
            new THREE.CylinderGeometry(0.085, 0.085, 0.025, 10),
            new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 0.05, metalness: 0.95 })
        );
        oil.position.set(-0.07, -0.055, 0); g.add(oil);
    }
    return g;
}

// ===== ジェリ缶メッシュ =====
function createJerryCanMesh(fill=0, opacity=1.0) {
    const g = new THREE.Group();
    const transp = opacity < 1.0;
    const canColor = fill >= 5 ? 0x1a5c36 : (fill > 0 ? 0x2d7a4a : 0x546e7a);
    const bodyMat = new THREE.MeshStandardMaterial({ color: canColor, roughness: 0.45, metalness: 0.55, transparent: transp, opacity });
    const metalMat = new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.35, metalness: 0.7, transparent: transp, opacity });
    const darkMat  = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.4, metalness: 0.5, transparent: transp, opacity });

    // 本体
    const body = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.56, 0.22), bodyMat);
    body.castShadow = true; body.receiveShadow = true; g.add(body);

    // 上部リブ
    const top = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.07, 0.20), metalMat);
    top.position.y = 0.315; g.add(top);

    // 注ぎ口
    const spout = new THREE.Mesh(new THREE.CylinderGeometry(0.038, 0.038, 0.09, 8), metalMat);
    spout.position.set(-0.09, 0.395, 0); g.add(spout);
    const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.03, 8), darkMat);
    cap.position.set(-0.09, 0.445, 0); g.add(cap);

    // 取っ手
    const handleBar = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.045, 0.045), darkMat);
    handleBar.position.set(0, 0.34, 0); g.add(handleBar);
    [-0.15, 0.15].forEach(ox => {
        const post = new THREE.Mesh(new THREE.BoxGeometry(0.045, 0.12, 0.045), darkMat);
        post.position.set(ox, 0.325, 0); g.add(post);
    });

    // 縦リブ (装飾)
    [-0.08, 0.08].forEach(ox => {
        const rib = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.44, 0.24), metalMat);
        rib.position.set(ox, -0.02, 0); g.add(rib);
    });

    // 中身 (fill > 0 で黒い液体を見せる)
    if (fill > 0) {
        const fh = (fill / 5) * 0.44;
        const oilMat = new THREE.MeshStandardMaterial({ color: 0x080808, roughness: 0.05, metalness: 0.9, transparent: transp, opacity: opacity * 0.95 });
        const oilFill = new THREE.Mesh(new THREE.BoxGeometry(0.30, fh, 0.16), oilMat);
        oilFill.position.y = fh / 2 - 0.26; g.add(oilFill);
    }
    return g;
}

// ===== ゴーストプレビュー初期化 =====
function initGhost() {
    ghostGroup = new THREE.Group();
    ghostMaterials = [];
    const tempCan = createJerryCanMesh(0, 0.48);
    tempCan.traverse(m => {
        if (m.isMesh) { ghostMaterials.push(m.material); }
    });
    ghostGroup.add(tempCan);
    ghostGroup.visible = false;
    scene.add(ghostGroup);
}

function updateGhost() {
    if (activeSlot !== 1 || gameState.emptyCans <= 0) {
        ghostGroup.visible = false;
        return;
    }
    const { x: gx, z: gz } = getPlacementPos();
    ghostGroup.position.set(gx, 0, gz);
    ghostGroup.visible = true;
    const valid = isValidPlacement(gx, gz);
    const color = valid ? 0x00ff88 : 0xff2200;
    ghostMaterials.forEach(m => m.color.set(color));
}

function getPlacementPos() {
    const dist = 2.4;
    const fwdX = -Math.sin(gameState.cameraYaw);
    const fwdZ = -Math.cos(gameState.cameraYaw);
    return { x: playerGroup.position.x + fwdX * dist, z: playerGroup.position.z + fwdZ * dist };
}

function isValidPlacement(x, z) {
    if (x < -190 || x > 190 || z < -190 || z > 190) return false;
    for (const b of collisionBoxes) {
        if (x > b.x - b.hw - 0.3 && x < b.x + b.hw + 0.3 && z > b.z - b.hd - 0.3 && z < b.z + b.hd + 0.3) return false;
    }
    for (const c of placedCans) {
        if (Math.hypot(x - c.x, z - c.z) < 1.2) return false;
    }
    return true;
}

// ===== 設置ジェリ缶の生成/削除 =====
function spawnPlacedCan(x, z, fill) {
    const g = createJerryCanMesh(fill);
    g.position.set(x, 0, z);
    g.scale.setScalar(1.2);
    scene.add(g);
    const entry = { group: g, fill, x, z };
    placedCans.push(entry);
    gameState.savedCans.push({ x, z, fill });
    return entry;
}

function removePlacedCan(idx) {
    const entry = placedCans[idx];
    scene.remove(entry.group);
    placedCans.splice(idx, 1);
    gameState.savedCans.splice(idx, 1);
}

function refreshPlacedCanMesh(idx) {
    const entry = placedCans[idx];
    entry.group.remove(...entry.group.children);
    const newMesh = createJerryCanMesh(entry.fill);
    newMesh.traverse(m => { if (m.isMesh) entry.group.add(m.clone()); });
    // Simpler: replace group entirely
    scene.remove(entry.group);
    const g = createJerryCanMesh(entry.fill);
    g.position.set(entry.x, 0, entry.z);
    g.scale.setScalar(1.2);
    scene.add(g);
    entry.group = g;
    if (gameState.savedCans[idx]) gameState.savedCans[idx].fill = entry.fill;
}

// ===== 手持ちアイテム更新 =====
function updateHeldMesh() {
    if (heldMesh) { camera.remove(heldMesh); heldMesh = null; }
    if (activeSlot === 0) {
        heldMesh = createLadleMesh(ladleHasOil);
        heldMesh.position.set(0.28, -0.26, -0.52);
        heldMesh.rotation.set(0.05, Math.PI / 2 + 0.1, 0.12);
        heldMesh.scale.setScalar(1.0);
    } else if (activeSlot === 1 && gameState.emptyCans > 0) {
        heldMesh = createJerryCanMesh(0);
        heldMesh.position.set(0.22, -0.32, -0.50);
        heldMesh.rotation.set(0.08, -0.25, 0.06);
        heldMesh.scale.setScalar(0.65);
    }
    if (heldMesh) camera.add(heldMesh);
}

// ===== Three.js 初期化 =====
function initThree() {
    const container = document.getElementById('canvas-container');
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x3a2e2b);
    scene.fog = new THREE.FogExp2(0x3a2e2b, 0.006);

    camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 1000);
    camera.rotation.order = 'YXZ';

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffdfb3, 0.5));
    dirLight = new THREE.DirectionalLight(0xffbe76, 1.0);
    dirLight.castShadow = true;

// ===== 衝突判定 =====
function checkCollision(x, z) {
    const pr = 0.45;
    if (x < -195 || x > 195 || z < -195 || z > 195) return true;
    for (const b of collisionBoxes) {
        if (x + pr > b.x - b.hw && x - pr < b.x + b.hw &&
            z + pr > b.z - b.hd && z - pr < b.z + b.hd) return true;
    }
    return false;
}

let joystickActive=false, joystickTouchId=null, joystickVector={x:0,y:0};
let lookTouchId=null, lastTouchPos={x:0,y:0}, isMouseDown=false;
const joystickZone = document.getElementById('joystick-zone');
const joystickKnob = document.getElementById('joystick-knob');

window.addEventListener('touchstart', e => {
    for (let i=0; i<e.changedTouches.length; i++) {
        const t = e.changedTouches[i];
        const r = joystickZone.getBoundingClientRect();
        if (t.clientX>=r.left && t.clientX<=r.right && t.clientY>=r.top && t.clientY<=r.bottom) {
            if (joystickTouchId===null) { joystickTouchId=t.identifier; joystickActive=true; updateJoystick(t); }
        } else if (t.clientX > innerWidth/3 && lookTouchId===null) {
            lookTouchId=t.identifier; lastTouchPos.x=t.clientX; lastTouchPos.y=t.clientY;
        }
    }
}, {passive:false});

window.addEventListener('touchmove', e => {
    for (let i=0; i<e.changedTouches.length; i++) {
        const t = e.changedTouches[i];
        if (t.identifier===joystickTouchId) { updateJoystick(t); }
        else if (t.identifier===lookTouchId) {
            gameState.cameraYaw  -= (t.clientX - lastTouchPos.x) * 0.005;
            gameState.cameraPitch -= (t.clientY - lastTouchPos.y) * 0.005;
            gameState.cameraPitch = Math.max(-Math.PI/2.2, Math.min(Math.PI/2.2, gameState.cameraPitch));
            lastTouchPos.x=t.clientX; lastTouchPos.y=t.clientY;
        }
    }
}, {passive:false});

window.addEventListener('touchend', e => {
    for (let i=0; i<e.changedTouches.length; i++) {
        const t = e.changedTouches[i];
        if (t.identifier===joystickTouchId) {
            joystickTouchId=null; joystickActive=false; joystickVector={x:0,y:0};
            joystickKnob.style.top='32px'; joystickKnob.style.left='32px';
        } else if (t.identifier===lookTouchId) { lookTouchId=null; }
    }
});

window.addEventListener('mousedown', e => {
    if (e.target.closest('.interactive')||e.target.closest('.modal')||e.target.closest('#toolbar')) return;
    isMouseDown=true; lastTouchPos.x=e.clientX; lastTouchPos.y=e.clientY;
});
window.addEventListener('mousemove', e => {
    if (!isMouseDown) return;
    gameState.cameraYaw  -= (e.clientX - lastTouchPos.x) * 0.003;
    gameState.cameraPitch -= (e.clientY - lastTouchPos.y) * 0.003;
    gameState.cameraPitch = Math.max(-Math.PI/2.2, Math.min(Math.PI/2.2, gameState.cameraPitch));
    lastTouchPos.x=e.clientX; lastTouchPos.y=e.clientY;
});
window.addEventListener('mouseup', () => { isMouseDown=false; });

function updateJoystick(touch) {
    const r = joystickZone.getBoundingClientRect();
    let dx = touch.clientX - (r.left + r.width/2);
    let dy = touch.clientY - (r.top + r.height/2);
    const maxR=40, dist=Math.hypot(dx,dy);
    if (dist>maxR) { dx=dx/dist*maxR; dy=dy/dist*maxR; }
    joystickKnob.style.left=`${32+dx}px`; joystickKnob.style.top=`${32+dy}px`;
    joystickVector.x=dx/maxR; joystickVector.y=dy/maxR;
}

    // Slot 1: empty can
    document.getElementById('tlabel-1').innerText = L.canLabel;
    const badge = document.getElementById('tbadge-1');
    badge.innerText = gameState.emptyCans;
    badge.style.display = gameState.emptyCans > 0 ? 'inline' : 'none';
}

// ===== アクション検出 =====
function computeCurrentAction() {
    const px = playerGroup.position.x, pz = playerGroup.position.z;
    const L = I18N[currentLang];

    // 最近傍設置缶
    let nearCan = null, nearCanIdx = -1, nearCanDist = 2.5;
    for (let i = 0; i < placedCans.length; i++) {
        const c = placedCans[i];
        const d = Math.hypot(px - c.x, pz - c.z);
        if (d < nearCanDist) { nearCanDist = d; nearCan = c; nearCanIdx = i; }
    }

    // 最近傍油溜まり
    let nearOil = null;
    for (const it of interactables) {
        if (it.type !== 'oil') continue;
        const d = Math.hypot(px - it.group.position.x, pz - it.group.position.z);
        if (d < it.radius) { nearOil = it; break; }
    }

    // 最近傍出荷場
    let nearDepot = null;
    for (const it of interactables) {
        if (it.type !== 'depot') continue;
        const d = Math.hypot(px - it.group.position.x, pz - it.group.position.z);
        if (d < it.radius) { nearDepot = it; break; }
    }

    // 最近傍道具屋
    let nearShop = null;
    for (const it of interactables) {
        if (it.type !== 'shop') continue;
        const d = Math.hypot(px - it.group.position.x, pz - it.group.position.z);
        if (d < it.radius) { nearShop = it; break; }
    }

    // ひしゃく選択中
    if (activeSlot === 0) {
        // 油溜まり近く + ひしゃくに油なし → 掬う
        if (nearOil && !ladleHasOil) {
            return { type: 'scoop', label: L.promptScoop };
        }
        // 設置缶近く + ひしゃくに油あり + 缶が満タンでない → 注ぐ
        if (nearCan && ladleHasOil && nearCan.fill < 5) {
            return { type: 'pour', label: L.promptPour(nearCan.fill), canIdx: nearCanIdx };
        }
        // 設置缶近く → 回収
        if (nearCan) {
            return { type: 'pickup', label: L.promptPickup(nearCan.fill), canIdx: nearCanIdx };
        }
    }

    // 空缶選択中 → 設置
    if (activeSlot === 1 && gameState.emptyCans > 0) {
        return { type: 'place', label: L.promptPlace };
    }

    // どのスロットでも設置缶回収可能
    if (nearCan) {
        return { type: 'pickup', label: L.promptPickup(nearCan.fill), canIdx: nearCanIdx };
    }

    // 出荷場 → 売却
    if (nearDepot && gameState.filledCans.length > 0) {
        const earn = gameState.filledCans.reduce((s, f) => s + canPrice(f), 0);
        return { type: 'sell', label: L.promptSell + ` (+$${earn})` };
    }

    // 道具屋 → 購入
    if (nearShop) {
        return { type: 'buyCan', label: L.promptBuyCan };
    }

    return null;
}

function canPrice(fill) {
    if (fill <= 0) return 0;
    if (fill >= 5) return 175;
    return fill * 25;
}

// ===== アクション実行 =====
function triggerAction() {
    if (!currentAction) return;
    const L = I18N[currentLang];
    switch (currentAction.type) {
        case 'scoop':   doScoop(); break;
        case 'pour':    doPour(currentAction.canIdx); break;
        case 'pickup':  doPickup(currentAction.canIdx); break;
        case 'place':   doPlace(); break;
        case 'sell':    doSell(); break;
        case 'buyCan':  doBuyCan(); break;
    }
}

function doScoop() {
    ladleHasOil = true;
    updateHeldMesh();
    updateToolbarUI();
    showNotification(I18N[currentLang].msgScooped);
}

function doPour(canIdx) {
    if (canIdx < 0 || canIdx >= placedCans.length) return;
    const can = placedCans[canIdx];
    can.fill++;
    ladleHasOil = false;
    refreshPlacedCanMesh(canIdx);
    gameState.savedCans[canIdx] = { x: can.x, z: can.z, fill: can.fill };
    updateHeldMesh();
    updateToolbarUI();
    if (can.fill >= 5) {
        showNotification(I18N[currentLang].msgFull);
    } else {
        showNotification(I18N[currentLang].msgPoured(can.fill));
    }
}

function doPickup(canIdx) {
    if (canIdx < 0 || canIdx >= placedCans.length) return;
    const fill = placedCans[canIdx].fill;
    gameState.filledCans.push(fill);
    removePlacedCan(canIdx);
    updateUI();
    showNotification(I18N[currentLang].msgPickedUp(fill));
}

function doPlace() {
    if (gameState.emptyCans <= 0) { showNotification(I18N[currentLang].msgNoCan); return; }
    const { x: gx, z: gz } = getPlacementPos();
    if (!isValidPlacement(gx, gz)) { showNotification(I18N[currentLang].msgBadPlace); return; }
    gameState.emptyCans--;
    spawnPlacedCan(gx, gz, 0);
    updateUI();
    updateToolbarUI();
    if (gameState.emptyCans <= 0) updateHeldMesh();
    showNotification(I18N[currentLang].msgPlaced);
}

function doSell() {
    if (gameState.filledCans.length === 0) { showNotification(I18N[currentLang].msgNoFilled); return; }
    const earn = gameState.filledCans.reduce((s, f) => s + canPrice(f), 0);
    gameState.money += earn;
    gameState.filledCans = [];
    updateUI();
    showNotification(I18N[currentLang].msgSold(earn));
}

function doBuyCan() {
    if (gameState.money < 100) { showNotification(I18N[currentLang].msgNoMoney); return; }
    gameState.money -= 100;
    gameState.emptyCans++;
    updateUI();
    updateToolbarUI();
    showNotification(I18N[currentLang].msgBought);
}

// ===== ゲームループ =====
let lastTime = performance.now();
let autoSaveTimer = 0;

function updateGame() {
    try {
        const now = performance.now();
        const delta = Math.min((now - lastTime) / 1000, 0.1);
        lastTime = now;

        // 移動
        let ix = 0, iz = 0;
        if (keys.w) iz -= 1; if (keys.s) iz += 1;
        if (keys.a) ix -= 1; if (keys.d) ix += 1;
        if (joystickActive) { ix = joystickVector.x; iz = joystickVector.y; }

        const ml = Math.hypot(ix, iz);
        if (ml > 0.1) {
            const spd = 8.0 * delta;
            const nx = ix / Math.max(1, ml), nz = iz / Math.max(1, ml);
            const sy = Math.sin(gameState.cameraYaw), cy = Math.cos(gameState.cameraYaw);
            const vx = (nx * cy + nz * sy) * spd;
            const vz = (-nx * sy + nz * cy) * spd;
            const px = playerGroup.position.x, pz = playerGroup.position.z;
            if (!checkCollision(px + vx, pz))                      playerGroup.position.x = px + vx;
            if (!checkCollision(playerGroup.position.x, pz + vz))  playerGroup.position.z = pz + vz;
        }

        playerGroup.rotation.y = gameState.cameraYaw;
        camera.position.set(playerGroup.position.x, 1.45, playerGroup.position.z);
        camera.rotation.y = gameState.cameraYaw;
        camera.rotation.x = gameState.cameraPitch;

        // 影をプレイヤーに追従
        dirLight.position.set(playerGroup.position.x + 30, 40, playerGroup.position.z + 20);
        dirLight.target.position.copy(playerGroup.position);
        dirLight.target.updateMatrixWorld();

        // ゴースト更新
        updateGhost();

        // アクション検出
        currentAction = computeCurrentAction();
        const prompt = document.getElementById('interaction-prompt');
        if (currentAction) {
            prompt.style.display = 'block';
            prompt.innerText = currentAction.label;
        } else {
            prompt.style.display = 'none';
        }

        autoSaveTimer += delta;
        if (autoSaveTimer >= 10) { autoSaveTimer = 0; saveGame(true); }

        renderer.render(scene, camera);
    } catch(err) { console.error('Loop error:', err); }
    requestAnimationFrame(updateGame);
}

// ===== UI 更新 =====
function updateUI() {
    const L = I18N[currentLang];
    document.getElementById('ui-money').innerText = L.money + gameState.money;
    document.getElementById('ui-inv').innerText = L.inv(gameState.emptyCans, gameState.filledCans.length);
    document.getElementById('ui-hint').innerText = L.hintText;
    document.getElementById('btn-lang').innerText = currentLang === 'ja' ? 'English' : '日本語';
    updateToolbarUI();
}

function toggleLanguage() {
    currentLang = currentLang === 'ja' ? 'en' : 'ja';
    document.getElementById('btn-lang').innerText = currentLang === 'ja' ? 'English' : '日本語';
    updateUI();
}

function showNotification(msg) {
    const el = document.getElementById('notification');
    el.innerText = msg; el.style.opacity = '1';
    setTimeout(() => { el.style.opacity = '0'; }, 2500);
}

// ===== セーブ / ロード =====
function saveGame(isAuto = false) {
    gameState.playerPos.x = playerGroup.position.x;
    gameState.playerPos.z = playerGroup.position.z;
    gameState.savedCans = placedCans.map(c => ({ x: c.x, z: c.z, fill: c.fill }));
    localStorage.setItem('oil_rush_save', JSON.stringify(gameState));
    showNotification(isAuto ? I18N[currentLang].msgAutoSaved : I18N[currentLang].msgDataSaved);
}

function loadGame() {
    const data = localStorage.getItem('oil_rush_save');
    if (!data) return;
    try {
        const saved = JSON.parse(data);
        if (typeof saved.money !== 'number') throw new Error('bad data');
        // migrate old barrel saves
        if (saved.barrels !== undefined) {
            saved.emptyCans = saved.maxBarrels || 3;
            saved.filledCans = [];
            saved.savedCans = [];
            delete saved.barrels; delete saved.maxBarrels;
        }
        if (!Array.isArray(saved.filledCans)) saved.filledCans = [];
        if (!Array.isArray(saved.savedCans))  saved.savedCans = [];
        if (saved.emptyCans === undefined) saved.emptyCans = 3;
        if (saved.cameraYaw === undefined) saved.cameraYaw = 0;
        if (saved.cameraPitch === undefined) saved.cameraPitch = 0;
        Object.assign(gameState, saved);
        if (playerGroup) playerGroup.position.set(gameState.playerPos.x, 0, gameState.playerPos.z);
        // 設置缶を復元
        while (placedCans.length > 0) {
            scene.remove(placedCans[0].group);
            placedCans.splice(0, 1);
        }
        gameState.savedCans.forEach(sc => {
            const g = createJerryCanMesh(sc.fill);
            g.position.set(sc.x, 0, sc.z);
            g.scale.setScalar(1.2);
            scene.add(g);
            placedCans.push({ group: g, fill: sc.fill, x: sc.x, z: sc.z });
        });
        updateUI();
        updateHeldMesh();
        showNotification(I18N[currentLang].msgDataLoaded);
    } catch(e) { console.error(e); }
}

function openDataModal() {
    document.getElementById('data-modal').style.display = 'flex';
    document.getElementById('modal-title').innerText = I18N[currentLang].modalTitle;
    document.getElementById('data-textarea').value = '';
}
function closeDataModal() { document.getElementById('data-modal').style.display = 'none'; }

function exportData() {
    gameState.playerPos.x = playerGroup.position.x;
    gameState.playerPos.z = playerGroup.position.z;
    gameState.savedCans = placedCans.map(c => ({ x: c.x, z: c.z, fill: c.fill }));
    document.getElementById('data-textarea').value = btoa(JSON.stringify(gameState));
}

function importData() {
    const text = document.getElementById('data-textarea').value.trim();
    try {
        const json = JSON.parse(atob(text));
        if (typeof json.money !== 'number') throw new Error();
        Object.assign(gameState, json);
        if (!Array.isArray(gameState.filledCans)) gameState.filledCans = [];
        if (!Array.isArray(gameState.savedCans))  gameState.savedCans = [];
        if (gameState.cameraYaw === undefined) gameState.cameraYaw = 0;
        if (gameState.cameraPitch === undefined) gameState.cameraPitch = 0;
        playerGroup.position.set(gameState.playerPos.x, 0, gameState.playerPos.z);
        while (placedCans.length > 0) { scene.remove(placedCans[0].group); placedCans.splice(0, 1); }
        gameState.savedCans.forEach(sc => {
            const g = createJerryCanMesh(sc.fill);
            g.position.set(sc.x, 0, sc.z); g.scale.setScalar(1.2);
            scene.add(g);
            placedCans.push({ group: g, fill: sc.fill, x: sc.x, z: sc.z });
        });
        updateUI(); updateHeldMesh(); saveGame(); closeDataModal();
        showNotification(I18N[currentLang].msgImportOk);
    } catch(e) { alert(I18N[currentLang].msgImportFail); }
}

// ===== 初期化 =====
window.addEventListener('DOMContentLoaded', () => {
    initThree();
    loadGame();
    updateUI();
    updateHeldMesh();
    requestAnimationFrame(updateGame);
});
</script>
