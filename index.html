// ===== ゲームループ =====
let lastTime=performance.now(), autoSaveTimer=0;

function updateGame() {
    try {
        const now=performance.now();
        const delta=Math.min((now-lastTime)/1000, 0.1);
        lastTime=now;

        // ===== 移動 (運転中/徒歩) =====
        if (towVehicle && towVehicle.inVehicle) {
            // 車両操作
            if (keys.a||(joystickActive&&joystickVector.x<-0.2)) towVehicle.rot+=VEHICLE_TURN_SPEED*delta;
            if (keys.d||(joystickActive&&joystickVector.x>0.2))  towVehicle.rot-=VEHICLE_TURN_SPEED*delta;
            let vspd=0;
            if (keys.w) vspd=VEHICLE_SPEED;
            if (keys.s) vspd=-VEHICLE_SPEED*0.5;
            if (joystickActive) vspd=-joystickVector.y*VEHICLE_SPEED;
            if (vspd!==0) {
                const nx2=towVehicle.x-Math.sin(towVehicle.rot)*vspd*delta;
                const nz2=towVehicle.z-Math.cos(towVehicle.rot)*vspd*delta;
                if (!checkCollision(nx2,nz2)) { towVehicle.x=nx2; towVehicle.z=nz2; }
            }
            towVehicle.group.position.set(towVehicle.x,0,towVehicle.z);
            towVehicle.group.rotation.y=towVehicle.rot;
            // カメラ: キャビン内FPS
            playerGroup.position.set(towVehicle.x,0,towVehicle.z);
            camera.position.set(
                towVehicle.x-Math.sin(towVehicle.rot)*0.6,
                2.2,
                towVehicle.z-Math.cos(towVehicle.rot)*0.6
            );
            // 牽引タンク追従
            if (towVehicle.hitchedTankIdx>=0) {
                const tt=towTanks[towVehicle.hitchedTankIdx];
                if (tt) {
                    tt.x=towVehicle.x+Math.sin(towVehicle.rot)*5.2;
                    tt.z=towVehicle.z+Math.cos(towVehicle.rot)*5.2;
                    tt.group.position.set(tt.x,0,tt.z);
                    tt.group.rotation.y=towVehicle.rot;
                }
            }
        } else {
            let ix=0,iz=0;
            if (keys.w) iz-=1; if (keys.s) iz+=1;
            if (keys.a) ix-=1; if (keys.d) ix+=1;
            if (joystickActive) { ix=joystickVector.x; iz=joystickVector.y; }

            const ml=Math.hypot(ix,iz);
            if (ml>0.1) {
                const spd=8.0*delta;
                const nx=ix/Math.max(1,ml), nz=iz/Math.max(1,ml);
                const sy=Math.sin(gameState.cameraYaw), cy=Math.cos(gameState.cameraYaw);
                const vx=(nx*cy+nz*sy)*spd, vz=(-nx*sy+nz*cy)*spd;
                const px2=playerGroup.position.x, pz2=playerGroup.position.z;
                if (!checkCollision(px2+vx,pz2))                      playerGroup.position.x=px2+vx;
                if (!checkCollision(playerGroup.position.x,pz2+vz))   playerGroup.position.z=pz2+vz;
            }
        }

        // ホース距離制限（エンジンノズル保持中）
        if (heldItem && heldItem.type==='engineNozzle') {
            const ep=enginePumpObjs[heldItem.pumpIdx];
            if (ep) {
                const hx=playerGroup.position.x-ep.x, hz=playerGroup.position.z-ep.z;
                const hd=Math.hypot(hx,hz);
                if (hd>ENGINE_HOSE_LENGTH) {
                    playerGroup.position.x=ep.x+hx/hd*ENGINE_HOSE_LENGTH;
                    playerGroup.position.z=ep.z+hz/hd*ENGINE_HOSE_LENGTH;
                }
            }
        }

        // ホース距離制限（ガスノズル保持中）
        if (heldItem && heldItem.type==='gasNozzle') {
            const gs=gasStationObjs[heldItem.stationIdx];
            if (gs) {
                const hx=playerGroup.position.x-gs.x, hz=playerGroup.position.z-gs.z;
                const hd=Math.hypot(hx,hz);
                if (hd>GAS_HOSE_LENGTH) {
                    playerGroup.position.x=gs.x+hx/hd*GAS_HOSE_LENGTH;
                    playerGroup.position.z=gs.z+hz/hd*GAS_HOSE_LENGTH;
                }
            }
        }

        playerGroup.rotation.y=gameState.cameraYaw;
        if (!(towVehicle&&towVehicle.inVehicle)) {
            camera.position.set(playerGroup.position.x,1.45,playerGroup.position.z);
        }
        camera.rotation.y=gameState.cameraYaw;
        camera.rotation.x=gameState.cameraPitch;

        dirLight.position.set(playerGroup.position.x+30,40,playerGroup.position.z+20);
        dirLight.target.position.copy(playerGroup.position);
        dirLight.target.updateMatrixWorld();

        // カート追従
        if (cartObj && cartObj.isHeld) {
            const sy=Math.sin(gameState.cameraYaw), cy=Math.cos(gameState.cameraYaw);
            cartObj.x = playerGroup.position.x + sy*1.8;
            cartObj.z = playerGroup.position.z + cy*1.8;
            cartObj.group.position.set(cartObj.x, 0, cartObj.z);
            cartObj.group.rotation.y = gameState.cameraYaw + Math.PI;
        }

        // レイキャスト：ワールドアイテム + カートアイテム
        raycaster.setFromCamera({x:0,y:0}, camera);
        const itemMeshes = [];
        const meshToIdx = new Map();
        worldItems.forEach((item,idx)=>{
            item.group.traverse(m=>{ if(m.isMesh){itemMeshes.push(m);meshToIdx.set(m.uuid,idx);} });
        });
        const hits = raycaster.intersectObjects(itemMeshes, false);
        raycastTargetIdx = (hits.length>0) ? (meshToIdx.get(hits[0].object.uuid)??-1) : -1;

        // カートアイテムレイキャスト
        raycastCartSlotIdx = -1;
        if (cartObj && cartObj.cartItemMeshMap.size>0) {
            const cartMeshes = [];
            cartObj.group.traverse(m=>{ if(m.isMesh && cartObj.cartItemMeshMap.has(m.uuid)) cartMeshes.push(m); });
            const cartHits = raycaster.intersectObjects(cartMeshes, false);
            if (cartHits.length>0) {
                const slot = cartObj.cartItemMeshMap.get(cartHits[0].object.uuid);
                if (slot!==undefined) raycastCartSlotIdx = slot;
            }
        }

        // ショップ展示品レイキャスト
        raycastShopItemIdx = -1;
        if (shopDisplayItems.length > 0) {
            const shopMeshes = [];
            shopDisplayItems.forEach(si => { si.mesh.traverse(m=>{ if(m.isMesh) shopMeshes.push(m); }); });
            const shopHits = raycaster.intersectObjects(shopMeshes, false);
            if (shopHits.length > 0) {
                const idx = shopMeshToIdx.get(shopHits[0].object.uuid);
                if (idx !== undefined) raycastShopItemIdx = idx;
            }
        }

        // 設置済みポンプレイキャスト
        raycastPumpIdx = -1;
        if (pumpObjs.length > 0) {
            const pumpMeshes = [];
            pumpObjs.forEach(po => { po.group.traverse(m=>{ if(m.isMesh) pumpMeshes.push(m); }); });
            const pumpHits = raycaster.intersectObjects(pumpMeshes, false);
            if (pumpHits.length > 0) {
                const idx = pumpMeshToIdx.get(pumpHits[0].object.uuid);
                if (idx !== undefined) raycastPumpIdx = idx;
            }
        }

        // エンジンポンプレイキャスト（ノズル非保持時のみ）
        raycastEnginePumpIdx = -1;
        if (enginePumpObjs.length > 0 && !(heldItem && heldItem.type==='engineNozzle')) {
            const epMeshes = [];
            enginePumpObjs.forEach(ep => { ep.group.traverse(m=>{ if(m.isMesh) epMeshes.push(m); }); });
            const epHits = raycaster.intersectObjects(epMeshes, false);
            if (epHits.length > 0) {
                const idx = enginePumpMeshToIdx.get(epHits[0].object.uuid);
                if (idx !== undefined) raycastEnginePumpIdx = idx;
            }
        }

        // ガソリンスタンドノズルレイキャスト（ガスノズル非保持時のみ）
        raycastGasNozzleIdx = -1;
        if (gasStationObjs.length > 0 && !(heldItem && heldItem.type==='gasNozzle')) {
            const gnMeshes = [];
            gasStationObjs.forEach(gs => { if(gs.nozzleMesh && gs.nozzleMesh.visible) gs.nozzleMesh.traverse(m=>{ if(m.isMesh) gnMeshes.push(m); }); });
            if (gnMeshes.length > 0) {
                const gnHits = raycaster.intersectObjects(gnMeshes, false);
                if (gnHits.length > 0) {
                    const idx = gasNozzleMeshToIdx.get(gnHits[0].object.uuid);
                    if (idx !== undefined) raycastGasNozzleIdx = idx;
                }
            }
        }

        // 牽引タンクレイキャスト
        raycastTowTankIdx = -1;
        if (towTanks.length > 0) {
            const ttMeshes=[];
            towTanks.forEach(tt=>{ tt.group.traverse(m=>{ if(m.isMesh) ttMeshes.push(m); }); });
            const ttHits=raycaster.intersectObjects(ttMeshes,false);
            if (ttHits.length>0) {
                const idx=towTankMeshToIdx.get(ttHits[0].object.uuid);
                if (idx!==undefined) raycastTowTankIdx=idx;
            }
        }

        // 車両ロットレイキャスト
        raycastVehicleLotIdx = -1;
        if (vehicleLotItems.length > 0) {
            const vlMeshes=[];
            vehicleLotItems.forEach(vi=>{ vi.mesh.traverse(m=>{ if(m.isMesh) vlMeshes.push(m); }); });
            const vlHits=raycaster.intersectObjects(vlMeshes,false);
            if (vlHits.length>0) {
                const idx=vehicleLotMeshToIdx.get(vlHits[0].object.uuid);
                if (idx!==undefined) raycastVehicleLotIdx=idx;
            }
        }

        currentAction=computeCurrentAction();

        // エンジンノズル連続充填（SPACE押しっぱなし・5L/秒）
        if (heldItem && heldItem.type==='engineNozzle' && keys.space) {
            if (currentAction && currentAction.type==='nozzleFill') {
                engineNozzleFillAccum += delta;
                const tickInterval = 1/ENGINE_PUMP_OIL_RATE; // 0.2秒/L
                while (engineNozzleFillAccum >= tickInterval) {
                    engineNozzleFillAccum -= tickInterval;
                    doNozzleFill(currentAction.canIdx);
                }
            } else {
                engineNozzleFillAccum = 0;
            }
        } else {
            engineNozzleFillAccum = 0;
        }

        const prompt=document.getElementById('interaction-prompt');
        const crosshairEl=document.getElementById('crosshair');
        if (currentAction) { prompt.style.display='block'; prompt.innerText=currentAction.label; }
        else { prompt.style.display='none'; }

        // クロスヘア色：アクションあり→緑、なし→白
        const hasAction = !!(currentAction && currentAction.type!=='putDown');
        crosshairEl.classList.toggle('active', hasAction);

        // ワールドアイテムハイライト
        const newHighlightIdx = raycastTargetIdx;
        if (newHighlightIdx !== highlightedItemIdx) {
            if (highlightedItemIdx>=0 && highlightedItemIdx<worldItems.length) {
                worldItems[highlightedItemIdx].group.traverse(m=>{
                    if (m.isMesh&&m.material&&m.material.emissive) m.material.emissive.set(0x000000);
                });
            }
            highlightedItemIdx = newHighlightIdx;
        }
        if (highlightedItemIdx>=0 && highlightedItemIdx<worldItems.length) {
            const blink = 0.4 + 0.4*Math.abs(Math.sin(now*0.005));
            // アクション有効なら緑、照準のみなら薄い白
            const actionable = currentAction && (currentAction.type==='pickup'||currentAction.type==='pour');
            const r = actionable ? 0.05*blink : 0.3*blink;
            const g = actionable ? 0.9*blink  : 0.3*blink;
            const b = actionable ? 0.1*blink  : 0.3*blink;
            worldItems[highlightedItemIdx].group.traverse(m=>{
                if (m.isMesh&&m.material&&m.material.emissive) m.material.emissive.set(new THREE.Color(r,g,b));
            });
        }

        // カートアイテムハイライト
        const newCartHighlight = raycastCartSlotIdx;
        if (newCartHighlight !== highlightedCartSlotIdx) {
            if (highlightedCartSlotIdx>=0 && cartObj && cartObj.slots[highlightedCartSlotIdx]) {
                cartObj.slots[highlightedCartSlotIdx].mesh.traverse(m=>{
                    if(m.isMesh&&m.material&&m.material.emissive) m.material.emissive.set(0x000000);
                });
            }
            highlightedCartSlotIdx = newCartHighlight;
        }
        if (highlightedCartSlotIdx>=0 && cartObj && cartObj.slots[highlightedCartSlotIdx]) {
            const blink2 = 0.45+0.45*Math.abs(Math.sin(now*0.005));
            cartObj.slots[highlightedCartSlotIdx].mesh.traverse(m=>{
                if(m.isMesh&&m.material&&m.material.emissive)
                    m.material.emissive.set(new THREE.Color(0.05*blink2,0.9*blink2,0.1*blink2));
            });
        }

        // ショップ展示品ハイライト（金色点滅）
        const newShopHighlight = raycastShopItemIdx;
        if (newShopHighlight !== highlightedShopItemIdx) {
            if (highlightedShopItemIdx>=0 && shopDisplayItems[highlightedShopItemIdx]) {
                shopDisplayItems[highlightedShopItemIdx].mesh.traverse(m=>{
                    if(m.isMesh&&m.material&&m.material.emissive) m.material.emissive.set(0x000000);
                });
            }
            highlightedShopItemIdx = newShopHighlight;
        }
        if (highlightedShopItemIdx>=0 && shopDisplayItems[highlightedShopItemIdx]) {
            const blink3 = 0.45+0.45*Math.abs(Math.sin(now*0.005));
            shopDisplayItems[highlightedShopItemIdx].mesh.traverse(m=>{
                if(m.isMesh&&m.material&&m.material.emissive)
                    m.material.emissive.set(new THREE.Color(0.9*blink3, 0.6*blink3, 0.0));
            });
        }

        // 設置済みポンプハイライト（シアン点滅）
        const newPumpHighlight = raycastPumpIdx;
        if (newPumpHighlight !== highlightedPumpIdx) {
            if (highlightedPumpIdx>=0 && pumpObjs[highlightedPumpIdx]) {
                pumpObjs[highlightedPumpIdx].group.traverse(m=>{
                    if(m.isMesh&&m.material&&m.material.emissive) m.material.emissive.set(0x000000);
                });
            }
            highlightedPumpIdx = newPumpHighlight;
        }
        if (highlightedPumpIdx>=0 && pumpObjs[highlightedPumpIdx]) {
            const blink4 = 0.4+0.4*Math.abs(Math.sin(now*0.005));
            pumpObjs[highlightedPumpIdx].group.traverse(m=>{
                if(m.isMesh&&m.material&&m.material.emissive)
                    m.material.emissive.set(new THREE.Color(0.0, 0.7*blink4, 0.9*blink4));
            });
        }

        // エンジンポンプハイライト（オレンジ点滅）
        const newEpHighlight = raycastEnginePumpIdx;
        if (newEpHighlight !== highlightedEnginePumpIdx) {
            if (highlightedEnginePumpIdx>=0 && enginePumpObjs[highlightedEnginePumpIdx]) {
                enginePumpObjs[highlightedEnginePumpIdx].group.traverse(m=>{
                    if(m.isMesh&&m.material&&m.material.emissive) m.material.emissive.set(0x000000);
                });
            }
            highlightedEnginePumpIdx = newEpHighlight;
        }
        if (highlightedEnginePumpIdx>=0 && enginePumpObjs[highlightedEnginePumpIdx]) {
            const blinkE = 0.4+0.4*Math.abs(Math.sin(now*0.005));
            enginePumpObjs[highlightedEnginePumpIdx].group.traverse(m=>{
                if(m.isMesh&&m.material&&m.material.emissive)
                    m.material.emissive.set(new THREE.Color(0.9*blinkE, 0.4*blinkE, 0.0));
            });
        }

        // ガスノズルハイライト（黄色点滅）
        const newGnHighlight = raycastGasNozzleIdx;
        if (newGnHighlight !== highlightedGasNozzleIdx) {
            if (highlightedGasNozzleIdx>=0 && gasStationObjs[highlightedGasNozzleIdx]?.nozzleMesh) {
                gasStationObjs[highlightedGasNozzleIdx].nozzleMesh.traverse(m=>{
                    if(m.isMesh&&m.material&&m.material.emissive) m.material.emissive.set(0x000000);
                });
            }
            highlightedGasNozzleIdx = newGnHighlight;
        }
        if (highlightedGasNozzleIdx>=0 && gasStationObjs[highlightedGasNozzleIdx]?.nozzleMesh) {
            const blinkG = 0.4+0.4*Math.abs(Math.sin(now*0.005));
            gasStationObjs[highlightedGasNozzleIdx].nozzleMesh.traverse(m=>{
                if(m.isMesh&&m.material&&m.material.emissive)
                    m.material.emissive.set(new THREE.Color(0.9*blinkG, 0.8*blinkG, 0.0));
            });
        }

        // 牽引タンクハイライト（緑点滅）
        const newTTHighlight=raycastTowTankIdx;
        if (newTTHighlight!==highlightedTowTankIdx) {
            if (highlightedTowTankIdx>=0&&towTanks[highlightedTowTankIdx])
                towTanks[highlightedTowTankIdx].group.traverse(m=>{ if(m.isMesh&&m.material&&m.material.emissive) m.material.emissive.set(0x000000); });
            highlightedTowTankIdx=newTTHighlight;
        }
        if (highlightedTowTankIdx>=0&&towTanks[highlightedTowTankIdx]) {
            const blinkTT=0.4+0.4*Math.abs(Math.sin(now*0.005));
            towTanks[highlightedTowTankIdx].group.traverse(m=>{ if(m.isMesh&&m.material&&m.material.emissive) m.material.emissive.set(new THREE.Color(0,0.8*blinkTT,0.2*blinkTT)); });
        }

        // 車両ロットハイライト（金色点滅）
        const newVLHighlight=raycastVehicleLotIdx;
        if (newVLHighlight!==highlightedVehicleLotIdx) {
            if (highlightedVehicleLotIdx>=0&&vehicleLotItems[highlightedVehicleLotIdx])
                vehicleLotItems[highlightedVehicleLotIdx].mesh.traverse(m=>{ if(m.isMesh&&m.material&&m.material.emissive) m.material.emissive.set(0x000000); });
            highlightedVehicleLotIdx=newVLHighlight;
        }
        if (highlightedVehicleLotIdx>=0&&vehicleLotItems[highlightedVehicleLotIdx]) {
            const blinkVL=0.45+0.45*Math.abs(Math.sin(now*0.005));
            vehicleLotItems[highlightedVehicleLotIdx].mesh.traverse(m=>{ if(m.isMesh&&m.material&&m.material.emissive) m.material.emissive.set(new THREE.Color(0.9*blinkVL,0.6*blinkVL,0)); });
        }

        autoSaveTimer+=delta;
        if (autoSaveTimer>=10) { autoSaveTimer=0; saveGame(true); }

        // スカイドームをカメラ位置に追従（端が見えないよう）
        if (skyDome) skyDome.position.copy(camera.position);
        // 雲をゆっくり流す
        clouds.forEach(c => {
            c.position.x += delta * 0.4;
            if (c.position.x > 200) c.position.x -= 420;
        });

        renderer.render(scene,camera);
    } catch(err) { console.error('Loop error:',err); }
    requestAnimationFrame(updateGame);
}

// ===== UI =====
function updateUI() {
    const L=I18N[currentLang];
    document.getElementById('ui-money').innerText=L.money+gameState.money;
    let heldText=L.heldNone;
    if (heldItem) {
        if (heldItem.type==='ladle') heldText=L.heldLadle(heldItem.hasOil);
        else if (heldItem.type==='handPump') heldText=(currentLang==='ja'?'手持ち: ':'Holding: ')+L.nameHandPump;
        else if (heldItem.type==='enginePump') heldText=(currentLang==='ja'?'手持ち: ':'Holding: ')+L.nameEnginePump;
        else if (heldItem.type==='drum') heldText=L.heldDrum(heldItem.fill, heldItem.contentType);
        else if (heldItem.type==='engineNozzle') {
            const ep=enginePumpObjs[heldItem.pumpIdx];
            heldText=L.heldNozzle(ep?ep.gasFuel:0);
        }
        else if (heldItem.type==='gasNozzle') heldText=L.heldGasNozzle;
        else heldText=L.heldCan(heldItem.fill, heldItem.contentType);
    }
    if (towVehicle && towVehicle.inVehicle) {
        const ht=towVehicle.hitchedTankIdx>=0?towTanks[towVehicle.hitchedTankIdx]:null;
        heldText=L.heldVehicle(ht?ht.fill:0, ht?ht.capacity:0);
    }
    if (cartObj && cartObj.isHeld) {
        heldText += ' / ' + L.heldCart(cartCapacityUsed());
    }
    document.getElementById('ui-held').innerText=heldText;
    document.getElementById('ui-hint').innerText=L.hintText;
    document.getElementById('btn-lang').innerText=currentLang==='ja'?'English':'日本語';
}

function toggleLanguage() {
    currentLang=currentLang==='ja'?'en':'ja';
    document.getElementById('btn-lang').innerText=currentLang==='ja'?'English':'日本語';
    updateUI();
}

function showNotification(msg) {
    const el=document.getElementById('notification');
    el.innerText=msg; el.style.opacity='1';
    setTimeout(()=>{ el.style.opacity='0'; },2500);
}

// ===== セーブ/ロード =====
function saveGame(isAuto=false) {
    gameState.playerPos.x=playerGroup.position.x;
    gameState.playerPos.z=playerGroup.position.z;
    gameState.savedWorldItems=worldItems.map(i=>({type:i.type,x:i.x,z:i.z,fill:i.fill,hasOil:i.hasOil,contentType:i.contentType||null}));
    gameState.savedHeldItem=heldItem?{...heldItem}:null;
    gameState.savedPumps=pumpObjs.map(po=>({x:po.x,z:po.z,attachedCan:po.attachedCan?{...po.attachedCan}:null}));
    gameState.savedEnginePumps=enginePumpObjs.map(ep=>({x:ep.x,z:ep.z,gasFuel:ep.gasFuel}));
    gameState.savedCartSlots=cartObj?cartObj.slots.map(s=>s?{type:s.type,fill:s.fill,hasOil:s.hasOil,contentType:s.contentType||null}:null):[];
    gameState.savedCartPos=cartObj?{x:cartObj.x,z:cartObj.z}:null;
    gameState.savedTowVehicle=towVehiclePurchased&&towVehicle?{x:towVehicle.x,z:towVehicle.z,rot:towVehicle.rot,hitchedTankIdx:towVehicle.hitchedTankIdx}:null;
    gameState.savedTowTanks=towTanks.map(tt=>({x:tt.x,z:tt.z,capacity:tt.capacity,fill:tt.fill,contentType:tt.contentType}));
    localStorage.setItem('oil_rush_save',JSON.stringify(gameState));
    showNotification(isAuto?I18N[currentLang].msgAutoSaved:I18N[currentLang].msgDataSaved);
}

function loadGame() {
    const data=localStorage.getItem('oil_rush_save');
    if (!data) return;
    try {
        const saved=JSON.parse(data);
        if (typeof saved.money!=='number') throw new Error('bad');
        // 旧データ移行
        if (saved.barrels!==undefined) { delete saved.barrels; delete saved.maxBarrels; }
        if (saved.emptyCans!==undefined) { delete saved.emptyCans; delete saved.filledCans; delete saved.savedCans; }
        if (!saved.playerPos) saved.playerPos={x:-35,z:0};
        if (saved.cameraYaw===undefined) saved.cameraYaw=0;
        if (saved.cameraPitch===undefined) saved.cameraPitch=0;
        if (saved.hasCart===undefined) saved.hasCart=false;
        Object.assign(gameState,saved);

        if (playerGroup) playerGroup.position.set(gameState.playerPos.x,0,gameState.playerPos.z);

        // カートリセット & 購入状態復元
        if (cartObj) {
            cartObj.slots.forEach((s,i)=>{
                if (s) { cartObj.group.remove(s.mesh); cartObj.slots[i]=null; }
            });
            cartObj.cartItemMeshMap.clear();
            cartObj.isHeld = false;
            if (gameState.hasCart) {
                cartObj.purchased = true;
                cartObj.group.traverse(m => { if(m.isMesh) shopMeshToIdx.delete(m.uuid); });
                // カート位置復元
                if (gameState.savedCartPos) {
                    cartObj.x=gameState.savedCartPos.x; cartObj.z=gameState.savedCartPos.z;
                    cartObj.group.position.set(cartObj.x,0,cartObj.z);
                }
                // カートスロット復元
                (gameState.savedCartSlots||[]).forEach((s,i)=>{
                    if (!s) return;
                    const [lx,lz]=CART_SLOTS[i];
                    let m;
                    if (s.type==='ladle') { m=createLadleMesh(s.hasOil); m.scale.setScalar(1.5); }
                    else if (s.type==='drum') { m=createDrumMesh(s.fill,s.contentType||null); m.scale.setScalar(0.75); }
                    else { m=createJerryCanMesh(s.fill); m.scale.setScalar(1.3); }
                    m.position.set(lx,0.59,lz); m.rotation.y=(i%2===0?-0.1:0.1);
                    cartObj.group.add(m);
                    m.traverse(c=>{if(c.isMesh)cartObj.cartItemMeshMap.set(c.uuid,i);});
                    cartObj.slots[i]={type:s.type,fill:s.fill,hasOil:s.hasOil,contentType:s.contentType||null,mesh:m};
                });
            } else {
                cartObj.purchased = false;
                // createHandcart()で登録済み — 再登録は不要
            }
        }

        // ワールドアイテム再構築
        clearWorldItems();
        const items=gameState.savedWorldItems||getDefaultWorldItems();
        items.forEach(i=>spawnWorldItem(i.type,i.x,i.z,i.hasOil||false,i.fill||0,0.04,i.contentType||null));

        // ポンプ再構築
        clearPumpObjs();
        (gameState.savedPumps||[]).forEach(p=>restorePump(p.x,p.z,p.attachedCan));

        // エンジンポンプ再構築
        clearEnginePumpObjs();
        (gameState.savedEnginePumps||[]).forEach(ep=>restoreEnginePump(ep.x,ep.z,ep.gasFuel));

        // タンクトラック復元
        clearTowVehicleObjs();
        if (gameState.savedTowVehicle) {
            const sv=gameState.savedTowVehicle;
            const g=createTowVehicleMesh();
            g.position.set(sv.x,0,sv.z); g.rotation.y=sv.rot;
            scene.add(g);
            towVehicle={group:g,x:sv.x,z:sv.z,rot:sv.rot,inVehicle:false,hitchedTankIdx:sv.hitchedTankIdx};
            g.traverse(m=>{ if(m.isMesh) towVehicleMeshUUIDs.add(m.uuid); });
            towVehiclePurchased=true;
        }
        // 牽引タンク復元
        while(towTanks.length>0){const tt=towTanks.pop();scene.remove(tt.group);}
        towTankMeshToIdx.clear();
        (gameState.savedTowTanks||[]).forEach((tt,i)=>{
            const g=createTowTankMesh(tt.capacity,tt.fill,tt.contentType);
            g.position.set(tt.x,0,tt.z); scene.add(g);
            g.traverse(m=>{ if(m.isMesh) towTankMeshToIdx.set(m.uuid,i); });
            towTanks.push({group:g,x:tt.x,z:tt.z,capacity:tt.capacity,fill:tt.fill,contentType:tt.contentType});
        });

        // 手持ち復元
        heldItem=gameState.savedHeldItem?{...gameState.savedHeldItem}:null;
        updateHeldMesh();
        updateUI();
        showNotification(I18N[currentLang].msgDataLoaded);
    } catch(e) { console.error(e); }
}

function clearTowVehicleObjs() {
    if (towVehicle) { scene.remove(towVehicle.group); towVehicle=null; }
    towVehiclePurchased=false; towVehicleMeshUUIDs.clear();
}

function clearWorldItems() {
    while (worldItems.length>0) { scene.remove(worldItems[0].group); worldItems.splice(0,1); }
}

function clearPumpObjs() {
    while (pumpObjs.length>0) { scene.remove(pumpObjs[0].group); pumpObjs.splice(0,1); }
    pumpMeshToIdx.clear();
    raycastPumpIdx=-1; highlightedPumpIdx=-1;
}

function restorePump(x, z, attachedCan) {
    const g = new THREE.Group();
    g.add(createHandPumpMesh());
    g.position.set(x, 0, z);
    scene.add(g);
    const idx = pumpObjs.length;
    g.traverse(m => { if(m.isMesh) pumpMeshToIdx.set(m.uuid, idx); });
    const po = { group:g, x, z, attachedCan:attachedCan?{...attachedCan}:null, canMesh:null };
    if (po.attachedCan) {
        const cm = createJerryCanMesh(po.attachedCan.fill);
        cm.scale.setScalar(1.0); cm.position.set(0.42,0,0.08);
        g.add(cm); po.canMesh = cm;
        cm.traverse(m => { if(m.isMesh) pumpMeshToIdx.set(m.uuid, idx); });
    }
    pumpObjs.push(po);
}

function clearEnginePumpObjs() {
    while (enginePumpObjs.length>0) { scene.remove(enginePumpObjs[0].group); enginePumpObjs.splice(0,1); }
    enginePumpMeshToIdx.clear();
    raycastEnginePumpIdx=-1; highlightedEnginePumpIdx=-1;
}

function restoreEnginePump(x, z, gasFuel) {
    const g=new THREE.Group();
    g.add(createEnginePumpMesh());
    g.position.set(x,0,z);
    scene.add(g);
    const idx=enginePumpObjs.length;
    g.traverse(m=>{ if(m.isMesh) enginePumpMeshToIdx.set(m.uuid,idx); });
    enginePumpObjs.push({group:g, x, z, gasFuel:gasFuel||0});
}

function getDefaultWorldItems() {
    return []; // 道具は道具屋で購入
}

function initWorldItemsDefault() {
    clearWorldItems();
    getDefaultWorldItems().forEach(i=>spawnWorldItem(i.type,i.x,i.z,i.hasOil,i.fill,0.88));
}

function openDataModal() {
    document.getElementById('data-modal').style.display='flex';
    document.getElementById('modal-title').innerText=I18N[currentLang].modalTitle;
    document.getElementById('data-textarea').value='';
}
function closeDataModal() { document.getElementById('data-modal').style.display='none'; }

function exportData() {
    gameState.playerPos.x=playerGroup.position.x;
    gameState.playerPos.z=playerGroup.position.z;
    gameState.savedWorldItems=worldItems.map(i=>({type:i.type,x:i.x,z:i.z,fill:i.fill,hasOil:i.hasOil}));
    gameState.savedHeldItem=heldItem?{...heldItem}:null;
    document.getElementById('data-textarea').value=btoa(JSON.stringify(gameState));
}

function importData() {
    const text=document.getElementById('data-textarea').value.trim();
    try {
        const json=JSON.parse(atob(text));
        if (typeof json.money!=='number') throw new Error();
        Object.assign(gameState,json);
        if (!gameState.playerPos) gameState.playerPos={x:-35,z:0};
        if (gameState.hasCart===undefined) gameState.hasCart=false;
        playerGroup.position.set(gameState.playerPos.x,0,gameState.playerPos.z);
        clearWorldItems();
        const items=gameState.savedWorldItems||getDefaultWorldItems();
        items.forEach(i=>spawnWorldItem(i.type,i.x,i.z,i.hasOil||false,i.fill||0,0.04,i.contentType||null));
        clearPumpObjs();
        (gameState.savedPumps||[]).forEach(p=>restorePump(p.x,p.z,p.attachedCan));
        clearEnginePumpObjs();
        (gameState.savedEnginePumps||[]).forEach(ep=>restoreEnginePump(ep.x,ep.z,ep.gasFuel));
        if (cartObj) {
            cartObj.slots.forEach((s,i)=>{ if(s){cartObj.group.remove(s.mesh);cartObj.slots[i]=null;} });
            cartObj.cartItemMeshMap.clear(); cartObj.isHeld=false;
            if (gameState.hasCart) {
                cartObj.purchased=true;
                cartObj.group.traverse(m=>{if(m.isMesh)shopMeshToIdx.delete(m.uuid);});
                if (gameState.savedCartPos) {
                    cartObj.x=gameState.savedCartPos.x; cartObj.z=gameState.savedCartPos.z;
                    cartObj.group.position.set(cartObj.x,0,cartObj.z);
                }
                (gameState.savedCartSlots||[]).forEach((s,i)=>{
                    if (!s) return;
                    const [lx,lz]=CART_SLOTS[i];
                    let m;
                    if (s.type==='ladle') { m=createLadleMesh(s.hasOil); m.scale.setScalar(1.5); }
                    else if (s.type==='drum') { m=createDrumMesh(s.fill,s.contentType||null); m.scale.setScalar(0.75); }
                    else { m=createJerryCanMesh(s.fill); m.scale.setScalar(1.3); }
                    m.position.set(lx,0.59,lz); m.rotation.y=(i%2===0?-0.1:0.1);
                    cartObj.group.add(m);
                    m.traverse(c=>{if(c.isMesh)cartObj.cartItemMeshMap.set(c.uuid,i);});
                    cartObj.slots[i]={type:s.type,fill:s.fill,hasOil:s.hasOil,contentType:s.contentType||null,mesh:m};
                });
            } else { cartObj.purchased=false; }
        }
        heldItem=gameState.savedHeldItem?{...gameState.savedHeldItem}:null;
        updateHeldMesh(); updateUI(); saveGame(); closeDataModal();
        showNotification(I18N[currentLang].msgImportOk);
    } catch(e) { alert(I18N[currentLang].msgImportFail); }
}

// ===== 初期化 =====
window.addEventListener('DOMContentLoaded',()=>{
    initThree();
    const hasSave=!!localStorage.getItem('oil_rush_save');
    if (hasSave) {
        loadGame();
    } else {
        initWorldItemsDefault();
        updateUI();
    }
    requestAnimationFrame(updateGame);
});
</script>
</body>
</html>
