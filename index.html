// ===== ゲーム状態 =====
let gameState = {
    money: 0,
    savedWorldItems: null, // [{type,x,z,fill,hasOil}] — null means first-time default
    savedHeldItem: null,   // {type,fill,hasOil} or null
    playerPos: { x: -35, z: 0 },
    cameraYaw: 0, cameraPitch: 0
};

let scene, camera, renderer, dirLight;
let playerGroup;
const interactables = [];
const collisionBoxes = [];

// ===== ワールドアイテム & 手持ち =====
const worldItems = []; // {type, group, x, z, fill, hasOil}
let heldItem = null;   // {type, fill, hasOil}
let heldMesh = null;   // camera-child mesh

let currentAction = null;
let highlightedItemIdx = -1;     // ハイライト中ワールドアイテム
let raycastTargetIdx = -1;       // 照準中ワールドアイテム
let raycastCartSlotIdx = -1;     // 照準中カートスロット
let highlightedCartSlotIdx = -1; // ハイライト中カートスロット

// ===== 商品陳列 =====

const shopMeshToIdx = new Map(); // mesh.uuid → idx
let raycastShopItemIdx = -1;
let highlightedShopItemIdx = -1;

// ===== リヤカー =====
let cartObj = null; // { group, x, z, isHeld, slots[10], cartItemMeshMap }
const CART_SLOTS = [
    [-0.35,-1.0],[0.35,-1.0],
    [-0.35,-0.5],[0.35,-0.5],
    [-0.35, 0.0],[0.35, 0.0],
    [-0.35, 0.5],[0.35, 0.5],
    [-0.35, 1.0],[0.35, 1.0],
];

// ===== テクスチャ =====
function makeDesertTex() {
    const c = document.createElement('canvas'); c.width = c.height = 512;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#8c6d46'; ctx.fillRect(0,0,512,512);
    for (let i=0; i<40000; i++) {
        const x=Math.random()*512, y=Math.random()*512, r=Math.random()*2+0.5, s=Math.floor(Math.random()*60)-30;
        ctx.fillStyle=`rgb(${140+s},${109+s},${70+s})`;
        ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
    }
    ctx.strokeStyle='rgba(60,40,20,0.15)'; ctx.lineWidth=1.5;
    for (let i=0; i<30; i++) {
        ctx.beginPath(); let cx=Math.random()*512, cy=Math.random()*512; ctx.moveTo(cx,cy);
        for (let j=0; j<5; j++) { cx+=(Math.random()-0.5)*60; cy+=(Math.random()-0.5)*60; ctx.lineTo(cx,cy); }
        ctx.stroke();
    }
    const t = new THREE.CanvasTexture(c);
    t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(20,20); return t;
}
function makeAsphaltTex() {
    const c = document.createElement('canvas'); c.width=c.height=256;
    const ctx = c.getContext('2d');
    ctx.fillStyle='#1a1a1a'; ctx.fillRect(0,0,256,256);
    for (let i=0; i<5000; i++) {
        const x=Math.random()*256, y=Math.random()*256, s=Math.floor(Math.random()*20)-10;
        ctx.fillStyle=`rgb(${26+s},${26+s},${26+s})`; ctx.fillRect(x,y,2,2);
    }
    const t = new THREE.CanvasTexture(c);
    t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(4,4); return t;
}

// ===== メッシュヘルパー =====
function bx(w,h,d,color,roughness=0.8,metalness=0.0) {
    const m = new THREE.Mesh(
        new THREE.BoxGeometry(w,h,d),
        new THREE.MeshStandardMaterial({color,roughness,metalness})
    );
    m.castShadow=true; m.receiveShadow=true; return m;
}

// ===== ひしゃくメッシュ =====
function createLadleMesh(hasOil=false) {
    const g = new THREE.Group();
    const woodMat = new THREE.MeshStandardMaterial({color:0x6d4c41,roughness:0.9});
    const metalMat = new THREE.MeshStandardMaterial({color:0x9e9e9e,roughness:0.3,metalness:0.8});

    // 柄
    const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.022,0.018,0.75,7), woodMat);
    handle.rotation.z=Math.PI/2; handle.position.x=0.3; handle.castShadow=true; g.add(handle);

    // お椀 (外)
    const bowl = new THREE.Mesh(
        new THREE.SphereGeometry(0.11,10,6,0,Math.PI*2,0,Math.PI/1.8), metalMat
    );
    bowl.rotation.x=Math.PI; bowl.position.set(-0.07,0.02,0); bowl.castShadow=true; g.add(bowl);

    // お椀 (内側)
    const bowlIn = new THREE.Mesh(
        new THREE.SphereGeometry(0.096,10,6,0,Math.PI*2,0,Math.PI/1.8),
        new THREE.MeshStandardMaterial({color:0x777777,roughness:0.4,metalness:0.7,side:THREE.BackSide})
    );
    bowlIn.rotation.x=Math.PI; bowlIn.position.set(-0.07,0.02,0); g.add(bowlIn);

    // 原油
    if (hasOil) {
        const oil = new THREE.Mesh(
            new THREE.CylinderGeometry(0.085,0.085,0.025,10),
            new THREE.MeshStandardMaterial({color:0x050505,roughness:0.05,metalness:0.95})
        );
        oil.position.set(-0.07,-0.055,0); g.add(oil);
    }
    return g;
}

// ===== ジェリ缶メッシュ =====
function createJerryCanMesh(fill=0) {
    const g = new THREE.Group();
    const canColor = fill>=5 ? 0x1a5c36 : (fill>0 ? 0x2d7a4a : 0x546e7a);
    const bodyMat = new THREE.MeshStandardMaterial({color:canColor,roughness:0.45,metalness:0.55});
    const metalMat= new THREE.MeshStandardMaterial({color:0x888888,roughness:0.35,metalness:0.7});
    const darkMat = new THREE.MeshStandardMaterial({color:0x222222,roughness:0.4,metalness:0.5});

    const body = new THREE.Mesh(new THREE.BoxGeometry(0.38,0.56,0.22),bodyMat);
    body.castShadow=true; body.receiveShadow=true; g.add(body);

    const top = new THREE.Mesh(new THREE.BoxGeometry(0.36,0.07,0.20),metalMat);
    top.position.y=0.315; g.add(top);

    const spout = new THREE.Mesh(new THREE.CylinderGeometry(0.038,0.038,0.09,8),metalMat);
    spout.position.set(-0.09,0.395,0); g.add(spout);
    const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.045,0.03,8),darkMat);
    cap.position.set(-0.09,0.445,0); g.add(cap);

    const hbar = new THREE.Mesh(new THREE.BoxGeometry(0.34,0.045,0.045),darkMat);
    hbar.position.set(0,0.34,0); g.add(hbar);
    [-0.15,0.15].forEach(ox=>{
        const post = new THREE.Mesh(new THREE.BoxGeometry(0.045,0.12,0.045),darkMat);
        post.position.set(ox,0.325,0); g.add(post);
    });
    [-0.08,0.08].forEach(ox=>{
        const rib = new THREE.Mesh(new THREE.BoxGeometry(0.04,0.44,0.24),metalMat);
        rib.position.set(ox,-0.02,0); g.add(rib);
    });

    if (fill>0) {
        const fh=(fill/5)*0.44;
        const oilMat=new THREE.MeshStandardMaterial({color:0x080808,roughness:0.05,metalness:0.9});
        const oilFill=new THREE.Mesh(new THREE.BoxGeometry(0.30,fh,0.16),oilMat);
        oilFill.position.y=fh/2-0.26; g.add(oilFill);
    }
    return g;
}

// ===== ワールドアイテム スポーン/削除/更新 =====
function spawnWorldItem(type, x, z, hasOil=false, fill=0, yPos=0) {
    const g = new THREE.Group();
    let mesh;
    if (type === 'ladle') {
        mesh = createLadleMesh(hasOil);
        // 地面/テーブルに置いた状態: 柄を水平に寝かせる
        mesh.rotation.set(0, Math.PI*0.15 + x*0.01, 0);
        mesh.scale.setScalar(1.5);
    } else {
        mesh = createJerryCanMesh(fill);
        mesh.scale.setScalar(1.3);
    }
    g.add(mesh);
    g.position.set(x, yPos, z);
    scene.add(g);
    const entry = { type, group: g, x, z, fill, hasOil };
    worldItems.push(entry);
    return entry;
}

function removeWorldItem(idx) {
    if (highlightedItemIdx === idx) highlightedItemIdx = -1;
    else if (highlightedItemIdx > idx) highlightedItemIdx--;
    scene.remove(worldItems[idx].group);
    worldItems.splice(idx, 1);
}

function refreshWorldItemMesh(idx) {
    if (highlightedItemIdx === idx) highlightedItemIdx = -1; // グループ差し替え前にリセット
    const item = worldItems[idx];
    const oldG = item.group;
    const pos = oldG.position.clone();
    scene.remove(oldG);
    // 新しいグループ作成
    const g = new THREE.Group();
    let mesh;
    if (item.type === 'ladle') {
        mesh = createLadleMesh(item.hasOil);
        mesh.scale.setScalar(1.5);
    } else {
        mesh = createJerryCanMesh(item.fill);
        mesh.scale.setScalar(1.3);
    }
    g.add(mesh);
    g.position.copy(pos);
    scene.add(g);
    item.group = g;
}

// ===== 手持ちメッシュ更新 =====
function updateHeldMesh() {
    if (heldMesh) { camera.remove(heldMesh); heldMesh = null; }
    if (!heldItem) return;
    if (heldItem.type === 'ladle') {
        heldMesh = createLadleMesh(heldItem.hasOil);
        heldMesh.position.set(0.28, -0.26, -0.52);
        heldMesh.rotation.set(0.05, Math.PI/2+0.1+Math.PI, 0.12);
        heldMesh.scale.setScalar(1.0);
    } else {
        heldMesh = createJerryCanMesh(heldItem.fill);
        heldMesh.position.set(0.22, -0.32, -0.50);
        heldMesh.rotation.set(0.08, -0.25, 0.06);
        heldMesh.scale.setScalar(0.65);
    }
    camera.add(heldMesh);
}

// ===== ドロップ位置（コリジョン回避） =====
function isItemPosBlocked(x, z) {
    const hw=0.3; // アイテム占有半径
    for (const b of collisionBoxes) {
        if (x+hw>b.x-b.hw && x-hw<b.x+b.hw && z+hw>b.z-b.hd && z-hw<b.z+b.hd) return true;
    }
    if (x<-195||x>195||z<-195||z>195) return true;
    return false;
}

function getDropPos() {
    const fx=-Math.sin(gameState.cameraYaw), fz=-Math.cos(gameState.cameraYaw);
    const px=playerGroup.position.x, pz=playerGroup.position.z;
    // 前方1.2mから少しずつ近づいて最初に有効な位置を返す
    for (let dist=1.2; dist>=0.3; dist-=0.15) {
        const cx=px+fx*dist, cz=pz+fz*dist;
        if (!isItemPosBlocked(cx, cz)) return {x:cx, z:cz};
    }
    // 全てブロックされていたらプレイヤー位置の横にずらす
    const sx=-fz, sz=fx; // 右方向ベクトル
    for (let s=0.5; s<=1.5; s+=0.5) {
        const cx=px+sx*s, cz=pz+sz*s;
        if (!isItemPosBlocked(cx, cz)) return {x:cx, z:cz};
        if (!isItemPosBlocked(px-sx*s, pz-sz*s)) return {x:px-sx*s, z:pz-sz*s};
    }
    return {x:px, z:pz}; // 最終フォールバック
}

// ===== Three.js 初期化 =====
function initThree() {
    const container = document.getElementById('canvas-container');
    raycaster = new THREE.Raycaster();
    raycaster.far = 4.0;
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x3a2e2b);
    scene.fog = new THREE.FogExp2(0x3a2e2b, 0.006);

    camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);
    camera.rotation.order = 'YXZ';

    renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio,2));
    renderer.shadowMap.enabled=true;
    renderer.shadowMap.type=THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffdfb3, 0.5));
    dirLight = new THREE.DirectionalLight(0xffbe76, 1.0);
    dirLight.castShadow=true;
    dirLight.shadow.mapSize.width=dirLight.shadow.mapSize.height=2048;
    dirLight.shadow.camera.near=0.5; dirLight.shadow.camera.far=80;
    const sd=40;
    dirLight.shadow.camera.left=-sd; dirLight.shadow.camera.right=sd;
    dirLight.shadow.camera.top=sd; dirLight.shadow.camera.bottom=-sd;
    scene.add(dirLight); scene.add(dirLight.target);

    const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(400,400),
        new THREE.MeshStandardMaterial({map:makeDesertTex(),roughness:0.9,metalness:0.05})
    );
    ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);

    createPlayer();
    createOilField();
    createTown();
    createRoads();
    populateDecorations();

    window.addEventListener('resize', ()=>{
        camera.aspect=innerWidth/innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
    });
}

// ===== 衝突判定 =====
function checkCollision(x, z) {
    const pr=0.45;
    if (x<-195||x>195||z<-195||z>195) return true;
    for (const b of collisionBoxes) {
        if (x+pr>b.x-b.hw && x-pr<b.x+b.hw && z+pr>b.z-b.hd && z-pr<b.z+b.hd) return true;
    }
    return false;
}

     [-58,8,0.5],[-75,-18,0.8],[-40,30,0.7]].forEach(([x,z,s])=>createRock(x,z,s));
    [[55,5],[60,-8],[68,-5],[72,20],[80,0],[85,-10],[62,15],[50,-10],
     [78,-22],[90,5],[88,18]].forEach(([x,z])=>createTree(x,z));
    [[25,-6],[35,-6],[45,-6],[55,-6],[65,-6],
     [45,10],[45,25],[45,42]].forEach(([x,z])=>createStreetLight(x,z));
    [[-45,-5],[-68,-20],[-85,0]].forEach(([x,z])=>createJunkPile(x,z));
}
function createRock(x,z,s) {
    const m=new THREE.Mesh(new THREE.DodecahedronGeometry(s*0.55,1),new THREE.MeshStandardMaterial({color:0x78909c,roughness:0.9}));
    m.position.set(x,s*0.27,z); m.rotation.set(Math.random()*2,Math.random()*2,Math.random()*2);
    m.castShadow=true; m.receiveShadow=true; scene.add(m);
}
function createTree(x,z) {
    const g=new THREE.Group(); g.position.set(x,0,z);
    const trunk=bx(0.35,2.2,0.35,0x5d4037); trunk.position.y=1.1; g.add(trunk);
    const foliage=new THREE.Mesh(new THREE.SphereGeometry(1.3,8,6),new THREE.MeshStandardMaterial({color:0x2e7d32,roughness:0.9}));
    foliage.position.y=3.0; foliage.castShadow=true; g.add(foliage); scene.add(g);
}
function createStreetLight(x,z) {
    const g=new THREE.Group(); g.position.set(x,0,z);
    const pole=bx(0.1,4.5,0.1,0x9e9e9e,0.5,0.8); pole.position.y=2.25; g.add(pole);
    const arm=bx(0.08,0.08,0.8,0x9e9e9e,0.5,0.8); arm.position.set(0,4.5,-0.4); g.add(arm);
    const lamp=new THREE.Mesh(new THREE.SphereGeometry(0.18,8,6),
        new THREE.MeshStandardMaterial({color:0xffff88,emissive:0xffff00,emissiveIntensity:0.8}));
    lamp.position.set(0,4.5,-0.8); g.add(lamp);
    const light=new THREE.PointLight(0xffeeaa,0.6,18);
    light.position.set(0,4.4,-0.8); g.add(light); scene.add(g);
}
function createJunkPile(x,z) {
    const g=new THREE.Group(); g.position.set(x,0,z);
    const colors=[0x546e7a,0x37474f,0x455a64];
    for (let i=0; i<4; i++) {
        const junk=bx(0.5+Math.random()*0.8,0.4+Math.random()*0.6,0.4+Math.random()*0.8,colors[i%colors.length],0.8,0.4);
        junk.position.set((Math.random()-0.5)*2,0.3,(Math.random()-0.5)*2);
        junk.rotation.y=Math.random()*Math.PI; g.add(junk);
    }
    scene.add(g);
}

// ===== 入力 =====
const keys={w:false,a:false,s:false,d:false,space:false};
window.addEventListener('keydown',e=>{
    if (e.code==='KeyW'||e.code==='ArrowUp')    keys.w=true;
    if (e.code==='KeyA'||e.code==='ArrowLeft')  keys.a=true;
    if (e.code==='KeyS'||e.code==='ArrowDown')  keys.s=true;
    if (e.code==='KeyD'||e.code==='ArrowRight') keys.d=true;
    if (e.code==='Space') { e.preventDefault(); if(!keys.space) triggerAction(); keys.space=true; }
});
window.addEventListener('keyup',e=>{
    if (e.code==='KeyW'||e.code==='ArrowUp')    keys.w=false;
    if (e.code==='KeyA'||e.code==='ArrowLeft')  keys.a=false;
    if (e.code==='KeyS'||e.code==='ArrowDown')  keys.s=false;
    if (e.code==='KeyD'||e.code==='ArrowRight') keys.d=false;
    if (e.code==='Space') keys.space=false;
});

let joystickActive=false,joystickTouchId=null,joystickVector={x:0,y:0};
let lookTouchId=null,lastTouchPos={x:0,y:0},isMouseDown=false;
const joystickZone=document.getElementById('joystick-zone');
const joystickKnob=document.getElementById('joystick-knob');

window.addEventListener('touchstart',e=>{
    for (let i=0;i<e.changedTouches.length;i++) {
        const t=e.changedTouches[i];
        const r=joystickZone.getBoundingClientRect();
        if (t.clientX>=r.left&&t.clientX<=r.right&&t.clientY>=r.top&&t.clientY<=r.bottom) {
            if (joystickTouchId===null) { joystickTouchId=t.identifier; joystickActive=true; updateJoystick(t); }
        } else if (t.clientX>innerWidth/3&&lookTouchId===null) {
            lookTouchId=t.identifier; lastTouchPos.x=t.clientX; lastTouchPos.y=t.clientY;
        }
    }
},{passive:false});
window.addEventListener('touchmove',e=>{
    for (let i=0;i<e.changedTouches.length;i++) {
        const t=e.changedTouches[i];
        if (t.identifier===joystickTouchId) { updateJoystick(t); }
        else if (t.identifier===lookTouchId) {
            gameState.cameraYaw -=(t.clientX-lastTouchPos.x)*0.005;
            gameState.cameraPitch-=(t.clientY-lastTouchPos.y)*0.005;
            gameState.cameraPitch=Math.max(-Math.PI/2.2,Math.min(Math.PI/2.2,gameState.cameraPitch));
            lastTouchPos.x=t.clientX; lastTouchPos.y=t.clientY;
        }
    }
},{passive:false});
window.addEventListener('touchend',e=>{
    for (let i=0;i<e.changedTouches.length;i++) {
        const t=e.changedTouches[i];
        if (t.identifier===joystickTouchId) {
            joystickTouchId=null; joystickActive=false; joystickVector={x:0,y:0};
            joystickKnob.style.top='32px'; joystickKnob.style.left='32px';
        } else if (t.identifier===lookTouchId) { lookTouchId=null; }
    }
});
window.addEventListener('mousedown',e=>{
    if (e.target.closest('.interactive')||e.target.closest('.modal')) return;
    isMouseDown=true; lastTouchPos.x=e.clientX; lastTouchPos.y=e.clientY;
});
window.addEventListener('mousemove',e=>{
    if (!isMouseDown) return;
    gameState.cameraYaw -=(e.clientX-lastTouchPos.x)*0.003;
    gameState.cameraPitch-=(e.clientY-lastTouchPos.y)*0.003;
    gameState.cameraPitch=Math.max(-Math.PI/2.2,Math.min(Math.PI/2.2,gameState.cameraPitch));
    lastTouchPos.x=e.clientX; lastTouchPos.y=e.clientY;
});
window.addEventListener('mouseup',()=>{isMouseDown=false;});

function updateJoystick(touch) {
    const r=joystickZone.getBoundingClientRect();
    let dx=touch.clientX-(r.left+r.width/2), dy=touch.clientY-(r.top+r.height/2);
    const maxR=40, dist=Math.hypot(dx,dy);
    if (dist>maxR) { dx=dx/dist*maxR; dy=dy/dist*maxR; }
    joystickKnob.style.left=`${32+dx}px`; joystickKnob.style.top=`${32+dy}px`;
    joystickVector.x=dx/maxR; joystickVector.y=dy/maxR;
}

// ===== アクション検出 =====
function computeCurrentAction() {
    const px=playerGroup.position.x, pz=playerGroup.position.z;
    const L=I18N[currentLang];

    const aimIdx  = raycastTargetIdx;
    const aimItem = (aimIdx>=0 && aimIdx<worldItems.length) ? worldItems[aimIdx] : null;

    let nearOil=null;
    for (const it of interactables) {
        if (it.type!=='oil') continue;
        if (Math.hypot(px-it.group.position.x, pz-it.group.position.z)<it.radius) { nearOil=it; break; }
    }
    let nearDepot=null;
    for (const it of interactables) {
        if (it.type!=='depot') continue;
        if (Math.hypot(px-it.group.position.x, pz-it.group.position.z)<it.radius) { nearDepot=it; break; }
    }

    const nearCart = cartObj && Math.hypot(px-cartObj.x, pz-cartObj.z) < 3.5;

    // --- ひしゃく持ち ---
    if (heldItem && heldItem.type==='ladle') {
        if (!heldItem.hasOil && nearOil) return { type:'scoop', label:L.promptScoop };
        if (heldItem.hasOil && aimItem && aimItem.type==='jerryCan' && aimItem.fill<5)
            return { type:'pour', label:L.promptPour(aimItem.fill), canIdx:aimIdx };
        if (nearCart && cartObj.slots.some(s=>s===null)) return { type:'loadCart', label:L.promptLoadCart };
        return { type:'putDown', label:L.promptPutDown };
    }

    // --- ジェリ缶持ち ---
    if (heldItem && heldItem.type==='jerryCan') {
        if (heldItem.fill>0 && nearDepot) return { type:'sell', label:L.promptSell(canPrice(heldItem.fill)) };
        if (nearCart && cartObj.slots.some(s=>s===null)) return { type:'loadCart', label:L.promptLoadCart };
        return { type:'putDown', label:L.promptPutDown };
    }

    // --- 手が空の場合 ---
    if (!heldItem) {
        // ショップ展示品に照準 → 購入
        if (raycastShopItemIdx>=0) {
            const si = shopDisplayItems[raycastShopItemIdx];
            const name = si.type==='ladle' ? L.nameLadle : L.nameCan;
            return { type:'buyItem', label:L.promptBuy(name, si.price), shopItemIdx:raycastShopItemIdx };
        }
        // カートアイテムに照準 → 降ろす
        if (raycastCartSlotIdx>=0) return { type:'unloadCart', label:L.promptUnloadCart, slotIdx:raycastCartSlotIdx };
        // ワールドアイテムに照準 → 拾う
        if (aimItem) {
            const label = aimItem.type==='ladle' ? L.promptPickupLadle : L.promptPickupCan(aimItem.fill);
            return { type:'pickup', label, itemIdx:aimIdx };
        }
        // カート近傍 → 引く/離す
        if (nearCart) {
            return cartObj.isHeld
                ? { type:'releaseCart', label:L.promptReleaseCart }
                : { type:'grabCart',   label:L.promptGrabCart };
        }
        return null;
    }

    return null;
}

function canPrice(fill) {
    if (fill<=0) return 0;
    if (fill>=5) return 175;
    return fill*25;
}

// ===== アクション実行 =====
function triggerAction() {
    if (!currentAction) return;
    const L=I18N[currentLang];
    switch (currentAction.type) {
        case 'pickup':      doPickup(currentAction.itemIdx); break;
        case 'scoop':       doScoop(); break;
        case 'pour':        doPour(currentAction.canIdx); break;
        case 'sell':        doSell(); break;
        case 'putDown':     doPutDown(); break;
        case 'grabCart':    doGrabCart(); break;
        case 'releaseCart': doReleaseCart(); break;
        case 'loadCart':    doLoadCart(); break;
        case 'unloadCart':  doUnloadCart(currentAction.slotIdx); break;
        case 'buyItem':     doBuyItem(currentAction.shopItemIdx); break;
    }
}

function doBuyItem(idx) {
    const si = shopDisplayItems[idx];
    if (!si) return;
    const L = I18N[currentLang];
    if (gameState.money < si.price) { showNotification(L.msgNoMoney); return; }
    gameState.money -= si.price;
    spawnWorldItem(si.type, si.dropX, si.dropZ, false, 0, 0.04);
    updateUI();
    const name = si.type==='ladle' ? L.nameLadle : L.nameCan;
    showNotification(L.msgBought(name, si.price));
}

function doPickup(idx) {
    if (idx<0||idx>=worldItems.length) return;
    const item=worldItems[idx];
    heldItem={type:item.type, fill:item.fill, hasOil:item.hasOil};
    removeWorldItem(idx);
    updateHeldMesh();
    updateUI();
    showNotification(I18N[currentLang].msgPickedUp(
        heldItem.type==='ladle' ? I18N[currentLang].nameLadle : I18N[currentLang].nameCan
    ));
}

function doScoop() {
    heldItem.hasOil=true;
    updateHeldMesh();
    updateUI();
    showNotification(I18N[currentLang].msgScooped);
}

function doPour(canIdx) {
    if (canIdx<0||canIdx>=worldItems.length) return;
    const can=worldItems[canIdx];
    can.fill++;
    heldItem.hasOil=false;
    refreshWorldItemMesh(canIdx);
    updateHeldMesh();
    updateUI();
    if (can.fill>=5) showNotification(I18N[currentLang].msgCanFull);
    else showNotification(I18N[currentLang].msgPoured(can.fill));
}

function doSell() {
    if (!heldItem||heldItem.fill<=0) { showNotification(I18N[currentLang].msgCanEmpty); return; }
    const earn=canPrice(heldItem.fill);
    gameState.money+=earn;
    heldItem.fill=0;
    updateHeldMesh();
    updateUI();
    showNotification(I18N[currentLang].msgSold(earn));
}

function doGrabCart() {
    if (!cartObj) return;
    cartObj.isHeld = true;
    updateUI();
    showNotification(I18N[currentLang].msgGrabbedCart);
}

function doReleaseCart() {
    if (!cartObj) return;
    cartObj.isHeld = false;
    updateUI();
    showNotification(I18N[currentLang].msgReleasedCart);
}

function doLoadCart() {
    if (!heldItem || !cartObj) return;
    const slotIdx = cartObj.slots.findIndex(s=>s===null);
    if (slotIdx<0) { showNotification(I18N[currentLang].msgCartFull); return; }

    const [lx,lz] = CART_SLOTS[slotIdx];
    let m;
    if (heldItem.type==='ladle') {
        m = createLadleMesh(heldItem.hasOil); m.scale.setScalar(1.5);
    } else {
        m = createJerryCanMesh(heldItem.fill); m.scale.setScalar(1.3);
    }
    m.position.set(lx, 0.59, lz);
    m.rotation.y = (slotIdx % 2 === 0 ? -0.1 : 0.1);
    cartObj.group.add(m);
    m.traverse(child => { if(child.isMesh) cartObj.cartItemMeshMap.set(child.uuid, slotIdx); });

    cartObj.slots[slotIdx] = { type:heldItem.type, fill:heldItem.fill, hasOil:heldItem.hasOil, mesh:m };

    if (heldMesh) { camera.remove(heldMesh); heldMesh=null; }
    heldItem = null;
    updateUI();
    showNotification(I18N[currentLang].msgLoadedCart);
}

function doUnloadCart(slotIdx) {
    if (!cartObj || slotIdx<0 || !cartObj.slots[slotIdx]) return;
    const slot = cartObj.slots[slotIdx];

    // カートから削除
    cartObj.group.remove(slot.mesh);
    slot.mesh.traverse(child => { if(child.isMesh) cartObj.cartItemMeshMap.delete(child.uuid); });
    cartObj.slots[slotIdx] = null;

    // 手に持つ（カートは引き続き引ける状態を維持）
    heldItem = { type:slot.type, fill:slot.fill, hasOil:slot.hasOil };
    updateHeldMesh();
    updateUI();
    showNotification(I18N[currentLang].msgUnloadedCart);
}

function doPutDown() {
    if (!heldItem) return;
    const {x:dx, z:dz}=getDropPos();
    const name=heldItem.type==='ladle' ? I18N[currentLang].nameLadle : I18N[currentLang].nameCan;
    spawnWorldItem(heldItem.type, dx, dz, heldItem.hasOil, heldItem.fill, 0.04);
    if (heldMesh) { camera.remove(heldMesh); heldMesh=null; }
    heldItem=null;
    updateUI();
    showNotification(I18N[currentLang].msgPutDown(name));
}

// ===== ゲームループ =====
let lastTime=performance.now(), autoSaveTimer=0;

function updateGame() {
    try {
        const now=performance.now();
        const delta=Math.min((now-lastTime)/1000, 0.1);
        lastTime=now;

        let ix=0,iz=0;
        if (keys.w) iz-=1; if (keys.s) iz+=1;
        if (keys.a) ix-=1; if (keys.d) ix+=1;
        if (joystickActive) { ix=joystickVector.x; iz=joystickVector.y; }

        const ml=Math.hypot(ix,iz);
        if (ml>0.1) {
            const spd=8.0*delta;
            const nx=ix/Math.max(1,ml), nz=iz/Math.max(1,ml);
            const sy=Math.sin(gameState.cameraYaw), cy=Math.cos(gameState.cameraYaw);
            const vx=(nx*cy+nz*sy)*spd, vz=(-nx*sy+nz*cy)*spd;
            const px2=playerGroup.position.x, pz2=playerGroup.position.z;
            if (!checkCollision(px2+vx,pz2))                      playerGroup.position.x=px2+vx;
            if (!checkCollision(playerGroup.position.x,pz2+vz))   playerGroup.position.z=pz2+vz;
        }

        playerGroup.rotation.y=gameState.cameraYaw;
        camera.position.set(playerGroup.position.x,1.45,playerGroup.position.z);
        camera.rotation.y=gameState.cameraYaw;
        camera.rotation.x=gameState.cameraPitch;

        dirLight.position.set(playerGroup.position.x+30,40,playerGroup.position.z+20);
        dirLight.target.position.copy(playerGroup.position);
        dirLight.target.updateMatrixWorld();

        // カート追従
        if (cartObj && cartObj.isHeld) {
            const sy=Math.sin(gameState.cameraYaw), cy=Math.cos(gameState.cameraYaw);
            cartObj.x = playerGroup.position.x + sy*1.8;
            cartObj.z = playerGroup.position.z + cy*1.8;
            cartObj.group.position.set(cartObj.x, 0, cartObj.z);
            cartObj.group.rotation.y = gameState.cameraYaw + Math.PI;
        }

        // レイキャスト：ワールドアイテム + カートアイテム
        raycaster.setFromCamera({x:0,y:0}, camera);
        const itemMeshes = [];
        const meshToIdx = new Map();
        worldItems.forEach((item,idx)=>{
            item.group.traverse(m=>{ if(m.isMesh){itemMeshes.push(m);meshToIdx.set(m.uuid,idx);} });
        });
        const hits = raycaster.intersectObjects(itemMeshes, false);
        raycastTargetIdx = (hits.length>0) ? (meshToIdx.get(hits[0].object.uuid)??-1) : -1;

        // カートアイテムレイキャスト
        raycastCartSlotIdx = -1;
        if (cartObj && cartObj.cartItemMeshMap.size>0) {
            const cartMeshes = [];
            cartObj.group.traverse(m=>{ if(m.isMesh && cartObj.cartItemMeshMap.has(m.uuid)) cartMeshes.push(m); });
            const cartHits = raycaster.intersectObjects(cartMeshes, false);
            if (cartHits.length>0) {
                const slot = cartObj.cartItemMeshMap.get(cartHits[0].object.uuid);
                if (slot!==undefined) raycastCartSlotIdx = slot;
            }
        }

        // ショップ展示品レイキャスト
        raycastShopItemIdx = -1;
        if (shopDisplayItems.length > 0) {
            const shopMeshes = [];
            shopDisplayItems.forEach(si => { si.mesh.traverse(m=>{ if(m.isMesh) shopMeshes.push(m); }); });
            const shopHits = raycaster.intersectObjects(shopMeshes, false);
            if (shopHits.length > 0) {
                const idx = shopMeshToIdx.get(shopHits[0].object.uuid);
                if (idx !== undefined) raycastShopItemIdx = idx;
            }
        }

        currentAction=computeCurrentAction();
        const prompt=document.getElementById('interaction-prompt');
        const crosshairEl=document.getElementById('crosshair');
        if (currentAction) { prompt.style.display='block'; prompt.innerText=currentAction.label; }
        else { prompt.style.display='none'; }

        // クロスヘア色：アクションあり→緑、なし→白
        const hasAction = !!(currentAction && currentAction.type!=='putDown');
        crosshairEl.classList.toggle('active', hasAction);

        // ワールドアイテムハイライト
        const newHighlightIdx = raycastTargetIdx;
        if (newHighlightIdx !== highlightedItemIdx) {
            if (highlightedItemIdx>=0 && highlightedItemIdx<worldItems.length) {
                worldItems[highlightedItemIdx].group.traverse(m=>{
                    if (m.isMesh&&m.material&&m.material.emissive) m.material.emissive.set(0x000000);
                });
            }
            highlightedItemIdx = newHighlightIdx;
        }
        if (highlightedItemIdx>=0 && highlightedItemIdx<worldItems.length) {
            const blink = 0.4 + 0.4*Math.abs(Math.sin(now*0.005));
            // アクション有効なら緑、照準のみなら薄い白
            const actionable = currentAction && (currentAction.type==='pickup'||currentAction.type==='pour');
            const r = actionable ? 0.05*blink : 0.3*blink;
            const g = actionable ? 0.9*blink  : 0.3*blink;
            const b = actionable ? 0.1*blink  : 0.3*blink;
            worldItems[highlightedItemIdx].group.traverse(m=>{
                if (m.isMesh&&m.material&&m.material.emissive) m.material.emissive.set(new THREE.Color(r,g,b));
            });
        }

        // カートアイテムハイライト
        const newCartHighlight = raycastCartSlotIdx;
        if (newCartHighlight !== highlightedCartSlotIdx) {
            if (highlightedCartSlotIdx>=0 && cartObj && cartObj.slots[highlightedCartSlotIdx]) {
                cartObj.slots[highlightedCartSlotIdx].mesh.traverse(m=>{
                    if(m.isMesh&&m.material&&m.material.emissive) m.material.emissive.set(0x000000);
                });
            }
            highlightedCartSlotIdx = newCartHighlight;
        }
        if (highlightedCartSlotIdx>=0 && cartObj && cartObj.slots[highlightedCartSlotIdx]) {
            const blink2 = 0.45+0.45*Math.abs(Math.sin(now*0.005));
            cartObj.slots[highlightedCartSlotIdx].mesh.traverse(m=>{
                if(m.isMesh&&m.material&&m.material.emissive)
                    m.material.emissive.set(new THREE.Color(0.05*blink2,0.9*blink2,0.1*blink2));
            });
        }

        // ショップ展示品ハイライト（金色点滅）
        const newShopHighlight = raycastShopItemIdx;
        if (newShopHighlight !== highlightedShopItemIdx) {
            if (highlightedShopItemIdx>=0 && shopDisplayItems[highlightedShopItemIdx]) {
                shopDisplayItems[highlightedShopItemIdx].mesh.traverse(m=>{
                    if(m.isMesh&&m.material&&m.material.emissive) m.material.emissive.set(0x000000);
                });
            }
            highlightedShopItemIdx = newShopHighlight;
        }
        if (highlightedShopItemIdx>=0 && shopDisplayItems[highlightedShopItemIdx]) {
            const blink3 = 0.45+0.45*Math.abs(Math.sin(now*0.005));
            shopDisplayItems[highlightedShopItemIdx].mesh.traverse(m=>{
                if(m.isMesh&&m.material&&m.material.emissive)
                    m.material.emissive.set(new THREE.Color(0.9*blink3, 0.6*blink3, 0.0));
            });
        }

        autoSaveTimer+=delta;
        if (autoSaveTimer>=10) { autoSaveTimer=0; saveGame(true); }

        renderer.render(scene,camera);
    } catch(err) { console.error('Loop error:',err); }
    requestAnimationFrame(updateGame);
}

// ===== UI =====
function updateUI() {
    const L=I18N[currentLang];
    document.getElementById('ui-money').innerText=L.money+gameState.money;
    let heldText=L.heldNone;
    if (heldItem) {
        if (heldItem.type==='ladle') heldText=L.heldLadle(heldItem.hasOil);
        else heldText=L.heldCan(heldItem.fill);
    }
    if (cartObj && cartObj.isHeld) {
        const n = cartObj.slots.filter(s=>s!==null).length;
        heldText += ' / ' + L.heldCart(n);
    }
    document.getElementById('ui-held').innerText=heldText;
    document.getElementById('ui-hint').innerText=L.hintText;
    document.getElementById('btn-lang').innerText=currentLang==='ja'?'English':'日本語';
}

function toggleLanguage() {
    currentLang=currentLang==='ja'?'en':'ja';
    document.getElementById('btn-lang').innerText=currentLang==='ja'?'English':'日本語';
    updateUI();
}

function showNotification(msg) {
    const el=document.getElementById('notification');
    el.innerText=msg; el.style.opacity='1';
    setTimeout(()=>{ el.style.opacity='0'; },2500);
}

// ===== セーブ/ロード =====
function saveGame(isAuto=false) {
    gameState.playerPos.x=playerGroup.position.x;
    gameState.playerPos.z=playerGroup.position.z;
    gameState.savedWorldItems=worldItems.map(i=>({type:i.type,x:i.x,z:i.z,fill:i.fill,hasOil:i.hasOil}));
    gameState.savedHeldItem=heldItem?{...heldItem}:null;
    localStorage.setItem('oil_rush_save',JSON.stringify(gameState));
    showNotification(isAuto?I18N[currentLang].msgAutoSaved:I18N[currentLang].msgDataSaved);
}

function loadGame() {
    const data=localStorage.getItem('oil_rush_save');
    if (!data) return;
    try {
        const saved=JSON.parse(data);
        if (typeof saved.money!=='number') throw new Error('bad');
        // 旧データ移行
        if (saved.barrels!==undefined) { delete saved.barrels; delete saved.maxBarrels; }
        if (saved.emptyCans!==undefined) { delete saved.emptyCans; delete saved.filledCans; delete saved.savedCans; }
        if (!saved.playerPos) saved.playerPos={x:-35,z:0};
        if (saved.cameraYaw===undefined) saved.cameraYaw=0;
        if (saved.cameraPitch===undefined) saved.cameraPitch=0;
        Object.assign(gameState,saved);

        if (playerGroup) playerGroup.position.set(gameState.playerPos.x,0,gameState.playerPos.z);

        // カートリセット
        if (cartObj) {
            cartObj.slots.forEach((s,i)=>{
                if (s) { cartObj.group.remove(s.mesh); cartObj.slots[i]=null; }
            });
            cartObj.cartItemMeshMap.clear();
            cartObj.isHeld = false;
        }

        // ワールドアイテム再構築
        clearWorldItems();
        const items=gameState.savedWorldItems||getDefaultWorldItems();
        items.forEach(i=>spawnWorldItem(i.type,i.x,i.z,i.hasOil||false,i.fill||0,0.04));

        // 手持ち復元
        heldItem=gameState.savedHeldItem?{...gameState.savedHeldItem}:null;
        updateHeldMesh();
        updateUI();
        showNotification(I18N[currentLang].msgDataLoaded);
    } catch(e) { console.error(e); }
}

function clearWorldItems() {
    while (worldItems.length>0) { scene.remove(worldItems[0].group); worldItems.splice(0,1); }
}

function getDefaultWorldItems() {
    return [
        {type:'ladle',   x:-44.3, z:7.7,  fill:0, hasOil:false},
        {type:'jerryCan',x:-45.0, z:8.3,  fill:0, hasOil:false},
        {type:'jerryCan',x:-45.8, z:8.9,  fill:0, hasOil:false},
    ];
}

function initWorldItemsDefault() {
    clearWorldItems();
    getDefaultWorldItems().forEach(i=>spawnWorldItem(i.type,i.x,i.z,i.hasOil,i.fill,0.88));
}

function openDataModal() {
    document.getElementById('data-modal').style.display='flex';
    document.getElementById('modal-title').innerText=I18N[currentLang].modalTitle;
    document.getElementById('data-textarea').value='';
}
function closeDataModal() { document.getElementById('data-modal').style.display='none'; }

function exportData() {
    gameState.playerPos.x=playerGroup.position.x;
    gameState.playerPos.z=playerGroup.position.z;
    gameState.savedWorldItems=worldItems.map(i=>({type:i.type,x:i.x,z:i.z,fill:i.fill,hasOil:i.hasOil}));
    gameState.savedHeldItem=heldItem?{...heldItem}:null;
    document.getElementById('data-textarea').value=btoa(JSON.stringify(gameState));
}

function importData() {
    const text=document.getElementById('data-textarea').value.trim();
    try {
        const json=JSON.parse(atob(text));
        if (typeof json.money!=='number') throw new Error();
        Object.assign(gameState,json);
        if (!gameState.playerPos) gameState.playerPos={x:-35,z:0};
        playerGroup.position.set(gameState.playerPos.x,0,gameState.playerPos.z);
        clearWorldItems();
        const items=gameState.savedWorldItems||getDefaultWorldItems();
        items.forEach(i=>spawnWorldItem(i.type,i.x,i.z,i.hasOil||false,i.fill||0,0.04));
        heldItem=gameState.savedHeldItem?{...gameState.savedHeldItem}:null;
        updateHeldMesh(); updateUI(); saveGame(); closeDataModal();
        showNotification(I18N[currentLang].msgImportOk);
    } catch(e) { alert(I18N[currentLang].msgImportFail); }
}

// ===== 初期化 =====
window.addEventListener('DOMContentLoaded',()=>{
    initThree();
    const hasSave=!!localStorage.getItem('oil_rush_save');
    if (hasSave) {
        loadGame();
    } else {
        initWorldItemsDefault();
        updateUI();
    }
    requestAnimationFrame(updateGame);
});
</script>
</body>
</html>
